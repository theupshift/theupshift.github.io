<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b35352">
  <title>Offline · MedED Resources</title>
  <link rel="icon" href="/med/icons/meded.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#f8f5f3;color:#302727;padding:24px;box-sizing:border-box}
    main{max-width:460px;text-align:center;padding:32px 24px;border:1px solid #e4d8d6;border-radius:18px;background:#fff;box-shadow:0 8px 30px #3027270d}
    .mark{width:58px;height:58px;margin:0 auto 18px;display:block}
    h1{font-size:1.55rem;font-weight:650;margin:0 0 12px}
    p{line-height:1.65;color:#665b5a;margin:0 0 20px}
    a{display:inline-block;padding:11px 17px;border-radius:9px;background:#b35352;color:#fff;text-decoration:none;font-weight:600}
    @media(prefers-color-scheme:dark){body{background:#191213;color:#f5eeee}main{background:#241b1c;border-color:#473638}p{color:#cbbcbc}}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/med/icons/meded.svg" alt="">
    <h1>You’re offline</h1>
    <p>The MedED app shell is saved on this device, but the live resource index or selected learning files may need an internet connection. Reconnect and try again to load the full library.</p>
    <a href="/med/">Return to MedED</a>
  </main>
</body>
</html>
