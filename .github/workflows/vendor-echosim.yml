name: Vendor EchoSim into MedED

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/vendor-echosim.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MedED
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Copy the complete EchoDemo source into MedED
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/douyang/echodemo.git /tmp/echodemo
          mkdir -p med/echosim
          rsync -a --delete --exclude='.git' /tmp/echodemo/ med/echosim/
          cat > med/echosim/SOURCE.md <<'EOF'
          # EchoSim source

          This directory contains a local copy of the source files from
          https://github.com/douyang/echodemo.

          The application files and assets are stored in this MedED repository so
          the deployed EchoSim page can load them from the same GitHub Pages site.
          The upstream repository did not include a LICENSE file at the time of
          copying; this note records provenance and does not grant additional rights.
          EOF

      - name: Remove the one-time copy workflow and commit the vendored files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vendor-echosim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A med/echosim .github/workflows/vendor-echosim.yml
          git commit -m "Vendor EchoSim source and assets locally"
          git push origin HEAD:master
