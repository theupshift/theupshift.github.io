<header class="top"><div class="brand">Chronic Diarrhoea</div><div class="tag">Is It IBD?</div><div class="credit">Clinical Rhythm</div></header>

<script>
const S=[
{t:"title",h:'<div class="wrap left"><div class="k">Clinical Reasoning • Interactive Case</div><h1>Chronic<br>Diarrhoea</h1><p class="lead">A patient with chronic bloody diarrhoea. <b>Is it IBD?</b></p><p class="muted">Follow the evidence from phenotype to endoscopy, histology, treatment and follow-up.</p><p class="source">Clinical Rhythm • Educational simulation</p></div>'},
{h:'<div class="wrap left"><div class="k">01 • The Syndrome</div><h2>Start with the phenotype</h2><div class="grid"><div class="card"><strong>Chronic</strong><span>&gt;4 weeks</span></div><div class="card"><strong>Inflammatory</strong><span>blood, mucus, urgency, nocturnal symptoms</span></div><div class="card"><strong>Watery</strong><span>osmotic or secretory patterns</span></div><div class="card"><strong>Fatty</strong><span>malabsorption / maldigestion</span></div></div><div class="call"><b>First question:</b> What does the stool phenotype tell you before you order everything?</div><p>Blood, tenesmus, nocturnal diarrhoea, weight loss and inflammatory markers move the case away from a purely functional disorder.</p></div>'},
{q:"A 29-year-old has 5 months of loose stools. Which feature most strongly argues against IBS-D as the sole diagnosis?",o:["Symptoms improve after defecation","Bloating after meals","Nocturnal bloody diarrhoea with weight loss","Symptoms worsen during examinations"],c:2,w:"Nocturnal diarrhoea, rectal bleeding and weight loss are alarm features and should trigger evaluation for organic disease, including endoscopy when indicated."},
{h:'<div class="wrap left"><div class="k">02 • Case Presentation</div><h2>Meet Amina</h2><div class="art-card"><svg class="clinical-art" viewBox="0 0 720 240" role="img" aria-label="Simple clinical illustration of a patient with abdominal discomfort"><rect x="20" y="20" width="680" height="200" rx="18" fill="#efe8dc"/><circle cx="165" cy="92" r="42" fill="#d6a27e"/><path d="M123 83q42-62 84 0v25h-84z" fill="#4d3b39"/><path d="M115 145q50-38 100 0l35 62H80z" fill="#6f7e91"/><path d="M145 143q-10 44 0 72M185 143q10 44 0 72" stroke="#4b4a78" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M300 75h250M300 112h200M300 149h230" stroke="#b7aa98" stroke-width="10" stroke-linecap="round"/><circle cx="570" cy="70" r="28" fill="#fff" stroke="#557f91" stroke-width="4"/><path d="M555 70h30M570 55v30" stroke="#557f91" stroke-width="4"/></svg></div><p class="lead">Amina is a 29-year-old teacher with <b>5 months of frequent loose stools</b>.</p><ul><li>6–8 stools/day, often with <b>blood and mucus</b></li><li>Urgency and occasional tenesmus</li><li>Two episodes waking her at night each week</li><li>Lower abdominal cramping</li><li>7-kg unintentional weight loss</li><li>No recent antibiotics; no previous IBD diagnosis</li></ul><p>No convincing food trigger; lactose-free diet did not resolve symptoms.</p></div>'},
{h:'<div class="wrap right"><div class="k">03 • Examination</div><h2>Look for inflammatory clues</h2><div class="vitals"><div class="v"><small>Temp</small><strong>37.4 °C</strong></div><div class="v"><small>HR</small><strong>96</strong></div><div class="v flag"><small>BMI</small><strong>19.1</strong></div><div class="v"><small>BP</small><strong>108/68</strong></div></div><div class="card"><ul><li>Pale conjunctivae</li><li>Mild left lower-quadrant tenderness</li><li>No perianal fistula or abscess</li><li>No palpable mass</li><li>No arthritis, uveitis or skin manifestations</li></ul></div><p class="muted">Absence of extraintestinal manifestations does not exclude IBD.</p></div>'},
{q:"Which differential framework is most useful at this stage?",o:["Only IBS vs IBD","Watery, inflammatory or fatty diarrhoea, then narrow the causes","Only infectious vs non-infectious","Only coeliac disease vs lactose intolerance"],c:1,w:"The chronic-diarrhoea teaching deck recommends first categorising the phenotype as watery, inflammatory or fatty, then narrowing the differential by context."},
{h:'<div class="wrap left"><div class="k">04 • First-Line Testing</div><h2>Do not jump straight to biologics</h2><div class="grid3"><div class="card"><strong>Blood</strong><span>FBC, CRP/ESR, electrolytes, renal function, albumin, iron studies</span></div><div class="card"><strong>Stool</strong><span>C. difficile when relevant; bacterial/parasitic testing according to risk</span></div><div class="card"><strong>Mimics</strong><span>tTG-IgA + total IgA; medication and epidemiologic review</span></div></div><div class="call"><b>Key biomarker:</b> faecal calprotectin supports detection of intestinal inflammation.</div></div>'},
{h:'<div class="wrap right"><div class="k">05 • Results</div><h2>The pattern is inflammatory</h2><div class="vitals"><div class="v flag"><small>Hb</small><strong>10.4 g/dL</strong></div><div class="v flag"><small>Platelets</small><strong>548 ×10⁹/L</strong></div><div class="v flag"><small>CRP</small><strong>72 mg/L</strong></div><div class="v flag"><small>Albumin</small><strong>29 g/L</strong></div></div><div class="card"><p><b>Stool culture:</b> no invasive bacterial pathogen.</p><p><b>C. difficile:</b> negative.</p><p><b>Giardia:</b> negative.</p><p><b>Coeliac screen:</b> not suggestive.</p><p><b>Faecal calprotectin:</b> <b>1,240 µg/g</b>.</p></div></div>'},
{q:"What does a faecal calprotectin of 1,240 µg/g mean here?",o:["It proves ulcerative colitis","It supports significant intestinal inflammation but is not disease-specific","It proves colorectal cancer","It is compatible with uncomplicated IBS-D"],c:1,w:"Calprotectin is a marker of intestinal inflammation. It supports an inflammatory process but does not by itself distinguish UC from Crohn disease or infection."},
{h:'<div class="wrap left"><div class="k">06 • The Next Investigation</div><h2>Endoscopy earns its place</h2><p class="lead">Amina has alarm features plus objective inflammation.</p><div class="card"><p><b>Ileocolonoscopy with segmental biopsies</b> is appropriate when feasible.</p><ul><li>Inspect rectum, colon and terminal ileum.</li><li>Document extent and endoscopic severity.</li><li>Biopsy inflamed and apparently uninflamed segments.</li><li>Use histology to assess chronicity and distinguish IBD from mimics.</li></ul></div><div class="call"><b>Acute severe colitis:</b> flexible sigmoidoscopy may be safer for initial confirmation.</div></div>'},
{h:'<div class="wrap center"><div class="k">07 • Colonoscopy</div><h2>What do you see?</h2><div class="art-card"><svg class="clinical-art" viewBox="0 0 720 230" role="img" aria-label="Simplified colon illustration showing continuous left-sided inflammation"><path d="M210 45c-80 0-105 45-105 90s25 70 80 70h280c55 0 80-25 80-70s-25-90-105-90h-45v42h45c28 0 48 15 48 48s-20 38-48 38H185c-28 0-48-15-48-38s20-48 48-48h45V45z" fill="#ead0c7" stroke="#a46d67" stroke-width="8"/><path d="M137 128h112M251 128h82M333 128h82M415 128h48" stroke="#a94646" stroke-width="24" stroke-linecap="round" stroke-dasharray="8 12"/><path d="M470 128h75" stroke="#b9b2a6" stroke-width="24" stroke-linecap="round"/><text x="102" y="28" fill="#a94646" font-size="18" font-family="Georgia">rectum → splenic flexure</text></svg></div><div class="card"><p><b>Continuous inflammation begins at the rectum and extends to the splenic flexure.</b></p><p>Loss of vascular pattern, granularity, friability and superficial ulceration. Terminal ileum normal.</p></div></div>'},
{q:"Which diagnosis best fits the endoscopic distribution?",o:["Crohn disease with skip lesions","Ulcerative colitis with left-sided disease","Microscopic colitis","Ischaemic colitis"],c:1,w:"Continuous confluent inflammation with rectal involvement is characteristic of UC. Crohn disease more often has patchy/skip involvement and may show ileal or transmural complications."},
{h:'<div class="wrap left"><div class="k">08 • UC vs Crohn</div><h2>Pattern matters</h2><div class="grid"><div class="card"><h3>Ulcerative colitis</h3><ul><li>Colon</li><li>Usually starts at rectum</li><li>Continuous/confluent</li><li>Mucosal-predominant inflammation</li><li>Superficial ulceration and friability</li></ul></div><div class="card"><h3>Crohn disease</h3><ul><li>Any GI segment</li><li>Skip lesions</li><li>Transmural inflammation</li><li>Strictures/fistulas possible</li><li>Granulomas may support diagnosis</li></ul></div></div></div>'},
{h:'<div class="wrap right"><div class="k">09 • Histology</div><h2>The microscope confirms chronicity</h2><div class="art-card"><svg class="clinical-art" viewBox="0 0 720 220" role="img" aria-label="Stylised histology illustration of chronic active colitis"><rect x="18" y="18" width="684" height="184" rx="14" fill="#e9c7be" stroke="#b5a796"/><g fill="#765477" stroke="#5e435f" stroke-width="2"><circle cx="110" cy="75" r="16"/><circle cx="150" cy="105" r="12"/><circle cx="210" cy="68" r="14"/><circle cx="280" cy="116" r="18"/><circle cx="360" cy="76" r="13"/><circle cx="430" cy="125" r="16"/><circle cx="520" cy="75" r="15"/><circle cx="600" cy="115" r="13"/></g><g fill="none" stroke="#9a6c66" stroke-width="7"><path d="M80 165q35-60 70 0M185 165q35-80 70 0M330 165q35-70 70 0M490 165q35-80 70 0M570 165q35-55 70 0"/></g><text x="36" y="45" fill="#4b4a78" font-size="17" font-family="Georgia">crypt architectural distortion • basal plasmacytosis</text></svg></div><div class="card" style="margin-top:12px"><ul><li>Chronic active colitis</li><li>Crypt architectural distortion</li><li>Basal plasmacytosis</li><li>Cryptitis and crypt abscesses</li><li>No granulomas identified</li></ul><p class="muted">Interpret histology with the clinical and endoscopic pattern; no single feature is diagnostic alone.</p></div></div>'},
{h:'<div class="wrap left"><div class="k">10 • Extent</div><h2>How far does it go?</h2><div class="grid3"><div class="card"><strong>Proctitis</strong><span>rectum only</span></div><div class="card"><strong>Left-sided</strong><span>to, but not beyond, the splenic flexure</span></div><div class="card"><strong>Extensive</strong><span>proximal to the splenic flexure</span></div></div><div class="call"><b>Amina:</b> rectum → sigmoid → descending colon, stopping at the splenic flexure = <b>left-sided UC</b>.</div></div>'},
{h:'<div class="wrap right"><div class="k">11 • Severity</div><h2>Severity is more than stool count</h2><p class="lead">Combine symptoms, inflammatory burden, disease course and impact.</p><div class="score"><div><b>6–8</b><span>stools/day</span></div><div><b>+</b><span>visible blood</span></div><div><b>72</b><span>CRP mg/L</span></div><div><b>29</b><span>albumin g/L</span></div></div><div class="call"><b>Endoscopic severity:</b> report a validated scale such as Mayo Endoscopic Score or UCEIS.</div></div>'},
{h:'<div class="wrap center"><div class="k">12 • Endoscopic Severity</div><h2>Mayo Endoscopic Score</h2><div class="grid"><div class="card"><strong>0</strong><span>normal/inactive</span></div><div class="card"><strong>1</strong><span>mild erythema / decreased vascular pattern</span></div><div class="card"><strong>2</strong><span>marked erythema, absent vascular pattern, friability, erosions</span></div><div class="card"><strong>3</strong><span>spontaneous bleeding and ulceration</span></div></div><p class="lead" style="margin-top:16px">Amina’s most affected segment is <b>Mayo 2</b>.</p></div>'},
{q:"What is the best treatment principle for this patient?",o:["Long-term oral prednisolone alone","No treatment until calprotectin normalises","Treat according to severity and risk, aiming for steroid-free remission; 5-ASA is a key option in appropriate mild–moderate UC","Loperamide alone"],c:2,w:"For appropriate mild–moderate UC, oral and/or rectal mesalamine is a key option. Corticosteroids may induce remission but should not be maintenance therapy; moderate–severe disease may require advanced therapy."},
{h:'<div class="wrap left"><div class="k">13 • Treatment</div><h2>Make the plan specific</h2><div class="grid"><div class="card"><h3>Appropriate mild–moderate left-sided UC</h3><ul><li>Oral mesalamine</li><li>Add rectal mesalamine when appropriate</li><li>Escalate if response is inadequate</li></ul></div><div class="card"><h3>Moderate–severe / high-risk disease</h3><ul><li>Consider advanced therapies matched to severity, prior therapy, safety and preference</li><li>Steroids are induction therapy, not maintenance</li><li>Plan monitoring and preventive care</li></ul></div></div></div>'},
{h:'<div class="wrap right"><div class="k">14 • Follow-Up</div><h2>Clinical remission is not the whole target</h2><div class="timeline"><div class="time">Week 4</div><div>Stools fall to 3/day; bleeding stops.</div><div class="time">Month 3</div><div>CRP normalises; calprotectin falls to 180 µg/g.</div><div class="time">Month 6</div><div>Sigmoidoscopy shows Mayo 1.</div><div class="time">Target</div><div>Durable steroid-free remission with objective endoscopic improvement.</div></div><div class="call"><b>Treat-to-target:</b> symptoms and biomarkers help monitor response, while objective mucosal assessment remains important.</div></div>'},
{h:'<div class="wrap left"><div class="k">15 • The Twist</div><h2>What if C. difficile were positive?</h2><p class="lead">Do not automatically label every episode of bloody diarrhoea an IBD flare.</p><div class="card"><ul><li>Recognise infection as a potential driver of inflammation.</li><li>Treat the relevant infection.</li><li>Reassess the inflammatory syndrome afterwards.</li><li>In established IBD, infection and inflammatory activity can coexist.</li></ul></div></div>'},
{h:'<div class="wrap center"><div class="k">16 • Case Summary</div><h2>Diagnosis</h2><div class="card"><p class="lead"><b>Ulcerative colitis — left-sided disease, endoscopically active.</b></p><p>Chronic bloody diarrhoea + nocturnal symptoms + weight loss + anaemia/inflammation + high faecal calprotectin + continuous rectum-to-splenic-flexure colitis + supportive histology.</p></div><div class="grid" style="margin-top:12px"><div class="card"><strong>Think pattern</strong><span>Inflammatory diarrhoea is a syndrome, not a diagnosis.</span></div><div class="card"><strong>Prove it</strong><span>Endoscopy + biopsies establish phenotype, extent and chronicity.</span></div></div></div>'},
{h:'<div class="wrap left"><div class="k">17 • Take-Home</div><h2>Five moves</h2><ol><li><b>Recognise red flags</b> — blood, nocturnal diarrhoea, weight loss, anaemia and inflammation.</li><li><b>Classify the diarrhoea</b> — watery, inflammatory or fatty.</li><li><b>Exclude infection and common mimics.</b></li><li><b>Use calprotectin as an inflammation clue, not a disease label.</b></li><li><b>Confirm and stage IBD objectively</b> with ileocolonoscopy/biopsies when appropriate, then treat to a defined target.</li></ol><div class="source"><b>Sources</b><br>Winter RW. <i>Inflammatory Bowel Disease: An Overview</i> (uploaded teaching deck). Smith BN. <i>Acute and Chronic Diarrhea</i> (uploaded teaching deck). Current guidance: ACG 2025 UC update; ECCO-ESGAR diagnostics guidance.<br><br><a href="https://gi.org/journals-publications/ebgi/alkazzi_aug2025/" target="_blank">ACG 2025 UC update</a> · <a href="https://academic.oup.com/ecco-jcc/article/19/7/jjaf106/8219802" target="_blank">ECCO-ESGAR diagnostics</a></div></div>'},
{t:"title",h:'<div class="wrap center"><div class="k">Clinical Rhythm</div><h2>Case complete</h2><p class="lead">Chronic diarrhoea is a syndrome. The diagnosis emerges from the pattern.</p><p class="muted">Use Back to revisit any decision point.</p></div>'}
];
let i=0,ans={};const stage=document.getElementById("stage"),bar=document.getElementById("bar"),count=document.getElementById("count");
function render(){stage.innerHTML="";S.forEach((s,n)=>{let d=document.createElement("section");d.className="slide "+(n===i?"active":"");if(s.q){d.innerHTML='<div class="wrap left"><div class="k">Clinical Decision</div><h2>What would you choose?</h2><p class="lead">'+s.q+'</p><div class="opts">'+s.o.map((x,j)=>'<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</button>').join("")+'</div><div class="fb" hidden></div></div>'}else d.innerHTML=s.h;stage.appendChild(d);if(s.q)wire(d,s,n)});update()}
function wire(d,s,n){let os=[...d.querySelectorAll(".opt")],fb=d.querySelector(".fb");if(ans[n]!=null)show(ans[n]);os.forEach((b,j)=>b.onclick=()=>{if(ans[n]!=null)return;ans[n]=j;show(j)});function show(j){os.forEach((b,k)=>b.classList.add(k===s.c?"correct":k===j?"wrong":"dim"));fb.hidden=false;fb.innerHTML=(j===s.c?"<b>Correct.</b> ":"<b>Not quite.</b> ")+s.w}}
function update(){bar.innerHTML="";S.forEach((_,n)=>{let b=document.createElement("button");b.className="seg "+(n<i?"done ":"")+(n===i?"now":"");b.onclick=()=>{i=n;render()};bar.appendChild(b)});count.textContent=(i+1)+" / "+S.length;document.getElementById("back").disabled=i===0;document.getElementById("next").disabled=i===S.length-1}
document.getElementById("next").onclick=()=>{if(i<S.length-1){i++;render()}};document.getElementById("back").onclick=()=>{if(i){i--;render()}};document.getElementById("reset").onclick=()=>{i=0;ans={};render()};document.addEventListener("keydown",e=>{if(e.target.closest("button,a"))return;if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("back").click()});render();
</script></body></html>
