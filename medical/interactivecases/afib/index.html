/* Upshift visual alignment: harmonised with the Cirrhosis interactive case */
:root{
  --ink:#1d1b19;--muted:#4f4a42;--faint:#7e786e;
  --cream:#e9e3d7;--paper:#f9f7f1;--line:#d6cfc1;
  --nav:#ffffff;--purple:#4b4a78;--purple2:#34345e;
  --blue:#547f92;--rose:#a45d65;--gold:#ae8845;--plum:#87699a;
  --green:#3e7954;--red:#a84545;--shadow:0 22px 55px rgba(43,37,28,.18);
}
body{background:#bbb5aa;color:var(--ink);font-family:Georgia,"Times New Roman",Times,serif;text-rendering:optimizeLegibility}
.app{background:var(--cream)}
.topbar{background:#fff;border-bottom-color:#dad6ce;padding:0 28px;color:var(--ink)}
.case-title{font-family:Georgia,"Times New Roman",Times,serif;font-size:19px;line-height:1;letter-spacing:.14em}
.act-tag{border-left-color:#e6e1d8;color:#6f685f;font-family:Georgia,"Times New Roman",Times,serif}
.topbtn,.navbtn{border:1px solid #d4cec2;background:#fff;color:#34322f;font-family:Georgia,"Times New Roman",Times,serif;transition:background .14s ease,border-color .14s ease,color .14s ease}
.topbtn:hover,.navbtn:hover:not(:disabled){background:#f5f2ec;border-color:#aaa397}
.stage{background:linear-gradient(120deg,#e9e3d7 0%,#ded9cf 52%,#d2cec5 100%)}
.stage:before{background:linear-gradient(120deg,rgba(249,247,241,.22),transparent 55%,rgba(75,74,120,.035));}
.slide{padding:44px clamp(34px,5vw,88px) 32px}
.stack{max-width:680px}
.stack.wide{max-width:780px}
.kicker{color:var(--purple);font-family:Georgia,"Times New Roman",Times,serif;letter-spacing:.20em}
.slide h1,.slide h2,.slide h3{font-family:Georgia,"Times New Roman",Times,serif;color:var(--ink)}
.slide h1{font-size:clamp(42px,5.8vw,76px);font-weight:normal;line-height:.99;letter-spacing:-.035em}
.slide h2{font-size:clamp(32px,4.7vw,58px);font-weight:normal;line-height:1.02;letter-spacing:-.03em}
.slide h3{font-weight:bold}
.lead{font-family:Georgia,"Times New Roman",Times,serif;line-height:1.48}
.slide p,.slide li{line-height:1.58}
.rule{background:#bdb5a8}
.panel,.question,.score-tool,.results-summary{border-color:#d6cfc1;background:rgba(249,247,241,.90);border-radius:2px;box-shadow:none}
.panel{padding:16px 18px}
.panel h3{font-family:Georgia,"Times New Roman",Times,serif}
.tag{color:var(--purple);border-color:#4b4a7855}
.callout{border-left-color:var(--purple);background:rgba(249,247,241,.92)}
.callout.warn{border-color:var(--rose)}.callout.good{border-color:var(--green)}
table{background:rgba(249,247,241,.94);font-family:Georgia,"Times New Roman",Times,serif}
th,td{border-color:#d6cfc1}
th{background:#e5dfd3}
.question{padding:20px 22px}
.answer{border-color:#d6cfc1;background:#fff;color:var(--ink);font-family:Georgia,"Times New Roman",Times,serif;border-radius:2px;transition:background .14s ease,border-color .14s ease}
.answer:hover:not(:disabled),.answer:focus-visible{border-color:var(--purple);outline:2px solid #4b4a7826}
.answer .letter{background:#e9e3d7;font-family:Georgia,"Times New Roman",Times,serif}
.answer.correct{border-color:var(--green);background:#edf3ec}.answer.correct .letter{background:var(--green)}
.answer.wrong{border-color:var(--red);background:#f7ecea}.answer.wrong .letter{background:var(--red)}
.feedback,.score-result{background:#f0ece3;border-left-color:var(--purple)}
.score-grid label{border-color:#d6cfc1;background:#fff;font-family:Georgia,"Times New Roman",Times,serif}
.score-grid input{accent-color:var(--purple)}
.score-number,.metric{color:var(--purple);font-family:Georgia,"Times New Roman",Times,serif}
.result-row,.results-scenarios details{border-color:#d6cfc1}
.reveal-panel{border-left-color:var(--gold);background:#f1ece1}
.chapter-pill{background:var(--purple);font-family:Georgia,"Times New Roman",Times,serif}
.timeline{border-left-color:#c4bbad}
.timeline .event:before{background:var(--purple)}
.nav{background:#fff;border-top-color:#dad6ce;padding:0 28px}
.navbtn{padding:11px 15px;letter-spacing:.10em}
.navbtn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.navbtn.primary:hover:not(:disabled){background:var(--purple2);border-color:var(--purple2)}
.navchapter{color:var(--purple)}
.navtitle{font-family:Georgia,"Times New Roman",Times,serif;color:#49443d}
.progress{background:#e5dfd3}.progressfill{background:var(--purple)}
.counter{color:#6f685f}
.ecg{border-color:#d6cfc1;background:#fff}
@media(max-width:680px){
  .topbar{padding:0 14px;gap:8px}.case-title{font-size:14px;letter-spacing:.10em}
  .act-tag{font-size:10px;padding-left:9px}
  .slide{padding:28px 20px 24px}
  .nav{height:64px;flex-basis:64px;padding:0 12px;gap:8px}
  .navbtn{padding:10px 9px;font-size:10px}
  .navtitle{font-size:12px}
  .panel{padding:13px 14px}
}


/* Clinical graphics: warm-paper diagrams, restrained colour, accessible labels */
.decision-map{margin:22px 0 24px;padding:18px;background:rgba(249,247,241,.94);border:1px solid #d6cfc1;box-shadow:0 8px 22px rgba(43,37,28,.06)}
.decision-node{max-width:370px;margin:0 auto;padding:14px 18px;text-align:center;border:1px solid #c7c0b4;background:#fff;border-radius:3px}
.decision-step{display:block;font:700 10px/1.4 system-ui,sans-serif;letter-spacing:.16em;color:var(--purple);margin-bottom:4px}
.decision-node strong,.decision-branch strong{display:block;font:normal 20px/1.2 Georgia,serif}
.decision-node small,.decision-branch small{display:block;margin-top:5px;color:var(--muted);font:13px/1.45 system-ui,sans-serif}
.decision-stem{height:22px;width:1px;background:#b9b0a2;margin:auto}
.decision-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.decision-branch{padding:14px 16px;border-top:3px solid var(--blue);background:#f2f0e8;min-width:0}
.decision-branch.danger{border-color:var(--rose);background:#f7eeeb}
.decision-branch.stable{border-color:var(--blue);background:#edf2f1}
.decision-answer{display:block;font:700 10px/1.4 system-ui,sans-serif;letter-spacing:.15em;color:var(--muted);margin-bottom:6px}
.decision-foot{text-align:center;color:#625d55;font:italic 14px/1.45 Georgia,serif;border-top:1px solid #d6cfc1;margin-top:14px;padding-top:12px}
.rhythm-visuals{display:grid;gap:10px;margin:18px 0 20px}
.rhythm-visual{border:1px solid #d6cfc1;background:#fffdf8;padding:10px 12px 7px}
.rhythm-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rhythm-name b{font:700 13px system-ui,sans-serif;color:var(--ink)}
.rhythm-name small{font:12px system-ui,sans-serif;color:var(--muted);margin-left:auto}
.rhythm-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--purple)}
.rhythm-dot.flutter{background:var(--gold)}.rhythm-dot.svt{background:var(--blue)}
.rhythm-visual svg{display:block;width:100%;height:auto;max-height:82px}
.rhythm-disclaimer{font:italic 12px/1.45 Georgia,serif!important;color:var(--muted);margin:7px 2px 0!important}
.strategy-visual{margin:18px 0 22px;padding:17px;background:rgba(249,247,241,.95);border:1px solid #d6cfc1}
.strategy-lane{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:#fff;border-left:4px solid var(--purple)}
.strategy-lane.rate-lane{border-left-color:var(--blue)}.strategy-lane.rhythm-lane{border-left-color:var(--plum)}
.strategy-icon{width:38px;height:38px;border:1px solid #d6cfc1;display:grid;place-items:center;border-radius:50%;font:24px Georgia,serif;color:var(--purple)}
.strategy-lane span{display:block;font:700 10px system-ui,sans-serif;letter-spacing:.13em;color:var(--muted);margin-bottom:3px}
.strategy-lane strong{display:block;font:normal 20px/1.2 Georgia,serif}

/* Deeper polish pass · editorial rhythm, clearer hierarchy, and clinical-graphic consistency */
:root{

  --line-strong:#bdb5a8;

html{scroll-behavior:smooth}
body{background:#bcb6ac}

.answer:focus-visible,.score-controls button:focus-visible{
  outline:3px solid var(--focus-ring);outline-offset:2px
}
.stage{background:linear-gradient(125deg,#e9e3d7 0%,#e2ddd3 58%,#d8d2c8 100%)}

  radial-gradient(ellipse at 86% 13%,rgba(255,255,255,.46),transparent 37%),

.slide{padding-top:clamp(30px,5.5vh,58px);padding-bottom:clamp(26px,4vh,42px)}

.slide h1{max-width:790px;margin-bottom:24px}

table{margin:0;background:transparent;font-size:14px}

.chart-mode:not(.active):hover{background:#f1ece1;border-color:#aaa397}

.chart-row{grid-template-columns:minmax(125px,180px) minmax(90px,1fr) 78px;gap:12px;margin:15px 0}
.chart-label{font:13px/1.4 system-ui,sans-serif}

.chart-bar.b{background:#718c98}

.decision-map{padding:22px;background:rgba(249,247,241,.95);border-top:3px solid var(--purple);box-shadow:none}

@media(max-width:760px){

.afib-case .slide.has-image-bg{background-size:cover;background-repeat:no-repeat}

.afib-case .slide.has-image-bg.image-focus-right{background-position:right center}

.afib-case .slide.has-image-bg.image-focus-right .stack{max-width:500px;margin-left:0;margin-right:auto;padding:17px 19px;background:rgba(249,247,241,.76);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
@media(max-width:760px){
 .afib-case .slide.has-image-bg{background-position:center center}

 .afib-case .slide.has-image-bg.image-focus-left .stack,.afib-case .slide.has-image-bg.image-focus-right .stack{max-width:100%;margin:0;padding:14px 15px;background:rgba(249,247,241,.80)}

}


/* Compact the complete slide content to 85% and keep long-slide headings in view. */
.afib-case .slide{align-items:flex-start}
.afib-case .slide .stack{
  zoom:.85;
  width:117.647%;
  max-width:823.529px;
  margin:0 auto;
}
.afib-case .slide .stack.wide{max-width:1058.824px}
@media(max-width:760px){
  .afib-case .slide{align-items:flex-start}
  .afib-case .slide .stack,
  .afib-case .slide .stack.wide{max-width:117.647%;width:117.647%;margin:0 auto}
  .afib-case .slide.has-image-bg.image-focus-left .stack,
  .afib-case .slide.has-image-bg.image-focus-right .stack{width:117.647%;max-width:117.647%;margin:0 auto}
}


/* Slide 1 objectives: borrow the numbered, editorial learning-objective treatment
   used on the Cirrhosis case while keeping the AF/SVT cover title intact. */
.afib-case .afib-objectives{max-width:790px;margin:20px 0 0;padding:0}
.afib-case .afib-objectives h3{font-size:clamp(27px,3vw,36px);line-height:1.04;letter-spacing:-.025em;color:var(--purple2);margin:0 0 10px}
.afib-case .afib-objectives-intro{font-size:18px!important;line-height:1.35!important;margin:0 0 8px!important;color:var(--muted)}
.afib-case .afib-objectives-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:0;max-width:790px;margin:0;padding:0;list-style:none;counter-reset:afibobjective}
.afib-case .afib-objectives-list li{counter-increment:afibobjective;display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:start;margin:0;padding:11px 0;border-top:1px solid #8e877a55;font-size:14px;line-height:1.35}
.afib-case .afib-objectives-list li:before{content:counter(afibobjective,decimal-leading-zero);display:grid;place-items:center;width:30px;height:30px;border:1px solid #2457a688;border-radius:50%;background:#fbfdff9c;color:var(--purple2);font-size:10px;font-weight:800;letter-spacing:.06em}
.afib-case .afib-objectives-list strong{display:block;color:var(--purple2);font-size:17px;line-height:1.1;margin:1px 0 4px}
.afib-case .afib-objectives-list span{display:block;color:var(--muted)}
.afib-case .afib-objectives-note{font-size:12px!important;line-height:1.4!important;color:var(--muted);margin:12px 0 0!important}
@media(max-width:680px){
 .afib-case .afib-objectives{margin-top:15px}
 .afib-case .afib-objectives h3{font-size:26px}
 .afib-case .afib-objectives-intro{font-size:16px!important}
 .afib-case .afib-objectives-list{grid-template-columns:1fr;column-gap:0}
 .afib-case .afib-objectives-list li{grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;font-size:13px}
 .afib-case .afib-objectives-list li:before{width:27px;height:27px;font-size:9px}
 .afib-case .afib-objectives-list strong{font-size:16px}
}


/* Slide 2: focused concept + animated conduction-system schematic */
.afib-case .tachycardia-concept{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;margin:2px auto 0;max-width:1040px}
.afib-case .heart-simulation{background:linear-gradient(145deg,#f8f2e9,#f2e8e0);border:1px solid #ded1c7;padding:10px 12px 10px;box-shadow:0 10px 28px rgba(66,47,48,.07);width:100%;max-width:1000px;margin:0 auto}
.afib-case .heart-sim-intro{text-align:center;max-width:760px;margin:0 auto 2px;font:15px/1.35 system-ui,sans-serif;color:var(--ink)}
.afib-case .heart-sim-intro strong{display:block;font:700 clamp(19px,2.3vw,25px)/1.25 Georgia,"Times New Roman",serif}
.afib-case .heart-sim-intro p{margin:2px 0 0;color:var(--muted)}
.afib-case .heart-sim-intro .svt-definition-detail{max-width:920px;margin:8px auto 0;font:14px/1.55 system-ui,sans-serif;color:var(--muted)}
.afib-case .reveal-rhythm-model{display:block;margin:14px auto 0;padding:12px 22px;border:0;border-radius:7px;background:#4b4a78;color:#fff;font:700 15px/1.2 system-ui,sans-serif;cursor:pointer}
.afib-case .reveal-rhythm-model:hover,.afib-case .reveal-rhythm-model:focus-visible{background:#36355f}
.afib-case .rhythm-model-reveal[hidden]{display:none!important}
.afib-case .rhythm-model-reveal{margin-top:18px}
.afib-case .heart-sim-main{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(220px,.75fr);gap:14px;align-items:center}
.afib-case .heart-simulation .interactive-heart{display:block;width:100%;max-width:760px;margin:0 auto;max-height:none}
.afib-case .rhythm-feature-dot.flutter{background:#ae8845}

@media(max-width:760px){.afib-case .heart-simulation .interactive-heart{max-width:100%}}

.afib-case .heart-sim-label{font:700 11px/1.3 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#74646b}
.afib-case .heart-simulation svg{display:block;width:100%;max-height:370px;margin:0 auto}
.afib-case .heart-pulse{transform-box:fill-box;transform-origin:center;animation:heart-signal 2.2s ease-in-out infinite}
.afib-case .heart-pulse.pulse-two{animation-delay:.65s}
.afib-case .heart-pulse.pulse-three{animation-delay:1.2s}
@keyframes heart-signal{0%,100%{opacity:.25;transform:scale(.75)}35%,60%{opacity:1;transform:scale(1.8)}}
.afib-case .heart-sim-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font:12px/1.4 system-ui,sans-serif;color:#63565c}
.afib-case .heart-sim-legend span{display:flex;align-items:center;gap:7px}
.afib-case .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f4c84b;border:1px solid #a27c2b}
.afib-case .legend-dot.conduction{background:#6e4d87;border-color:#6e4d87}
.afib-case .principle-list{list-style:none;margin:0;padding:0;display:grid;gap:25px}
.afib-case .principle-list li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;padding:0 0 24px;border-bottom:1px solid #d9cfc5}
.afib-case .principle-list li:last-child{padding-bottom:0;border-bottom:0}
.afib-case .principle-number{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#4b4a78;color:#fff;font:700 13px/1 system-ui,sans-serif}
.afib-case .principle-list strong{display:block;font:normal clamp(21px,2vw,27px)/1.2 Georgia,"Times New Roman",serif;color:var(--ink)}
.afib-case .principle-list p{margin:9px 0 0;color:var(--muted);font:15px/1.6 system-ui,sans-serif}
@media(max-width:760px){.afib-case .tachycardia-concept{grid-template-columns:1fr;gap:18px}.afib-case .heart-simulation svg{max-height:310px}.afib-case .principle-list{gap:18px}.afib-case .principle-list li{padding-bottom:17px}}
@media(prefers-reduced-motion:reduce){.afib-case .heart-pulse{animation:none;opacity:.8}}


.atrial-rhythm-overview{max-width:1200px;margin:24px auto 8px;padding:18px;background:rgba(249,247,241,.96);border:1px solid #d6cfc1;box-shadow:0 8px 22px rgba(43,37,28,.06)}
.atrial-rhythm-heading>span{font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--purple)}
.atrial-rhythm-heading p{margin:5px 0 14px;font:14px/1.45 system-ui,sans-serif;color:var(--muted)}
.atrial-rhythm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.atrial-rhythm-card{min-width:0;padding:12px;background:#fff;border:1px solid #d6cfc1}
.atrial-rhythm-card h3{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:17px;line-height:1.25}
.atrial-rhythm-card p{min-height:42px;margin:0 0 8px;font:13px/1.4 system-ui,sans-serif;color:var(--muted)}
.atrial-rhythm-card svg{display:block;width:100%;height:auto;border:1px solid #eee6dc}
.rhythm-mark{display:inline-block;width:10px;height:10px;flex:0 0 10px;border-radius:50%}
.rhythm-mark.af{background:#4b4a78}.rhythm-mark.atach{background:#277e91}.rhythm-mark.flutter{background:#ae8845}
@media(max-width:760px){.atrial-rhythm-grid{grid-template-columns:1fr}.atrial-rhythm-card p{min-height:0}.atrial-rhythm-overview{padding:12px}.atrial-rhythm-card h3{font-size:16px}}


/* Interactive rhythm pathways within the enlarged heart model */
.afib-case .tachycardia-concept{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,2.4vw,30px);max-width:1160px;align-items:start}
.afib-case .heart-simulation{padding:18px 18px 16px;min-width:0}
.afib-case .heart-simulation .interactive-heart{width:100%;max-width:760px;max-height:none;height:auto;margin:8px auto 12px;overflow:visible}
.afib-case .rhythm-flow-group{cursor:help;outline:none;opacity:.86;transition:opacity .15s ease,filter .15s ease}
.afib-case .rhythm-flow-group:hover,.afib-case .rhythm-flow-group:focus,.afib-case .rhythm-flow-group:focus-visible{opacity:1;filter:drop-shadow(0 0 3px #fff);outline:none}
.afib-case .rhythm-flow-group:focus-visible path{stroke-width:8}

.afib-case .rhythm-interactive-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin:3px 0 12px;font-size:12px}
.afib-case .rhythm-key{display:inline-flex;align-items:center;gap:6px;border:1px solid #d8d0c5;border-radius:999px;padding:6px 10px;background:#fffdf8;color:var(--ink);font:600 12px/1.2 system-ui,sans-serif;cursor:pointer}
.afib-case .rhythm-key:hover,.afib-case .rhythm-key:focus-visible,.afib-case .rhythm-key[aria-pressed="true"]{border-color:#6555a4;background:#f1edf8;outline-offset:2px}
.afib-case .rhythm-key .legend-dot{flex:0 0 9px}
.afib-case .rhythm-key-hint{color:var(--muted);font-size:11px}
.afib-case .rhythm-flow-group.is-active path{stroke-width:8;stroke-dasharray:8 6;animation:rhythm-electric-flow .65s linear infinite}

.afib-case .legend-dot.rhythm-af{background:#6555a4;border-color:#6555a4}
.afib-case .legend-dot.rhythm-atach{background:#277e91;border-color:#277e91}
.afib-case .legend-dot.rhythm-flutter{background:#ae8845;border-color:#ae8845}
.afib-case .rhythm-tooltip{border:1px solid #d6cfc1;border-left:4px solid var(--purple);background:#fffdf8;padding:13px 15px;min-height:100px;margin:10px 0 0;color:var(--ink)}
.afib-case .rhythm-tooltip strong{font:700 15px/1.35 system-ui,sans-serif;display:block;margin-bottom:5px}
.afib-case .rhythm-tooltip p{font:14px/1.5 system-ui,sans-serif;margin:0;color:var(--muted)}
.afib-case .rhythm-tooltip[data-rhythm="af"]{border-left-color:#6555a4}
.afib-case .rhythm-tooltip[data-rhythm="atach"]{border-left-color:#277e91}
.afib-case .rhythm-tooltip[data-rhythm="flutter"]{border-left-color:#ae8845}
.afib-case .rhythm-tooltip[data-rhythm="avnrt"]{border-left-color:#c14d48}
.afib-case .rhythm-tooltip[data-rhythm="avrt"]{border-left-color:#176f87}
@media(max-width:900px){.afib-case .tachycardia-concept{grid-template-columns:1fr;gap:18px}.afib-case .heart-simulation .interactive-heart{max-height:none;width:100%;max-width:700px}.afib-case .rhythm-interactive-legend{font-size:11px}}

/* Animate electrical flow on hover or keyboard focus, for every rhythm pathway */
.afib-case .rhythm-flow-group:hover path,.afib-case .rhythm-flow-group:focus path,.afib-case .rhythm-flow-group:focus-visible path{stroke-dasharray:8 7;animation:rhythm-electric-flow .65s linear infinite}
.afib-case .rhythm-flow-group.flow-atach:hover path,.afib-case .rhythm-flow-group.flow-atach:focus path{animation-duration:.5s}
.afib-case .rhythm-flow-group.flow-flutter:hover path,.afib-case .rhythm-flow-group.flow-flutter:focus path{animation-duration:.8s}
@keyframes rhythm-electric-flow{to{stroke-dashoffset:-30}}
.afib-case .svt-feature-details{margin:12px 0 0;border:1px solid #d6cfc1;border-radius:9px;background:#fffdf8;overflow:hidden}
.afib-case .svt-feature-details summary{cursor:pointer;list-style:none;padding:12px 14px;font:700 14px/1.4 system-ui,sans-serif;color:#4b4a78}
.afib-case .svt-feature-details summary::-webkit-details-marker{display:none}
.afib-case .svt-feature-details summary:after{content:"＋";float:right;font-size:17px}
.afib-case .svt-feature-details[open] summary:after{content:"−"}
.afib-case .svt-feature-details p{margin:0;padding:0 14px 12px;font:13px/1.55 system-ui,sans-serif;color:var(--ink)}
.afib-case .svt-feature-details .svt-feature-caveat{padding-top:10px;border-top:1px solid #e5ded2;color:var(--muted)}
.afib-case .legend-dot.avnrt{background:#c14d48;border-color:#c14d48}
.afib-case .legend-dot.avrt{background:#277e91;border-color:#277e91}
.afib-case .heart-sim-credit{margin:10px 0 0;font:11px/1.45 system-ui,sans-serif;color:#74646b}
.afib-case .heart-sim-credit a{color:#4b4a78;text-decoration:underline;text-underline-offset:2px}
@media(prefers-reduced-motion:reduce){.afib-case .rhythm-flow-group:hover path,.afib-case .rhythm-flow-group:focus path,.afib-case .rhythm-flow-group:focus-visible path{animation:none}}


/* Match the Cirrhosis case shell, responsive content wrapping, parchment palette and site menu. */
:root{
  --ink:#1d1b19;--muted:#4f4a42;--faint:#7e786e;
  --cream:#e9e3d7;--paper:#f9f7f1;--line:#d6cfc1;
  --nav:#fff;--purple:#4b4a78;--purple2:#34345e;
  --blue:#547f92;--rose:#a45d65;--gold:#ae8845;
  --plum:#87699a;--green:#3e7954;--red:#a84545;
  --shadow:0 22px 55px rgba(43,37,28,.18);
}
html,body{height:100%;margin:0}
body.afib-case{
  min-height:100dvh;background:#bbb5aa;color:var(--ink);
  font-family:Georgia,"Times New Roman",Times,serif;
  padding:0 24px;overflow:hidden;
}
.afib-case .site-nav{
  position:fixed!important;top:6px!important;left:50%!important;
  transform:translateX(-50%)!important;z-index:1000;
  width:min(760px,calc(100vw - 40px))!important;max-width:760px!important;
  margin:0!important;padding:18px 12px!important;
  border:1px solid rgba(255,255,255,.34)!important;border-radius:18px!important;
  background:rgba(255,255,255,.62)!important;
  -webkit-backdrop-filter:blur(18px) saturate(120%)!important;
  backdrop-filter:blur(18px) saturate(120%)!important;
  box-shadow:0 6px 24px rgba(25,18,19,.05)!important;
  isolation:isolate;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
}
.afib-case .site-nav::before{
  content:"";position:absolute;z-index:-1;inset:0;border-radius:18px;
  background:rgba(255,255,255,.62);pointer-events:none;
}
.afib-case .site-nav::after{display:none!important}
.afib-case .site-nav a{color:#34322f;text-decoration:none;background-image:none;text-shadow:none}
.afib-case .site-nav .home-nav-icon,
.afib-case .site-nav .nav-right #fullscreen{
  border:1px solid rgb(var(--color-accent));border-radius:3px;
  color:#fff;background:rgb(var(--color-accent));
}
.afib-case .site-nav .home-nav-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;min-width:34px;min-height:34px;padding:0;
  font-family:Arial,sans-serif;font-size:17px;line-height:1;
}
.afib-case .site-nav .nav-right #fullscreen{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:34px;padding:7px 12px;font:inherit;font-size:13px;
  line-height:1.2;cursor:pointer;white-space:nowrap;
}
.afib-case .site-nav .home-nav-icon:hover,
.afib-case .site-nav .home-nav-icon:focus-visible,
.afib-case .site-nav .nav-right #fullscreen:hover{
  color:#fff;background:#963f3e;border-color:#963f3e;
}
.afib-case .afib-main{
  width:100%;max-width:760px;height:100dvh;max-height:100dvh;
  margin:0 auto;padding-top:85px;display:flex;flex-direction:column;
  overflow:hidden;
}
.afib-case .app{
  flex:1 1 auto;width:100%;max-width:none;min-width:0;min-height:0;
  height:calc(100dvh - 85px);max-height:calc(100dvh - 85px);
  margin:0;overflow:hidden;border-radius:10px;
  box-shadow:0 8px 28px rgba(43,37,28,.08);background:var(--cream);
}
.afib-case .topbar{
  height:59px;flex:0 0 59px;padding:0 28px;gap:0;
  background:#fff;border-bottom:1px solid #dad6ce;color:var(--ink);
}
.afib-case .case-title{font-size:19px;line-height:1;letter-spacing:.14em}
.afib-case .act-tag{
  margin-left:18px;padding-left:18px;border-left:1px solid #e6e1d8;
  color:#6f685f;font-size:12px;line-height:1;letter-spacing:.16em;
}
.afib-case .topbar-btn{
  height:30px;padding:0 12px;border:1px solid #d4cec2;
  background:#fff;color:#34322f;
  font:700 11px/1 Georgia,"Times New Roman",Times,serif;
  letter-spacing:.10em;text-transform:uppercase;
}
.afib-case .topbar-btn:hover{background:#f5f2ec;border-color:#aaa397}
.afib-case .stage{
  flex:1 1 auto;min-height:0;overflow:hidden;
  background:var(--bg,linear-gradient(120deg,#e8e1d3,#d5d1c8));
}
.afib-case .stage::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(90% 90% at 50% 50%,rgba(255,255,255,.02) 56%,rgba(72,66,56,.07) 100%);
}
.afib-case .slide{
  align-items:flex-start;padding:26px clamp(34px,5vw,88px) 20px;
}
.afib-case .slide .stack,
.afib-case .slide .stack.wide{
  zoom:1;width:100%;max-width:680px;margin:0 auto;
}
.afib-case .slide .stack.wide{max-width:780px}
.afib-case .nav{
  height:62px;flex:0 0 62px;display:grid;
  grid-template-columns:auto minmax(0,1fr) 1px auto auto;
  align-items:center;gap:16px;padding:10px 22px;
  background:#fff;border-top:1px solid #dad6ce;
}
.afib-case .navbtn{
  height:36px;border-radius:0;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;border:1px solid #d4cec2;
  background:#fff;color:#34322f;
  font:700 12px/1 Georgia,"Times New Roman",Times,serif;
  letter-spacing:.12em;text-transform:uppercase;padding:0 11px;
}
.afib-case .navbtn:hover:not(:disabled){background:#f4f1eb;border-color:#aaa397}
.afib-case .navbtn-utility{width:auto;min-width:58px;padding:0 11px;font-size:11px}
.afib-case .navbtn-utility:first-child{min-width:54px}
.afib-case .nav-actions{min-width:0;display:flex;gap:8px;justify-self:end}
.afib-case .nav-actions .navbtn{width:auto;min-width:72px}
.afib-case .nav-divider{width:1px;height:24px;background:#e6e1d8}
.afib-case .counter{
  width:78px;height:30px;display:grid;place-items:center;
  border:1px solid #d4cec2;background:#fff;color:#403d38;
  font:400 13px/1 Georgia,"Times New Roman",Times,serif;
  font-variant-numeric:tabular-nums;
}
.afib-case .progress-card{position:relative;min-width:0;height:24px;overflow:hidden}
.afib-case .progress{height:24px;display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}
.afib-case .progress .seg{background:#e5dfd3}

{ch:"start",k:"Clinical reasoning · Cardiology",title:"Atrial Fibrillation & Supraventricular Tachycardia",sub:"One patient. A changing rhythm. Decisions from first contact to long-term care.",body:`<section class="afib-objectives" aria-labelledby="afib-objectives-heading"><h3 id="afib-objectives-heading">Learning objectives</h3><p class="afib-objectives-intro">By the end of this case, you should be able to:</p><ol class="afib-objectives-list"><li><div><strong>Recognise</strong><span>Distinguish AF, atrial flutter and common regular SVTs using the clinical context and ECG.</span></div></li><li><div><strong>Stabilise</strong><span>Identify haemodynamic instability and prioritise time-critical treatment.</span></div></li><li><div><strong>Choose treatment safely</strong><span>Individualise rate or rhythm control, considering ventricular function, renal function and contraindications.</span></div></li><li><div><strong>Prevent complications</strong><span>Assess stroke risk, anticoagulation, modifiable risk factors and follow-up needs.</span></div></li></ol><p class="afib-objectives-note">Interactive clinical case · Decision questions include explanations and safety caveats.</p></section>`,layout:"wide"},
{ch:"foundations",k:"01 · The framework",title:"Tachycardia is a finding, not a diagnosis",body:`<div class="tachycardia-concept"><div class="heart-simulation">

<div class="heart-sim-intro"><strong>SVT = supraventricular tachycardia.</strong><p>The term includes rhythms arising above the ventricles.</p><p class="svt-definition-detail">Occurring at a heart rate greater than 100/min, these tachyarrhythmias typically conduct through the His–Purkinje system and appear on ECG as narrow-QRS (&lt;120 ms) rhythms. Paroxysmal SVT (PSVT) is a subgroup that begins episodically and terminates abruptly.</p></div>

{ch:"foundations",k:"01 · The framework",title:"Three rhythms that are often conflated",body:`<div class="rhythm-visuals" aria-label="Schematic comparison of three rhythm patterns"><div class="rhythm-visual"><div class="rhythm-name"><span class="rhythm-dot af"></span><b>AF</b><small>Irregular · no consistent P</small></div><svg viewBox="0 0 520 76" role="img" aria-label="Schematic irregularly irregular rhythm"><defs><pattern id="afgrid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#d8cfc1" stroke-width=".6"/></pattern></defs><rect width="520" height="76" fill="#fffdf8"/><rect width="520" height="76" fill="url(#afgrid)"/><path d="M0 39 L10 37 18 41 28 38 36 40 46 37 54 39 61 15 68 60 76 38 90 39 101 36 111 42 122 38 132 40 148 38 159 14 166 60 174 39 195 38 205 41 215 37 226 39 244 38 255 15 262 60 271 39 283 40 296 37 307 41 319 39 332 38 343 15 350 60 358 39 378 38 390 41 402 38 414 39 431 37 442 15 449 60 457 39 477 40 489 37 501 41 520 39" fill="none" stroke="#4b4a78" stroke-width="2.2" stroke-linejoin="round"/></svg></div><div class="rhythm-visual"><div class="rhythm-name"><span class="rhythm-dot flutter"></span><b>Flutter</b><small>Organised atrial activity</small></div><svg viewBox="0 0 520 76" role="img" aria-label="Schematic atrial flutter pattern"><defs><pattern id="flgrid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#d8cfc1" stroke-width=".6"/></pattern></defs><rect width="520" height="76" fill="#fffdf8"/><rect width="520" height="76" fill="url(#flgrid)"/><path d="M0 39 L10 18 20 57 30 18 40 57 50 18 60 57 70 39 90 39 100 15 108 61 117 39 130 18 140 57 150 18 160 57 170 18 180 57 190 39 210 39 220 15 228 61 237 39 250 18 260 57 270 18 280 57 290 18 300 57 310 39 330 39 340 15 348 61 357 39 370 18 380 57 390 18 400 57 410 18 420 57 430 39 450 39 460 15 468 61 477 39 490 18 500 57 510 18 520 39" fill="none" stroke="#ae8845" stroke-width="2.2" stroke-linejoin="round"/></svg></div><div class="rhythm-visual"><div class="rhythm-name"><span class="rhythm-dot svt"></span><b>Regular SVT</b><small>Regular narrow-complex pattern</small></div><svg viewBox="0 0 520 76" role="img" aria-label="Schematic regular narrow-complex tachycardia"><defs><pattern id="svgrid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#d8cfc1" stroke-width=".6"/></pattern></defs><rect width="520" height="76" fill="#fffdf8"/><rect width="520" height="76" fill="url(#svgrid)"/><path d="M0 39 L24 39 31 34 38 44 45 39 57 39 65 10 72 62 80 29 88 39 116 39 123 34 130 44 137 39 149 39 157 10 164 62 172 29 180 39 208 39 215 34 222 44 229 39 241 39 249 10 256 62 264 29 272 39 300 39 307 34 314 44 321 39 333 39 341 10 348 62 356 29 364 39 392 39 399 34 406 44 413 39 425 39 433 10 440 62 448 29 456 39 484 39 491 34 498 44 505 39 520 39" fill="none" stroke="#547f92" stroke-width="2.2" stroke-linejoin="round"/></svg></div><p class="rhythm-disclaimer">Schematic patterns for recognition practice only — not diagnostic ECGs.</p></div><div class="cols three"><div class="panel"><span class="tag">AF</span><h3>Atrial fibrillation</h3><p>Disorganised atrial activation; no consistent discrete P waves; typically irregularly irregular ventricular response.</p></div><div class="panel"><span class="tag">Flutter</span><h3>Atrial flutter</h3><p>Organised macro-re-entry, often atrial activity around 250–350/min. Ventricular rhythm depends on AV conduction.</p></div><div class="panel"><span class="tag">SVT</span><h3>Regular SVT</h3><p>Often AVNRT or AVRT: abrupt-onset, regular narrow-complex tachycardia; P waves may be hidden or retrograde.</p></div></div><p class="lead">They differ in mechanism and acute manoeuvres, but AF and flutter share important principles of thromboembolic-risk assessment.</p><p>“SVT” is an umbrella term, not one single rhythm. The exact ECG and clinical context matter.</p><button class="navbtn" data-reveal="rhythm-distinction">Reveal the key ECG distinction</button><div class="reveal-panel" data-reveal-panel="rhythm-distinction" hidden><h3>Pattern recognition: what changes the pathway?</h3><ul><li><b>AF:</b> irregularly irregular ventricular rhythm and no consistent P waves. Assess stability, precipitants, stroke risk and anticoagulation.</li><li><b>Typical flutter:</b> organised atrial activity, often saw-tooth; 2:1 conduction can produce a regular ventricular rate near 150/min. Do not diagnose from rate alone.</li><li><b>AVNRT/AVRT:</b> commonly abrupt, regular narrow-complex tachycardia. Vagal manoeuvres and adenosine may terminate AV-node-dependent re-entry in a stable patient; they do not treat AF.</li></ul><p><b>Clinical implication:</b> never apply the regular-SVT adenosine pathway to an irregular rhythm or suspected pre-excited AF.</p></div>`},
{ch:"foundations",k:"01 · The framework",title:"A practical ECG checklist",body:`<ol><li><b>Rate:</b> atrial and ventricular rates; very fast or slow?</li><li><b>Regularity:</b> regular, regularly irregular or irregularly irregular?</li><li><b>QRS:</b> narrow (&lt;120 ms) or broad (≥120 ms)?</li><li><b>Atrial activity:</b> P waves, flutter waves, fibrillatory baseline, or none visible?</li><li><b>Relationship:</b> does each P precede a QRS? Is there AV dissociation?</li><li><b>Context:</b> onset, symptoms, structural heart disease, drugs, electrolytes and prior ECGs.</li></ol><div class="callout">An irregularly irregular narrow-complex rhythm without consistent P waves strongly supports AF, but artefact, frequent ectopy and multifocal atrial tachycardia can mimic irregularity. Confirm with a readable ECG.</div>`},
{ch:"foundations",k:"01 · The framework",title:"AF on ECG: what you are looking for",body:`<svg class="ecg" viewBox="0 0 900 180" role="img" aria-label="Schematic irregular ECG trace illustrating atrial fibrillation"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d8c7c2" stroke-width=".8"/></pattern></defs><rect width="900" height="180" fill="#fffdf9"/><rect width="900" height="180" fill="url(#grid)"/><path d="M0 95 L22 95 L30 91 L38 99 L45 95 L70 95 L79 54 L88 132 L99 83 L110 95 L130 94 L143 90 L150 99 L158 94 L188 95 L196 55 L205 132 L216 83 L226 95 L249 95 L259 91 L267 99 L275 95 L311 95 L319 51 L328 133 L340 83 L350 95 L377 95 L390 91 L398 99 L407 95 L432 95 L440 55 L449 132 L460 83 L470 95 L502 95 L515 91 L523 99 L531 95 L566 95 L574 54 L583 132 L594 83 L604 95 L631 95 L645 91 L653 99 L661 95 L691 95 L699 55 L708 132 L719 83 L729 95 L755 95 L768 91 L776 99 L784 95 L811 95 L819 53 L828 132 L839 83 L849 95 L900 95" fill="none" stroke="#247c59" stroke-width="2.5"/></svg><div class="cols"><div class="panel"><h3>Typical clues</h3><ul><li>No consistent P waves</li><li>Irregularly irregular RR intervals</li><li>Variable ventricular response</li></ul></div><div class="panel"><h3>Do not over-read</h3><p>This is an illustrative schematic, not a diagnostic ECG. Real interpretation requires a recorded tracing, calibration and clinical context.</p></div></div>`},
{ch:"foundations",k:"01 · The framework",title:"Atrial flutter and regular SVT",body:`<div class="cols"><div class="panel"><h3>Typical flutter</h3><p>Often saw-tooth flutter waves, classically negative in inferior leads and positive in V1 for counterclockwise typical flutter. Atrial activity may be easier to see with increased AV block.</p><p>2:1 conduction can produce a ventricular rate near 150/min and be mistaken for another regular SVT.</p></div><div class="panel"><h3>AVNRT / AVRT</h3><p>Usually abrupt-onset, regular narrow-complex tachycardia. P waves can be buried in QRS complexes or appear just after them.</p><p>Vagal manoeuvres and adenosine may help diagnose or terminate selected regular narrow-complex tachycardias, if appropriate and safe.</p></div></div><div class="callout warn">Never give adenosine reflexively for an irregular or polymorphic broad-complex rhythm. In pre-excited AF, AV-nodal blockers can be dangerous.</div>`},
{ch:"mechanisms",k:"08 · Mechanism matters",title:"Regular SVT is a family of mechanisms, not one diagnosis",body:`<p class="lead">The circuit or focus explains the ECG pattern, response to adenosine and definitive treatment. A regular narrow-complex tachycardia is a starting description—not always the final diagnosis.</p><div class="tablewrap"><table><thead><tr><th>Rhythm</th><th>Mechanism / ECG clues</th><th>Clinical caveat</th></tr></thead><tbody><tr><td><b>Focal atrial tachycardia</b></td><td>Automaticity, triggered activity or micro-re-entry; consistent but non-sinus P-wave morphology</td><td>Focal describes origin, not mechanism. Adenosine may reveal atrial activity without terminating the rhythm.</td></tr><tr><td><b>Typical AVNRT</b></td><td>Re-entry involving functionally distinct pathways in/near the AV node; P waves often hidden in QRS or appear as pseudo-r′ in V1 / pseudo-S in inferior leads</td><td>Often abrupt onset/offset; vagal manoeuvres or adenosine can terminate AV-node-dependent re-entry.</td></tr><tr><td><b>AVRT</b></td><td>Re-entry using the AV node and an accessory pathway; orthodromic AVRT usually narrow, antidromic AVRT broad</td><td>Pathways may be manifest or concealed; no delta wave at baseline does not exclude a concealed pathway.</td></tr><tr><td><b>Typical atrial flutter</b></td><td>Macro-re-entry, usually CTI-dependent; classic counterclockwise pattern has negative flutter waves in II, III, aVF and positive activity in V1</td><td>2:1 conduction often gives ~150/min, but rate alone is not diagnostic and morphology varies.</td></tr></tbody></table></div><button class="navbtn" data-reveal="svt-mechanism">Reveal the mechanism-to-management reasoning</button><div class="reveal-panel" data-reveal-panel="svt-mechanism" hidden><h3>How mechanism changes management</h3><ul><li><b>AVNRT / orthodromic AVRT:</b> vagal manoeuvres and adenosine may terminate stable regular narrow-complex episodes.</li><li><b>AT / flutter:</b> adenosine may expose atrial activity through transient AV block, but often will not terminate the atrial arrhythmia.</li><li><b>Pre-excited AF:</b> avoid AV-nodal blockers, including adenosine, beta-blockers, diltiazem/verapamil and digoxin; seek urgent expert management.</li><li><b>Broad-complex tachycardia of uncertain origin:</b> do not assume SVT with aberrancy; manage as potentially ventricular tachycardia until appropriately assessed.</li></ul><p>Save an ECG during symptoms when possible. No single ECG clue is infallible.</p></div>`},
{ch:"case",k:"02 · Meet the patient",title:"The first presentation",body:`<p class="lead">A 71-year-old man arrives with 48 hours of palpitations, worsening exertional dyspnoea and difficulty lying flat.</p><div class="cols"><div class="panel"><h3>Background</h3><ul><li>Hypertension</li><li>Type 2 diabetes</li><li>Stage 4 chronic kidney disease; baseline eGFR 25 mL/min/1.73 m²</li><li>No known prior AF</li></ul></div><div class="panel"><h3>Initial observations</h3><ul><li>BP 145/88 mmHg</li><li>HR 128/min, irregularly irregular</li><li>SpO₂ 94% on room air</li><li>Alert, warm peripheries; assess congestion and perfusion carefully</li></ul></div></div><p>He is uncomfortable but speaking in full sentences. There is no ongoing chest pain or syncope. You obtain monitoring, IV access and a 12-lead ECG.</p>`},
{ch:"case",k:"02 · Meet the patient",title:"Decision 1 · What comes first?",image:"Gemini_Generated_Image_8th1st8th1st8th1.jpeg",imageSide:"left",q:"What is the most important first decision in a patient with a tachyarrhythmia?",opts:["Calculate the long-term stroke score before examining the patient","Determine whether the arrhythmia is causing haemodynamic instability","Choose an antiarrhythmic drug immediately","Assume all narrow-complex tachycardias are benign"],correct:1,why:"Assess haemodynamic stability first. If the tachyarrhythmia is causing shock, severe hypotension, ongoing ischaemia or acute pulmonary oedema, urgent electrical treatment may be needed. Stroke prevention matters, but it does not supersede immediate resuscitation."},
{ch:"case",k:"02 · Meet the patient",title:"The ECG result",image:"Gemini_Generated_Image_a45t21a45t21a45t.jpeg",imageSide:"right",body:`<p class="lead">The 12-lead ECG shows an irregularly irregular narrow-complex rhythm, no consistent discrete P waves and a ventricular rate around 128/min.</p><div class="callout good"><b>Working diagnosis: atrial fibrillation with a rapid ventricular response.</b> The diagnosis should be confirmed from the actual ECG and not from the pulse alone.</div><details class="clinical-reveal"><summary><span>What else must be assessed now?</span><span class="reveal-action">Reveal <b aria-hidden="true">+</b></span></summary><div class="clinical-reveal-content"><ul><li>Signs of pulmonary oedema, shock, myocardial ischaemia or another acute cause of dyspnoea.</li><li>Duration and pattern of symptoms; previous episodes; medication adherence and recent changes.</li><li>Potential precipitants: infection, acute coronary syndrome, thyrotoxicosis, anaemia, electrolyte disturbance, alcohol or stimulant exposure, pulmonary embolism where clinically suspected.</li></ul></div></details>`},
{ch:"diagnosis",k:"03 · Establish the diagnosis",title:"AF is a syndrome with causes and consequences",body:`<p class="lead">Do not stop at naming the rhythm. Establish the substrate, triggers, haemodynamic effect and preventable complications.</p><div class="cols"><div class="panel"><h3>History</h3><p>Onset and duration, episodic versus persistent symptoms, exercise tolerance, syncope, chest pain, heart-failure symptoms, prior stroke/TIA, bleeding, falls, sleep apnoea, alcohol, drugs and family history.</p></div><div class="panel"><h3>Examination</h3><p>Vitals and perfusion; volume status; cardiac murmurs; signs of heart failure; thyroid features; infection; stroke signs. Look for the condition that triggered the episode.</p></div></div><p>Document whether AF is newly diagnosed and whether the presentation is first-detected, paroxysmal, persistent or longstanding persistent when enough history is available. Classification may evolve with follow-up.</p>`},
{ch:"foundations",k:"01 · AF phenotypes",title:"AF has a time course — but the label does not decide treatment",body:`<p class="lead">Classify the pattern to describe the clinical course and plan follow-up. Do not mistake a pattern label for a measure of stroke risk or a reason to withhold treatment.</p><div class="tablewrap"><table><thead><tr><th>Pattern</th><th>Working definition</th><th>Practical caveat</th></tr></thead><tbody><tr><td><b>First-diagnosed</b></td><td>AF identified for the first time, irrespective of duration or symptoms</td><td>First detected does not prove the arrhythmia began today.</td></tr><tr><td><b>Paroxysmal</b></td><td>Terminates spontaneously or with intervention within 7 days</td><td>Episodes can recur and vary in frequency.</td></tr><tr><td><b>Persistent</b></td><td>Continuous AF lasting more than 7 days</td><td>Duration alone does not tell you whether rhythm control will help.</td></tr><tr><td><b>Long-standing persistent</b></td><td>Continuous AF for more than 12 months</td><td>Rhythm control may still be discussed in selected patients.</td></tr><tr><td><b>Permanent</b></td><td>Patient and clinician jointly decide not to pursue further rhythm restoration/maintenance</td><td>This is a treatment decision, not an irreversible biological state.</td></tr></tbody></table></div><div class="callout warn"><b>Clinical caveat:</b> anticoagulation decisions are based on thromboembolic risk and special conditions—not whether AF is paroxysmal, persistent or currently absent on an ECG.</div><p>If symptoms suggest intermittent AF but the ECG is normal, use ambulatory monitoring matched to symptom frequency: Holter monitoring for frequent symptoms or longer event/loop recording for less frequent episodes. A normal single ECG cannot exclude paroxysmal AF.</p>`},
{ch:"diagnosis",k:"03 · Establish the diagnosis",title:"Investigations: answer a clinical question",body:`<div class="tablewrap"><table><thead><tr><th>Investigation</th><th>Why it helps</th><th>Clinical caveat</th></tr></thead><tbody><tr><td>12-lead ECG</td><td>Confirm rhythm; assess QRS, conduction, ischaemia and pre-excitation</td><td>Compare with prior tracings; repeat if rhythm changes</td></tr><tr><td>FBC</td><td>Anaemia, infection, platelet count</td><td>Interpret in context</td></tr><tr><td>Electrolytes, renal function</td><td>Identify reversible triggers; guide drug choice/dosing</td><td>Especially important in this patient with CKD</td></tr><tr><td>Thyroid function</td><td>Identify thyrotoxicosis where relevant</td><td>Not every abnormal result is causal</td></tr><tr><td>Transthoracic echo</td><td>LV function, atrial size, valves and structural disease</td><td>Does not itself exclude atrial thrombus</td></tr><tr><td>Additional tests</td><td>Troponin, chest imaging, infection work-up, PE assessment as indicated</td><td>Guided by symptoms and pre-test probability</td></tr></tbody></table></div><div class="callout">Avoid indiscriminate testing. Investigations should answer a clinical question and should not delay emergency stabilisation.</div>`},
{ch:"diagnosis",k:"03 · Establish the diagnosis",title:"Why did AF occur?",body:`<p class="lead">AF often reflects a vulnerable atrial substrate plus an acute trigger.</p><div class="cols"><div class="panel"><h3>Substrate</h3><ul><li>Age and hypertension</li><li>Structural heart disease or atrial enlargement</li><li>Heart failure, obesity and sleep apnoea</li><li>Diabetes, CKD and vascular disease</li></ul></div><div class="panel"><h3>Potential triggers</h3><ul><li>Infection or systemic illness</li><li>Electrolyte disturbance or thyrotoxicosis</li><li>Alcohol, stimulants or selected medicines</li><li>Acute cardiac or pulmonary disease</li></ul></div></div><p>Finding and treating a trigger is important, but a “reversible trigger” does not automatically remove future AF recurrence or stroke risk. Reassess risk over time.</p>`},
{ch:"foundations",k:"02 · Causes and substrate",title:"AF risk factors: separate what cannot change from what you can treat",body:`<p class="lead">AF usually emerges from a substrate plus triggers and comorbidities. A useful consultation looks beyond the ECG and avoids blaming one isolated factor.</p><div class="cols"><div class="panel"><span class="tag">Predisposition</span><h3>Factors not readily modifiable</h3><ul><li>Increasing age and family/genetic predisposition</li><li>Some congenital or structural heart disease</li><li>Prior cardiac surgery and established atrial remodelling</li></ul><p class="small">These factors inform context, but do not by themselves determine treatment.</p></div><div class="panel"><span class="tag">Treatment targets</span><h3>Potentially modifiable contributors</h3><ul><li>Hypertension, heart failure, diabetes and vascular disease</li><li>Obesity, physical inactivity and excess alcohol</li><li>Obstructive sleep apnoea, thyroid disease and other acute illness</li><li>Medication effects, electrolyte disturbance and postoperative stress</li></ul></div></div><div class="callout good"><b>For Mr M:</b> treat AF as both an arrhythmia and a marker of cardiovascular risk. Risk-factor management complements—not replaces—stroke prevention and rhythm/rate decisions.</div><p>Ask about alcohol pattern, sleep symptoms, weight trajectory, exercise, blood pressure, diabetes control and medication adherence. Investigate thyroid, renal, hepatic and electrolyte abnormalities when clinically appropriate.</p>`},
{ch:"acute",k:"04 · Acute management",title:"If unstable: electricity before fine-tuning",body:`<p class="lead">Use the 2025 AHA adult tachyarrhythmia algorithm: if a persistent tachyarrhythmia is causing <b>hypotension, acutely altered mental status, shock, ischaemic chest discomfort or acute heart failure</b>, proceed to urgent electrical management.</p><ol><li>Call for help; assess airway, breathing and circulation; attach monitor/defibrillator, monitor blood pressure and oxygen saturation, and obtain IV access.</li><li>Give oxygen if hypoxaemic; obtain a 12-lead ECG if available without delaying treatment; address immediately reversible causes.</li><li>For unstable AF/flutter or another organised tachyarrhythmia, perform <b>synchronised cardioversion</b>; sedate whenever feasible, but do not delay lifesaving treatment. Follow the device-specific/current AHA energy guidance.</li><li>Reassess rhythm, perfusion and the underlying cause. If refractory, reassess the cause, consider energy escalation/additional therapy and obtain expert help.</li><li>After stabilisation, address recurrence prevention and anticoagulation where indicated. Pulseless patients require the cardiac-arrest algorithm; sustained polymorphic VT requires an unsynchronised shock.</li></ol><div class="callout warn">Do not equate a fast rate with instability, but do not let a near-normal blood pressure falsely reassure you when acute heart failure, shock, altered mentation or ischaemia is present.</div><p class="footnote">Wigginton JG, et al. 2025 AHA Guidelines for CPR and ECC, Adult Tachyarrhythmia With a Pulse Algorithm. doi:10.1161/CIR.0000000000001376.</p>`},
{ch:"acute",k:"04 · Acute management",title:"Stable AF with a rapid ventricular response",body:`<p class="lead">Choose rate-control treatment in the context of ventricular function, blood pressure, congestion, comorbidity and the likely cause.</p><div class="cols"><div class="panel"><h3>Potential options</h3><p><b>2023 ACC/AHA/ACCP/HRS:</b> for haemodynamically stable AF with RVR, a beta-blocker or diltiazem/verapamil is recommended when appropriate; diltiazem/verapamil are options when <b>LVEF is &gt;40%</b>. Do not use them in moderate/severe LV systolic dysfunction. Consider digoxin when beta-blockers and non-dihydropyridine calcium-channel blockers are ineffective or contraindicated. IV magnesium may be added to standard rate-control therapy. IV amiodarone may be considered in critically ill or decompensated-HF patients when other agents are unsuitable, while accounting for possible unintended cardioversion and embolism.</p></div><div class="panel"><h3>Safety gates</h3><p>Avoid diltiazem/verapamil in significant systolic dysfunction. Use digoxin cautiously in renal impairment and monitor levels/electrolytes when indicated. Avoid AV-nodal blockers in pre-excited AF.</p></div></div><p><b>Rate target:</b> in AF without heart failure, a resting ventricular rate below about <b>100–110/min</b> is a reasonable initial target when symptoms permit; individualise the target for symptoms, LV function and haemodynamics. In this patient with possible heart failure, do not apply a lenient target mechanically. Treat the precipitant and reassess perfusion, congestion and symptoms—not the monitor number alone.</p><p class="footnote">Rate-control principles: 2023 ACC/AHA/ACCP/HRS AF guideline. Emergency assessment and escalation: 2025 AHA Adult Tachyarrhythmia With a Pulse Algorithm.</p>`},
{ch:"acute",k:"04 · Acute management",title:"Decision 2 · Which rate-control caveat matters most?",q:"This patient has stage 4 CKD. Which statement is most appropriate when considering rate-control medicines?",opts:["Renal function is irrelevant to digoxin use","All calcium-channel blockers are safe regardless of LV function","Renal impairment affects digoxin handling and dosing; drug selection must also consider ventricular function and haemodynamics","Adenosine is the routine first-line treatment for AF"],correct:2,why:"Digoxin is renally cleared and can accumulate in CKD, increasing toxicity risk. Rate-control choices also depend on LV systolic function, blood pressure, congestion and possible pre-excitation. Adenosine is not a treatment for AF."},
{ch:"acute",k:"04 · Acute management",title:"Search for precipitants and complications",body:`<p class="lead">AF management is not complete when the ventricular rate slows.</p><ul><li>Assess for acute heart failure and treat congestion using the clinical findings.</li><li>Correct clinically important electrolyte abnormalities and treat infection or thyrotoxicosis if present.</li><li>Consider acute coronary syndrome or pulmonary embolism only when the presentation supports those diagnoses.</li><li>Review medications, QT interval, conduction disease, renal function and drug interactions before selecting therapy.</li><li>Arrange follow-up, education and a plan for stroke prevention before discharge.</li></ul><div class="callout good">A rate response is a treatment endpoint—not proof that the underlying cause, stroke risk or longer-term strategy has been addressed.</div>`},
{ch:"stroke",k:"05 · Prevent embolic stroke",title:"Stroke prevention is a separate decision",body:`<p class="lead">Symptoms and ventricular rate do not reliably indicate embolic risk. Assess thromboembolic risk systematically and revisit it as the patient ages or develops new conditions.</p><div class="cols"><div class="panel"><h3>CHA₂DS₂-VASc components</h3><p><b>C</b> heart failure/LV dysfunction (1)<br><b>H</b> hypertension (1)<br><b>A₂</b> age ≥75 (2)<br><b>D</b> diabetes (1)<br><b>S₂</b> prior stroke/TIA/systemic embolism (2)<br><b>V</b> vascular disease (1)<br><b>A</b> age 65–74 (1)<br><b>Sc</b> sex category (1)</p></div><div class="panel"><h3>Use scores intelligently</h3><p><b>2023 US guideline threshold:</b> anticoagulation is recommended when estimated annual thromboembolic risk is ≥2% (approximately CHA₂DS₂-VASc ≥2 in men or ≥3 in women); it is reasonable at 1–2% per year (approximately score 1 in men or 2 in women). The score is an estimate, not a perfect individual prediction. Bleeding risk should prompt correction of modifiable hazards and closer review, not automatic denial of anticoagulation.</p></div></div><p>Consider contraindications, prior bleeding, anaemia, uncontrolled blood pressure, renal/liver function, interacting drugs, adherence, affordability and patient preference.</p>`},
{ch:"stroke",k:"05 · Prevent embolic stroke",title:"Our patient’s stroke-risk profile",body:`<p class="lead">At age 71, with hypertension and diabetes, he has a CHA₂DS₂-VASc score of 3 using the conventional score (age 65–74 = 1, hypertension = 1, diabetes = 1).</p><div class="cols three"><div class="panel"><span class="metric">1</span><h3>Age 65–74</h3><p class="small">Age-related risk</p></div><div class="panel"><span class="metric">1</span><h3>Hypertension</h3><p class="small">Vascular risk factor</p></div><div class="panel"><span class="metric">1</span><h3>Diabetes</h3><p class="small">Vascular risk factor</p></div></div><p>This supports an active discussion of oral anticoagulation unless contraindicated. The exact approach should follow the guideline used in your setting; some newer guidance uses different risk tools.</p><div class="callout">A score estimates risk; it does not replace a clinical conversation or a check for valvular disease, renal function, drug interactions and bleeding hazards.</div>`},
{ch:"stroke",k:"05 · Prevent embolic stroke",title:"Calculate stroke risk: try the score yourself",layout:"wide",body:`<p class="lead">Use the conventional CHA₂DS₂-VASc components below. Select the features that apply to the patient, then calculate the score and interpret it. For this case, start with Mr M’s known history.</p><div class="score-tool"><div class="score-grid"><label><input type="checkbox" data-risk="chf"> <span><b>Congestive heart failure / LV dysfunction</b><small>1 point</small></span></label><label><input type="checkbox" data-risk="htn" checked> <span><b>Hypertension</b><small>1 point</small></span></label><label><input type="checkbox" data-risk="age75"> <span><b>Age ≥75 years</b><small>2 points — replaces age 65–74</small></span></label><label><input type="checkbox" data-risk="diabetes" checked> <span><b>Diabetes mellitus</b><small>1 point</small></span></label><label><input type="checkbox" data-risk="stroke"> <span><b>Previous stroke / TIA / systemic embolism</b><small>2 points</small></span></label><label><input type="checkbox" data-risk="vascular"> <span><b>Vascular disease</b><small>1 point</small></span></label><label><input type="checkbox" data-risk="age65" checked> <span><b>Age 65–74 years</b><small>1 point — do not select with age ≥75</small></span></label><label><input type="checkbox" data-risk="female"> <span><b>Female sex category</b><small>1 point in conventional score; interpret with other risks</small></span></label></div><div class="score-controls"><button class="navbtn primary" data-calc-score>Calculate and interpret</button><button class="navbtn" data-reset-score>Reset to Mr M</button></div><div class="score-result" data-score-result hidden aria-live="polite"></div></div><p class="footnote">This is a teaching aid, not a substitute for an individualised decision. Risk scores and guideline thresholds vary by guideline and population. The 2023 ACC/AHA/ACCP/HRS guideline recommends anticoagulation at estimated annual thromboembolic risk ≥2% (approximately score ≥2 in men or ≥3 in women) and considers it reasonable at 1–2% per year (approximately score 1 in men or 2 in women). CKD affects drug selection/dosing and bleeding assessment, but is not itself a CHA₂DS₂-VASc component.</p>`},
{ch:"stroke",k:"05 · Prevent embolic stroke",title:"Choosing an anticoagulant with stage 4 CKD",body:`<p class="lead">Advanced CKD makes the decision more nuanced—not less important.</p><ul><li>Check current creatinine/eGFR and calculate creatinine clearance using the method required by the medicine label/local guideline.</li><li>Confirm indication, dose-reduction criteria, age, body weight and interacting drugs.</li><li>For eligible patients with AF who do not have a mechanical heart valve or moderate-to-severe mitral stenosis, the 2023 ACC/AHA/ACCP/HRS guideline generally prefers a DOAC over warfarin.</li><li>For CKD stage 4, warfarin or a labelled DOAC dose is reasonable; selection must use current creatinine clearance, age, body weight, interacting medicines and the specific product label. Evidence is less robust as renal function approaches kidney failure.</li><li>For end-stage CKD (CrCl &lt;15 mL/min) or dialysis, the guideline says warfarin (INR 2.0–3.0) or an evidence-based apixaban dose might be reasonable; this requires specialist/local-guideline review rather than automatic extrapolation from trials.</li><li>Warfarin requires INR monitoring and attention to interactions and time in therapeutic range.</li><li>Mechanical heart valves and moderate-to-severe mitral stenosis change anticoagulant selection; a DOAC is not the default in these settings.</li></ul><div class="callout warn">Never prescribe a standard DOAC dose “by habit” in stage 4 CKD. Verify current product information and local specialist guidance.</div>`},
{ch:"stroke",k:"05 · Anticoagulation caveats",title:"Before choosing a DOAC: check the valve, the kidney and the whole prescription",body:`<p class="lead">AF does not automatically mean that a DOAC is the right drug. First confirm eligibility, then verify the labelled dose.</p><div class="cols"><div class="panel"><h3>Conditions that change the choice</h3><ul><li><b>Mechanical prosthetic valve:</b> use a vitamin K antagonist such as warfarin; DOACs are not a substitute.</li><li><b>Moderate-to-severe rheumatic mitral stenosis:</b> warfarin is generally preferred over a DOAC for AF-related stroke prevention.</li><li><b>Stage 4 CKD:</b> warfarin or a labelled DOAC dose may be reasonable, but evidence is less complete as renal function worsens.</li><li><b>Dialysis / CrCl below 15 mL/min:</b> evidence is limited; US guidance says warfarin or an evidence-based apixaban dose might be reasonable in selected patients, not as a universal default.</li></ul></div><div class="panel"><h3>Prescription safety checks</h3><ul><li>Use the renal metric required by the label (often Cockcroft–Gault creatinine clearance), not eGFR alone by habit.</li><li>Verify age, body weight, serum creatinine, interacting P-gp/CYP3A4 medicines and drug-specific dose-reduction rules.</li><li>Review adherence, access, prior bleeding, anaemia, concomitant antiplatelets/NSAIDs and patient preference.</li><li>For warfarin, plan INR access, interaction review and time-in-therapeutic-range follow-up.</li></ul></div></div><div class="callout warn"><b>Do not infer a dose from eGFR alone.</b> This case gives baseline eGFR around 25 mL/min/1.73 m², but safe prescribing also needs current renal data, age/weight details, product criteria and local guidance.</div><p>Aspirin or clopidogrel is not an equivalent replacement for oral anticoagulation when anticoagulation is indicated. If antiplatelet therapy is also needed for coronary disease, review indication and duration to avoid unnecessary combined bleeding risk.</p>`},
{ch:"stroke",k:"05 · Prevent embolic stroke",title:"Decision 3 · What should guide stroke prevention?",q:"Which is the safest principle for this patient’s anticoagulation plan?",opts:["Aspirin is an equivalent substitute for anticoagulation in AF","Choose a drug and dose after reviewing renal function, eligibility, interactions and bleeding risks, using current guidance","AF lasting less than 72 hours means stroke prevention is never needed","Use the same DOAC dose in every adult"],correct:1,why:"Anticoagulant choice and dose must be individualised. Aspirin is not an equivalent substitute for oral anticoagulation for AF-related stroke prevention. Symptom duration does not remove long-term thromboembolic risk; rhythm-control procedures require a separate pericardioversion anticoagulation assessment."},
{"ch":"evidence","k":"05 · Prevent embolic stroke","title":"ARISTOTLE: benefit and bleeding are both visible","layout":"wide","body":"<p class='lead'>Mr M’s stroke risk makes anticoagulation important, but stage 4 CKD makes evidence applicability and dose selection especially important. ARISTOTLE compared apixaban with warfarin in 18,201 patients with AF and at least one additional stroke risk factor.</p><div class='cols'><div class='panel'><h3>What the trial found</h3><p>Annualised stroke/systemic embolism was 1.27% with apixaban versus 1.60% with warfarin (HR 0.79, 95% CI 0.66–0.95). Major bleeding was 2.13% versus 3.09% per year (HR 0.69, 95% CI 0.60–0.80); all-cause mortality was also lower in the apixaban group.</p></div><div class='panel'><h3>Do not over-extrapolate</h3><p>Patients with creatinine clearance below 25 mL/min or serum creatinine above 2.5 mg/dL were excluded. Therefore, these results should not be casually extrapolated to the lowest renal-function range; this patient’s eGFR around 25 is not interchangeable with Cockcroft–Gault creatinine clearance. Check current label criteria and specialist/local guidance.</p></div></div><div class='evidence-chart' data-evidence='aristotle'></div><p class='footnote'>Granger CB, et al. Apixaban versus Warfarin in Patients with Atrial Fibrillation. N Engl J Med. 2011;365:981–992. <a href='https://doi.org/10.1056/NEJMoa1107039' target='_blank' rel='noopener'>doi:10.1056/NEJMoa1107039</a>.</p>"},
{ch:"rhythm",k:"06 · Rate or rhythm?",title:"Rate control and rhythm control are not rivals",body:`<div class="strategy-visual" aria-label="Two complementary AF management strategies"><div class="strategy-lane rate-lane"><div class="strategy-icon">↘</div><div><span>PATH A</span><strong>Rate control</strong><small>Slow the ventricular response · improve symptoms and haemodynamics</small></div><div class="strategy-goal">AF may persist</div></div><div class="strategy-or">OR</div><div class="strategy-lane rhythm-lane"><div class="strategy-icon">↻</div><div><span>PATH B</span><strong>Rhythm control</strong><small>Restore or maintain sinus rhythm · cardioversion, drugs or ablation</small></div><div class="strategy-goal">Recurrence is possible</div></div><div class="strategy-join">Both paths: manage stroke risk · address substrate · shared decisions · follow-up</div></div><div class="cols"><div class="panel"><span class="tag">Rate control</span><h3>Control ventricular response</h3><p>Often reduces symptoms and prevents tachycardia-mediated dysfunction. Options depend on ventricular function and comorbidity. AF may persist.</p></div><div class="panel"><span class="tag">Rhythm control</span><h3>Restore and maintain sinus rhythm</h3><p>May improve symptoms and outcomes in selected patients. Options include cardioversion, antiarrhythmic medicines and catheter ablation.</p></div></div><p>Both approaches require attention to risk factors and thromboembolism. Discuss symptom burden, AF duration, atrial/ventricular structure, comorbidities, patient goals and likelihood of maintaining sinus rhythm.</p><div class="callout">“Rate controlled” does not mean “cured,” and restoration of sinus rhythm does not automatically remove the need for anticoagulation.</div>`},
{ch:"rhythm",k:"06 · Rate or rhythm?",title:"Choose rate or rhythm control around the patient’s goals and substrate",body:`<p class="lead">The right question is not “Which strategy wins for every patient?” It is “Which strategy best fits this patient’s symptoms, ventricular function, AF duration, comorbidity and preferences?”</p><div class="tablewrap"><table><thead><tr><th>Clinical situation</th><th>What favours considering rhythm control?</th><th>What still needs checking?</th></tr></thead><tbody><tr><td>Persistent symptoms despite reasonable rate control</td><td>Potential symptom and functional improvement</td><td>Confirm symptoms correlate with AF; consider other causes of dyspnoea/fatigue.</td></tr><tr><td>Newly diagnosed AF with cardiovascular comorbidity</td><td>Evidence supports discussing early rhythm-control strategy in appropriate patients</td><td>Eligibility, timing, drug/procedure risks, patient goals and follow-up capacity.</td></tr><tr><td>New or worsening LV systolic dysfunction</td><td>Consider AF-mediated cardiomyopathy and whether rhythm control/ablation could help</td><td>Assess other causes of LV dysfunction; optimise HF therapy and reassess ventricular function.</td></tr><tr><td>Long-standing AF, frailty or substantial comorbidity</td><td>May still be appropriate if symptoms or clinical goals justify it</td><td>Procedural risk, drug toxicity, likelihood of durable success and treatment burden.</td></tr></tbody></table></div><div class="callout warn"><b>Important:</b> apparent restoration of sinus rhythm does not automatically remove the need for anticoagulation. Stroke prevention remains a separate risk-based decision.</div>`},
{ch:"rhythm",k:"06 · Rate or rhythm?",title:"Cardioversion: timing is a safety decision",body:`<p class="lead">For AF, the risk of atrial thrombus and embolisation around cardioversion must be addressed.</p><ul><li><b>AF duration ≥48 hours or unknown:</b> before elective electrical or pharmacological cardioversion, give at least <b>3 weeks of uninterrupted therapeutic anticoagulation</b>, or perform imaging (typically transoesophageal echocardiography; cardiac CT with an appropriate delayed protocol may be an alternative) to exclude intracardiac thrombus.</li><li><b>Before cardioversion:</b> establish therapeutic anticoagulation. If imaging detects left atrial/left atrial appendage thrombus, defer cardioversion, give therapeutic anticoagulation for <b>3–6 weeks</b>, then repeat imaging to confirm resolution before reconsidering cardioversion.</li><li><b>After cardioversion:</b> continue therapeutic anticoagulation for at least <b>4 weeks without interruption</b>, regardless of whether sinus rhythm appears maintained.</li><li><b>Long term:</b> continue or stop anticoagulation according to the patient’s thromboembolic risk—not apparent rhythm success alone. This patient’s conventional CHA₂DS₂-VASc score is 3 (age 65–74, hypertension, diabetes), supporting long-term oral anticoagulation unless contraindicated.</li><li><b>Reported AF duration &lt;48 hours:</b> do not assume zero risk. Under the 2023 ACC/AHA/ACCP/HRS guideline, consider precardioversion imaging in patients not anticoagulated who have elevated thromboembolic risk (CHA₂DS₂-VASc ≥2). For low-risk patients (score 0–1) with AF duration &lt;12 hours, the benefit of imaging or pericardioversion anticoagulation is uncertain.</li><li><b>Haemodynamic instability attributable to AF:</b> perform immediate synchronised electrical cardioversion; do not delay lifesaving treatment to complete the elective anticoagulation pathway. Start anticoagulation as soon as clinically appropriate.</li></ul><div class="callout warn">These are the 2023 ACC/AHA/ACCP/HRS recommendations. Apply current local protocols and individualise treatment for bleeding risk, renal function, anticoagulant eligibility and adherence. Anticoagulation requirements apply to both electrical and pharmacological cardioversion.</div>`},
{ch:"rhythm",k:"06 · Cardioversion safety",title:"Cardioversion: three different clocks, three different questions",body:`<p class="lead">Before elective cardioversion, ask about haemodynamic stability, AF duration and thrombus protection. Do not let a planned anticoagulation pathway delay emergency treatment for instability caused by the arrhythmia.</p><div class="cols"><div class="panel"><h3>Unstable because of AF</h3><p>Perform urgent synchronised electrical cardioversion when indicated under the resuscitation pathway. Anticoagulation assessment remains important but must not delay lifesaving stabilisation.</p></div><div class="panel"><h3>AF ≥48 hours or duration unknown</h3><p>For elective cardioversion: typically at least 3 weeks of uninterrupted therapeutic anticoagulation or imaging to exclude intracardiac thrombus. Continue anticoagulation for at least 4 weeks afterwards; longer-term therapy depends on stroke risk.</p></div><div class="panel"><h3>Thrombus found on imaging</h3><p>Defer cardioversion, provide therapeutic anticoagulation for about 3–6 weeks and repeat imaging before reconsidering the procedure.</p></div><div class="panel"><h3>AF reported as under 48 hours</h3><p>Do not treat the 48-hour boundary as zero risk. Consider duration confidence, stroke risk and imaging; benefit of imaging is uncertain in very short-duration AF with low risk.</p></div></div><p class="small">Use current local guidance and individual assessment; anticoagulation does not eliminate all embolic risk.</p>`},
{ch:"rhythm",k:"06 · Rate or rhythm?",title:"Antiarrhythmic drugs: match the drug to the heart",body:`<p class="lead">Choose a rhythm-control drug only after defining LV function, coronary/structural disease, renal function, QTc, electrolytes, interactions and the monitoring that is realistically available.</p><div class="tablewrap"><table><thead><tr><th>Drug / group</th><th>Practical selection rule</th></tr></thead><tbody><tr><td><b>Flecainide or propafenone</b></td><td>Consider only when there is no prior myocardial infarction or significant structural heart disease/scar. Use a concomitant AV-nodal blocker to reduce risk of 1:1 atrial flutter conduction.</td></tr><tr><td><b>Dofetilide</b></td><td>Can be used in HFrEF in selected patients, but requires renal-based dosing, QT monitoring and monitored inpatient initiation according to protocol.</td></tr><tr><td><b>Amiodarone</b></td><td>Effective and usable in HFrEF; reserve when other strategies are ineffective, contraindicated or unsuitable because of important long-term thyroid, liver, lung, eye, skin and drug-interaction toxicity. It does not require renal dose adjustment, but CKD does not remove other safety risks.</td></tr><tr><td><b>Dronedarone</b></td><td>Do not use in NYHA III/IV heart failure or recent decompensated heart failure, or to maintain rhythm in permanent AF.</td></tr><tr><td><b>Sotalol</b></td><td>Requires renal dose selection and QT, heart-rate, potassium and magnesium monitoring; avoid in baseline QT prolongation and use particular caution in HFrEF/CKD.</td></tr></tbody></table></div><div class="callout warn">For Mr M, stage 4 CKD and possible LV systolic dysfunction make “choose an antiarrhythmic” an electrophysiology/cardiology decision—not a generic prescription. Verify current guideline, product labelling and local monitoring capacity before starting therapy.</div><p class="footnote">Drug selection and contraindications summarised from the 2023 ACC/AHA/ACCP/HRS AF guideline; this table is a teaching framework, not a prescribing order.</p>`},
{ch:"rhythm",k:"06 · Rate or rhythm?",title:"Early rhythm control and shared decisions",body:`<p class="lead">For selected patients with recently diagnosed AF, an early rhythm-control strategy may reduce adverse cardiovascular outcomes as well as improve symptoms.</p><p>That does not mean everyone should undergo cardioversion or ablation. The strategy should reflect symptom burden, duration and pattern of AF, stroke risk, atrial substrate, heart failure, frailty, comorbidities, treatment risk and patient priorities.</p><div class="cols"><div class="panel"><h3>Ask the patient</h3><p>What symptoms matter most? What outcome is most important? What is their tolerance for medicines, monitoring and procedures?</p></div><div class="panel"><h3>Set a review plan</h3><p>Agree on symptom tracking, ECG/monitoring, medication safety checks and when to escalate if AF recurs.</p></div></div>`},
{"ch":"evidence","k":"06 · Rate or rhythm?","title":"Trial evidence: does early rhythm control change outcomes?","layout":"wide","body":"<p class='lead'>Mr M has newly recognised AF plus cardiovascular risk factors. EAST-AFNET 4 asks a more useful question than “does sinus rhythm feel better?”: can an early rhythm-control strategy improve clinical outcomes?</p><div class='cols'><div class='panel'><h3>Who was studied?</h3><p>2,789 patients with early AF and cardiovascular conditions; median time since diagnosis was 36 days. Median follow-up was 5.1 years.</p><p class='small'>The strategy included antiarrhythmic drugs and, in a minority, ablation—not ablation alone.</p></div><div class='panel'><h3>Interpret the result carefully</h3><p>The primary composite was cardiovascular death, stroke, or hospitalisation for worsening heart failure or acute coronary syndrome. The event rate was 3.9 versus 5.0 per 100 person-years (HR 0.79, 96% CI 0.66–0.94). This was a strategy trial: treatment was adapted over time, and early rhythm control included antiarrhythmic drugs and sometimes ablation.</p><p><b>Applicability caveat:</b> enrolled patients had AF diagnosed within the previous year and cardiovascular conditions; do not assume the same effect size in long-standing AF, every frail patient, or patients with advanced CKD who were under-represented in some treatment evidence. Rhythm control still requires symptom, drug toxicity, procedural and patient-preference review.</p></div></div><div class='evidence-chart' data-evidence='east'></div><p class='footnote'>Kirchhof P, et al. Early Rhythm-Control Therapy in Patients with Atrial Fibrillation. N Engl J Med. 2020;383:1305–1316. <a href='https://doi.org/10.1056/NEJMoa2019422' target='_blank' rel='noopener'>doi:10.1056/NEJMoa2019422</a>.</p>"},
{"ch":"evidence","k":"06 · Rate or rhythm?","title":"AFFIRM: why “rhythm control for everyone” is not the lesson","layout":"wide","body":"<p class='lead'>Earlier in the AF era, AFFIRM compared rate-control and rhythm-control strategies in 4,060 higher-risk patients. It remains a useful warning against assuming that restoring sinus rhythm automatically improves survival.</p><div class='cols'><div class='panel'><h3>Five-year mortality</h3><p>23.8% in the rhythm-control group versus 21.3% with rate control; the difference was not statistically significant (HR 1.15, 95% CI 0.99–1.34; P=0.08).</p></div><div class='panel'><h3>Important context</h3><p>Rhythm-control patients had more hospitalisations and drug adverse effects. Many strokes occurred after warfarin was stopped or when INR was subtherapeutic—so sinus rhythm was not a substitute for appropriate anticoagulation.</p></div></div><div class='evidence-chart' data-evidence='affirm'></div><p class='callout'>Do not read AFFIRM as “never use rhythm control.” It studied a different era and strategy from modern early rhythm control, and treatment should fit the patient’s symptoms, heart failure, AF duration and preferences.</p><p class='footnote'>AFFIRM Investigators. N Engl J Med. 2002;347:1825–1833. <a href='https://doi.org/10.1056/NEJMoa021328' target='_blank' rel='noopener'>doi:10.1056/NEJMoa021328</a>.</p>"},
{ch:"evidence",k:"06 · Reading evidence",title:"How to read an AF trial without overgeneralising",body:`<p class="lead">A trial result answers a defined question in a defined population. It does not automatically answer every bedside question about symptoms, stroke, survival or procedural benefit.</p><div class="cols"><div class="panel"><h3>Start with the design</h3><ul><li>Who was enrolled, and how recently was AF diagnosed?</li><li>Was the comparison a drug, a procedure or an overall strategy?</li><li>What was the primary endpoint and duration of follow-up?</li><li>Was the analysis intention-to-treat, and was crossover common?</li></ul></div><div class="panel"><h3>Then interpret the result</h3><ul><li>Separate primary from secondary endpoints.</li><li>Look at absolute event rates as well as relative effects and confidence intervals.</li><li>Check whether the result is statistically compatible with no difference.</li><li>Ask whether CKD, age, frailty or other comorbidities were represented.</li></ul></div></div><div class="callout">A neutral primary endpoint does not mean that no patient benefits; a favourable secondary endpoint does not prove a universal benefit. Match the evidence to the question and discuss uncertainty honestly.</div>`},
{ch:"followup",k:"07 · Longitudinal follow-up",title:"Two weeks later: the story evolves",body:`<p class="lead">His ventricular rate improves after treatment of the acute episode and management of congestion. Echocardiography shows mildly reduced LV systolic function and left atrial enlargement; no mechanical valve or moderate-to-severe mitral stenosis is identified.</p><p>Renal function remains close to baseline. After shared decision-making and a renal-specific medication review, a stroke-prevention plan is documented. He is discharged with cardiology follow-up, medication counselling and a plan to reassess symptoms and ventricular function.</p><div class="callout">The clinical record should state the rhythm diagnosis, relevant investigations, chosen strategy, anticoagulation rationale, safety monitoring and follow-up responsibility.</div>`},
