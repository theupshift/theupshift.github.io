{ch:"followup",k:"07 · Longitudinal follow-up",title:"What does good follow-up include?",body:`<ul><li><b>Symptoms:</b> palpitations, exercise tolerance, dizziness, syncope, chest discomfort and heart-failure symptoms.</li><li><b>Rhythm burden:</b> ECG and ambulatory monitoring when symptoms or management questions warrant it.</li><li><b>Stroke prevention:</b> adherence, bleeding, renal function, dose appropriateness and evolving stroke risk.</li><li><b>Rate/rhythm treatment:</b> heart rate, ECG intervals, adverse effects, interactions and patient goals.</li><li><b>Risk-factor care:</b> blood pressure, diabetes, weight, alcohol, physical activity and sleep apnoea assessment where appropriate.</li><li><b>Ventricular function:</b> reassess when AF may have contributed to cardiomyopathy or heart failure.</li></ul><p>Use a structured review rather than assuming that a patient who feels better is free of clinically important AF.</p>`},
{ch:"followup",k:"07 · Longitudinal follow-up",title:"Decision 4 · AF recurs with worsening heart failure",q:"Six months later, recurrent symptomatic AF coincides with worsening heart failure despite appropriate medical therapy. What should happen next?",opts:["Abandon rhythm control because AF has recurred once","Consider specialist assessment for catheter ablation as part of an individualised rhythm-control strategy","Prescribe the same antiarrhythmic drug to all patients with heart failure and CKD","Stop anticoagulation if sinus rhythm is restored"],correct:1,why:"Catheter ablation can improve symptoms and quality of life and may improve outcomes in selected patients with AF and heart failure. Candidacy depends on heart-failure phenotype, AF pattern, comorbidity, procedural risk and preferences. CKD constrains drug choices. Successful rhythm control alone does not determine long-term anticoagulation."},
{"ch":"evidence","k":"07 · Longitudinal follow-up","title":"CABANA: ablation, recurrence and hard outcomes","layout":"wide","body":"<p class='lead'>When Mr M returns with recurrent AF and worsening LV function, ablation becomes a real option—but the evidence should be described precisely.</p><div class='cols'><div class='panel'><h3>Primary endpoint</h3><p>In CABANA, the intention-to-treat primary composite occurred in 8.0% assigned to ablation and 9.2% assigned to drug therapy; the difference was not statistically significant (HR 0.86, 95% CI 0.65–1.15; P=0.30).</p></div><div class='panel'><h3>Other outcomes</h3><p>AF recurrence was lower with ablation (49.9% vs 69.5%), and death or cardiovascular hospitalisation was lower (51.7% vs 58.1%) in secondary analyses. Those findings should not be confused with the neutral primary endpoint. Interpretation is complicated by crossover from drug therapy to ablation, the intention-to-treat design, and the fact that the trial was not powered to prove a mortality benefit in every subgroup.</p></div></div><div class='evidence-chart' data-evidence='cabana'></div><p class='footnote'>Packer DL, et al. JAMA. 2019;321:1261–1274. <a href='https://doi.org/10.1001/jama.2019.0693' target='_blank' rel='noopener'>doi:10.1001/jama.2019.0693</a>.</p>"},
{ch:"followup",k:"07 · Longitudinal follow-up",title:"Catheter ablation for AF",body:`<p class="lead">Pulmonary-vein isolation targets triggers that commonly initiate AF. It is a rhythm-control option, not a guaranteed cure.</p><div class="cols"><div class="panel"><h3>Potential benefits</h3><p>Improved symptom control and quality of life; reduced AF burden; in selected patients with heart failure, potential improvement in clinical outcomes.</p></div><div class="panel"><h3>Limits and risks</h3><p>AF can recur and repeat procedures may be needed. Discuss vascular complications, tamponade, stroke, pulmonary-vein stenosis, oesophageal injury and anaesthesia/procedural risks.</p></div></div><p><b>AF ablation anticoagulation (2023 ACC/AHA/ACCP/HRS):</b> use uninterrupted or minimally interrupted therapeutic warfarin/DOAC according to procedural protocol; continue oral anticoagulation for at least <b>3 months after AF ablation</b>. Beyond 3 months, continue according to underlying stroke risk—not apparent procedural success. Check renal function and drug-specific dosing before the procedure.</p>`},
{ch:"flutter",k:"08 · Flutter and SVT",title:"A new ECG: regular at 150/min",body:`<p class="lead">At a later visit, the monitor shows a regular narrow-complex tachycardia near 150/min. The 12-lead ECG reveals continuous saw-tooth atrial activity, negative in II, III and aVF and positive in V1.</p><p>This pattern is consistent with typical counterclockwise, cavotricuspid-isthmus-dependent atrial flutter. A ventricular rate around 150/min should prompt consideration of flutter with 2:1 AV conduction—but rate alone is not diagnostic.</p><div class="callout">Flutter may be difficult to recognise when every second flutter wave is hidden in the QRS or T wave. Look for atrial activity across multiple leads and during transient AV block when clinically appropriate.</div><button class="navbtn" data-reveal="flutter-mechanism">Reveal the mechanism and differential</button><div class="reveal-panel" data-reveal-panel="flutter-mechanism" hidden><h3>Why 2:1 flutter mimics regular SVT</h3><p>Atrial activity around 300/min with 2:1 AV conduction produces a ventricular rate around 150/min. One flutter wave may be visible while the other is buried in the QRS/T complex, making the tracing appear to be an ordinary regular narrow-complex tachycardia.</p><p><b>Look for:</b> continuous atrial activity, flutter waves in inferior leads and V1, and a change in AV conduction that unmasks atrial waves. Typical counterclockwise flutter classically has negative flutter waves in II, III and aVF and positive activity in V1, although ECG appearance can vary.</p><p><b>Differential:</b> AVNRT, orthodromic AVRT, focal atrial tachycardia and sinus tachycardia. Assess the onset, atrial activity, RP/PR relationship and response to vagal manoeuvres/adenosine when clinically appropriate. Transient AV block may reveal flutter; it may not terminate the atrial rhythm.</p></div>`},
{ch:"flutter",k:"08 · The rhythm changes",title:"A ventricular rate near 150/min is a clue—not a diagnosis",body:`<p class="lead">A regular narrow-complex rhythm around 150/min should prompt a deliberate search for atrial flutter with 2:1 AV conduction, but other SVTs remain possible.</p><div class="cols"><div class="panel"><h3>What to inspect</h3><ul><li>Look for atrial activity between QRS complexes and in the ST/T-wave segments.</li><li>Check inferior leads and V1 for flutter-wave morphology.</li><li>Assess whether the ventricular rate is exactly regular and whether atrial activity continues through AV block.</li><li>Compare with prior ECGs and document the rhythm during symptoms.</li></ul></div><div class="panel"><h3>What not to assume</h3><ul><li>Not every rate of 150 is flutter.</li><li>Flutter waves may be hidden, atypical or distorted by conduction and prior ablation.</li><li>AT, AVNRT and AVRT can also present as regular tachycardia.</li><li>Stability, QRS width and the possibility of pre-excitation still determine immediate safety.</li></ul></div></div><button class="navbtn" data-reveal="rate150-reveal">Reveal the bedside reasoning</button><div class="reveal-panel" data-reveal-panel="rate150-reveal" hidden><p>In a stable patient with a regular narrow-complex rhythm, a monitored vagal manoeuvre or adenosine may transiently increase AV block and expose atrial activity. It may not terminate flutter. If unstable, follow the urgent cardioversion pathway instead of delaying for diagnostic manoeuvres.</p></div>`},
{ch:"flutter",k:"08 · Flutter and SVT",title:"Atrial flutter: acute and definitive management",body:`<ul><li><b>If unstable because of flutter:</b> perform urgent synchronised electrical cardioversion; do not delay emergency treatment for an elective anticoagulation pathway.</li><li><b>If stable:</b> assess rate control and rhythm conversion options; rate control can be difficult in flutter. Consider specialist input if symptoms persist or the ventricular response remains rapid.</li><li><b>Stroke prevention:</b> assess thromboembolic risk using the same risk profile used for AF. For patients undergoing cardioversion or successful flutter ablation, continue therapeutic anticoagulation for at least <b>4 weeks</b> afterward; longer-term anticoagulation depends on thromboembolic risk, prior AF and the clinical context—not simply whether flutter has been eliminated.</li><li><b>Typical flutter:</b> for recurrent symptomatic cavotricuspid-isthmus-dependent flutter, CTI ablation is an effective definitive option after discussion of benefits and procedural risks.</li><li><b>After CTI ablation:</b> continue close rhythm follow-up because AF may subsequently occur. If AF has previously been documented, continue anticoagulation according to the AF risk-based indication.</li></ul><div class="callout warn">A successful flutter ablation is not, by itself, a reason to stop anticoagulation in a patient whose stroke-risk profile supports ongoing treatment. Follow current local guidance and individualise around bleeding risk.</div><p class="footnote">Anticoagulation principles: 2023 ACC/AHA/ACCP/HRS AF guideline, including its atrial-flutter recommendations.</p>`},
{ch:"flutter",k:"08 · Flutter and SVT",title:"Regular narrow-complex SVT: a different pathway",body:`<p class="lead">Later, Mr M reports a new abrupt episode of palpitations. ECG: regular narrow-complex tachycardia at 190/min, stable blood pressure, no obvious P waves. This is a different rhythm problem from his AF and should be assessed on its own ECG features.</p><ol><li>Assess stability and obtain a 12-lead ECG if this does not delay urgent care.</li><li>In stable regular narrow-complex SVT, attempt vagal manoeuvres using an appropriate technique.</li><li>If vagal manoeuvres fail in regular narrow-complex tachycardia, give rapid IV adenosine with continuous ECG monitoring and resuscitation equipment available: typically 6 mg rapid IV push followed immediately by a flush, then 12 mg if needed, following local protocol. Warn about transient flushing, chest pressure or dyspnoea. Adenosine may reveal flutter/atrial tachycardia without terminating it.</li><li>If unsuccessful or contraindicated, consider alternatives and expert advice; unstable patients need urgent electrical management.</li></ol><div class="callout warn">This pathway is not interchangeable with AF management. Avoid adenosine for irregular or polymorphic broad-complex rhythms, and use particular caution when pre-excited AF is possible.</div>`},
{ch:"flutter",k:"08 · SVT safety",title:"Adenosine is useful—but only when the rhythm and setting fit",body:`<p class="lead">Adenosine is a short-acting diagnostic and therapeutic tool for selected regular tachycardias, not a general treatment for any fast heart rate.</p><div class="cols"><div class="panel"><h3>Before administration</h3><ul><li>Confirm stability and rhythm regularity; inspect QRS width and look for pre-excitation or an irregular/polymorphic pattern.</li><li>Record a rhythm strip when feasible; use continuous ECG monitoring, a reliable IV line, immediate flush and resuscitation equipment.</li><li>Explain that transient flushing, chest pressure, breathlessness or a sense of alarm may occur and usually resolve rapidly.</li></ul></div><div class="panel"><h3>Important caveats</h3><ul><li>Adenosine may reveal flutter/atrial tachycardia without terminating it and can occasionally provoke AF.</li><li>Use caution or avoid according to protocol in severe asthma/active bronchospasm; dipyridamole may potentiate its effect and methylxanthines may blunt it.</li><li>Do not use the routine adenosine pathway for irregular broad-complex tachycardia or suspected pre-excited AF.</li><li>Follow local protocol for dose and contraindications; a common adult sequence is 6 mg rapid IV push then 12 mg if needed.</li></ul></div></div><div class="callout">If adenosine reveals ongoing atrial activity but does not terminate the tachycardia, reconsider AT or flutter rather than repeating doses without reassessing the rhythm.</div>`},
{ch:"flutter",k:"08 · Flutter and SVT",title:"Decision 5 · What is appropriate for stable regular SVT?",q:"A haemodynamically stable patient has a regular narrow-complex tachycardia consistent with AVNRT. What is a reasonable initial step?",opts:["Immediate unsynchronised defibrillation in every case","A suitable vagal manoeuvre, with monitoring and reassessment","Give a beta-blocker without confirming rhythm or checking contraindications","Treat as AF and calculate CHA₂DS₂-VASc as the only acute intervention"],correct:1,why:"For stable regular narrow-complex SVT consistent with AVNRT, an appropriate vagal manoeuvre is a reasonable initial intervention. Adenosine can be considered if needed and appropriate. Confirm the rhythm and exclude danger features; unstable tachyarrhythmias require urgent treatment. AF stroke scoring is not the primary acute intervention for AVNRT."},
{ch:"flutter",k:"08 · Flutter and SVT",title:"When SVT keeps returning",body:`<p class="lead">Recurrent symptomatic AVNRT or AVRT deserves a discussion about definitive therapy.</p><div class="cols"><div class="panel"><h3>Electrophysiology study</h3><p>Can define the mechanism and guide ablation. Consider frequency, symptom burden, syncope, occupation, patient preference and diagnostic certainty.</p></div><div class="panel"><h3>Catheter ablation</h3><p>Often offers high success rates for common re-entrant SVTs, but risks, recurrence and alternatives should be discussed by the treating specialist.</p></div></div><p>Pre-excitation on ECG or a history suggestive of accessory-pathway tachycardia warrants careful evaluation. In pre-excited AF, avoid AV-nodal blocking drugs and seek urgent expert management.</p>`},
{ch:"prevention",k:"09 · Prevention and systems",title:"Treat the substrate, not just the ECG",body:`<p class="lead">Long-term AF care includes risk-factor modification and shared decisions alongside medicines and procedures.</p><div class="cols"><div class="panel"><h3>Risk-factor management</h3><ul><li>Optimise blood pressure and diabetes</li><li>Assess weight and physical activity</li><li>Reduce harmful alcohol use</li><li>Evaluate sleep apnoea when indicated</li><li>Manage heart failure and vascular risk</li></ul></div><div class="panel"><h3>Safety and continuity</h3><ul><li>Medication reconciliation and adherence</li><li>Renal function and dose review</li><li>Bleeding-risk mitigation</li><li>Clear follow-up and return precautions</li><li>Patient understanding and preferences</li></ul></div></div><p>For AF, the 2023 US guideline recommends weight loss for patients with overweight/obesity, targeting ≥10% reduction; moderate-to-vigorous exercise targeting 210 minutes/week can be beneficial; minimise or eliminate alcohol to reduce recurrence/burden; and screen/manage hypertension and sleep-disordered breathing as appropriate. These measures complement—not replace—indicated anticoagulation.</p>`},
{ch:"prevention",k:"09 · Prevention and systems",title:"Discharge checklist",body:`<ol><li>Is the rhythm diagnosis documented and the ECG reviewed?</li><li>Have stability, precipitating causes and important complications been addressed?</li><li>Is the rate/rhythm plan appropriate to ventricular function, renal function and comorbidity?</li><li>Has stroke risk been assessed and the anticoagulation decision documented?</li><li>Are dose, renal monitoring, interactions and bleeding counselling clear?</li><li>Does the patient know when to seek urgent help?</li><li>Is follow-up booked, with responsibility for test results and medication review assigned?</li></ol><div class="callout good">A safe discharge plan makes the next clinical decision explicit; it does not simply list the medicines prescribed today.</div>`},
{ch:"synthesis",k:"10 · Put it together",title:"A unified decision pathway",body:`<div class="timeline"><div class="event"><strong>1 · Confirm and classify</strong><p>ECG, QRS width, regularity, atrial activity, onset and clinical context.</p></div><div class="event"><strong>2 · Stabilise if needed</strong><p>Unstable tachyarrhythmia → urgent electrical management and resuscitation support.</p></div><div class="event"><strong>3 · Investigate causes</strong><p>Targeted labs, echocardiography and trigger evaluation.</p></div><div class="event"><strong>4 · Treat the rhythm</strong><p>Rate or rhythm control matched to haemodynamics, LV function, renal function and goals.</p></div><div class="event"><strong>5 · Prevent stroke</strong><p>Assess thromboembolic risk, anticoagulant eligibility, dose and bleeding hazards.</p></div><div class="event"><strong>6 · Follow longitudinally</strong><p>Symptoms, recurrence, adverse effects, renal function, risk factors and patient priorities.</p></div></div>`},
{ch:"synthesis",k:"10 · Put it together",title:"Common errors to avoid",body:`<ul><li>Calling every tachycardia “SVT” without examining the ECG.</li><li>Delaying urgent cardioversion in a patient unstable because of the arrhythmia.</li><li>Using AV-nodal blockers in pre-excited AF.</li><li>Choosing rate-control or antiarrhythmic drugs without considering LV function, renal function and interactions.</li><li>Assuming aspirin prevents AF-related stroke as effectively as anticoagulation.</li><li>Using a standard anticoagulant dose without checking kidney function and dose criteria.</li><li>Stopping anticoagulation solely because sinus rhythm has returned or ablation appears successful.</li><li>Discharging without clear follow-up, education and a reassessment plan.</li></ul>`},
{ch:"synthesis",k:"10 · Put it together",title:"Case summary: what changed over time?",body:`<div class="tablewrap"><table><thead><tr><th>Time point</th><th>Clinical problem</th><th>Key decision</th></tr></thead><tbody><tr><td>First presentation</td><td>AF with rapid ventricular response and dyspnoea</td><td>Assess stability, confirm ECG, investigate trigger and complications</td></tr><tr><td>Acute admission</td><td>Stable but symptomatic; CKD and possible LV dysfunction</td><td>Individualised rate/rhythm treatment and renal-safe prescribing</td></tr><tr><td>Before discharge</td><td>Elevated thromboembolic risk</td><td>Document anticoagulation decision and monitoring</td></tr><tr><td>Six months</td><td>Recurrent AF with worsening heart failure</td><td>Revisit rhythm control and consider specialist ablation assessment</td></tr><tr><td>Later rhythm episode</td><td>Typical atrial flutter or regular SVT</td><td>Recognise the distinct ECG mechanism and use the correct pathway</td></tr></tbody></table></div><p>The key lesson is longitudinal: AF management is a sequence of decisions that should be reviewed as symptoms, comorbidities, renal function and patient goals evolve.</p>`},
{ch:"references",k:"Further learning",title:"Guidelines and references",body:`<ol class="ref-list"><li>Joglar JA, et al. 2023 ACC/AHA/ACCP/HRS Guideline for the Diagnosis and Management of Atrial Fibrillation. <i>Circulation</i>. 2024. <a href="https://doi.org/10.1161/CIR.0000000000001193" target="_blank" rel="noopener">doi:10.1161/CIR.0000000000001193</a>.</li><li>Van Gelder IC, et al. 2024 ESC Guidelines for the management of atrial fibrillation. <i>European Heart Journal</i>. <a href="https://doi.org/10.1093/eurheartj/ehae176" target="_blank" rel="noopener">doi:10.1093/eurheartj/ehae176</a>.</li><li>Brugada J, et al. 2019 ESC Guidelines for the management of patients with supraventricular tachycardia. <i>European Heart Journal</i>. <a href="https://doi.org/10.1093/eurheartj/ehz467" target="_blank" rel="noopener">doi:10.1093/eurheartj/ehz467</a>.</li><li>European Society of Cardiology. Clinical Practice Guidelines portal. <a href="https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines" target="_blank" rel="noopener">escardio.org/Guidelines</a>.</li><li>Wigginton JG, et al. Part 9: Adult Advanced Life Support: 2025 American Heart Association Guidelines for Cardiopulmonary Resuscitation and Emergency Cardiovascular Care. <i>Circulation</i>. 2025;152(Suppl 2):S538–S577. <a href="https://doi.org/10.1161/CIR.0000000000001376" target="_blank" rel="noopener">doi:10.1161/CIR.0000000000001376</a>.</li></ol><div class="callout">Guidelines are updated. Use the latest applicable national/local protocol, especially for cardioversion timing, anticoagulant dosing in advanced CKD, and emergency rhythm management.</div><p class="footnote">Educational resource only. Fictional case; not a substitute for clinical judgement, local protocols or specialist advice. ECG illustrations are schematic, not diagnostic recordings. Medication choice and dosing must be individualised.</p>`},
{ch:"results",k:"Assessment · Your results",title:"Your decisions: score, feedback and next steps",layout:"wide",body:`<p class="lead">You have completed the decision points. Review your performance, the reasoning behind each answer, and how the management changes in important alternative scenarios.</p><div class="results-summary" id="quizResults" aria-live="polite"></div><div class="panel results-scenarios"><h3>How would the pathway change?</h3><details><summary>Scenario A · The patient is unstable</summary><p>If AF/flutter is causing shock, acute heart failure, ongoing ischaemia or altered mental status, prioritise urgent synchronised electrical cardioversion. Do not delay emergency treatment to complete an elective anticoagulation pathway; address anticoagulation as soon as clinically appropriate.</p></details><details><summary>Scenario B · AF duration is ≥48 hours or unknown</summary><p>Before elective cardioversion, use at least 3 weeks of uninterrupted therapeutic anticoagulation or suitable imaging to exclude atrial thrombus. Continue anticoagulation for at least 4 weeks afterward; longer-term treatment follows thromboembolic risk, not apparent rhythm success.</p></details><details><summary>Scenario C · The patient has stage 4 CKD</summary><p>Do not automatically withhold anticoagulation or prescribe a routine dose. Confirm creatinine clearance, age, weight, drug interactions, labelled dose criteria, valve status, bleeding risks and local specialist guidance. Evidence is less robust near kidney failure.</p></details><details><summary>Scenario D · Regular narrow-complex tachycardia, stable</summary><p>Use the SVT pathway: vagal manoeuvres first; if unsuccessful and the rhythm is regular and narrow-complex, rapid IV adenosine with continuous ECG monitoring and resuscitation readiness according to local protocol. This is not the AF pathway.</p></details><details><summary>Scenario E · Flutter at about 150/min</summary><p>Consider typical atrial flutter with 2:1 AV conduction, but confirm from atrial activity and the ECG rather than rate alone. Manage stability first, assess anticoagulation, and discuss CTI ablation for recurrent symptomatic typical flutter.</p></details></div><p class="footnote">The quiz score reflects only the five single-best-answer decision questions in this case; it is a learning aid, not a measure of clinical competence.</p>`},
{ch:"end",k:"Clinical reasoning · Take-home",title:"Recognise the rhythm. Protect the patient. Reassess over time.",body:`<p class="lead">The ECG gives you a diagnosis; the patient’s physiology determines urgency; the clinical context determines treatment; and longitudinal review determines whether the plan remains right.</p><div class="cols"><div class="panel"><h3>Remember</h3><p>Stability first. ECG before assumptions. Consider the cause. Match treatment to the patient.</p></div><div class="panel"><h3>And always</h3><p>Assess stroke risk, prescribe safely in renal disease, explain the plan and arrange follow-up.</p></div></div><p class="byline">The Upshift · Interactive clinical cases</p>`}
];

/* Content pacing pass: break dense teaching slides into short visual beats. */
function afibSlide(title){return slides.find(s=>s.title===title);}
function afibAfter(title, additions){const i=slides.findIndex(s=>s.title===title);if(i>=0)slides.splice(i+1,0,...additions);}
const investigations=afibSlide("Investigations: answer a clinical question");
if(investigations)investigations.body=`
<p class="lead">Order tests to answer a decision—not to complete a checklist.</p>
<div class="cols three">
 <div class="panel"><span class="tag">Confirm</span><h3>12-lead ECG</h3><p>Verify rhythm, QRS width, conduction, ischaemia and possible pre-excitation. Compare prior tracings; repeat if the rhythm changes.</p></div>
 <div class="panel"><span class="tag">Find triggers</span><h3>Blood tests</h3><p>FBC, electrolytes and renal function; thyroid testing where relevant. Check troponin or infection markers when symptoms and probability support them.</p></div>
 <div class="panel"><span class="tag">Define substrate</span><h3>Echocardiography</h3><p>Assess LV function, atrial size, valves and structural disease. A transthoracic echo does not exclude atrial thrombus.</p></div>
</div>
<div class="callout">Target chest imaging, pulmonary embolism assessment and other tests to the presentation. Do not delay emergency stabilisation for investigations.</div>
<button class="navbtn" data-reveal="test-questions">Reveal the investigation-to-question map</button>
<div class="reveal-panel" data-reveal-panel="test-questions" hidden><div class="cols"><div><h3>Could this be dangerous now?</h3><p>Vitals, perfusion, ECG, oxygenation and targeted assessment for ischaemia or acute heart failure.</p></div><div><h3>What changes treatment?</h3><p>Renal function and electrolytes for drug safety; echo for LV/valve substrate; thyroid or infection tests when clinically plausible.</p></div></div><p><b>Principle:</b> every test should have a plausible consequence for diagnosis, treatment, risk assessment or disposition.</p></div>`;
afibAfter("Investigations: answer a clinical question",[
 {ch:"diagnosis",k:"03 · Establish the diagnosis",title:"The investigation map: question first",layout:"wide",body:`
 <div class="decision-map"><div class="decision-node"><span class="decision-step">QUESTION 1</span><strong>Is the patient unstable?</strong><small>Bedside assessment comes before the full work-up</small></div><div class="decision-stem"></div><div class="decision-split"><div class="decision-branch danger"><span class="decision-answer">YES · ACT NOW</span><strong>Stabilise</strong><p>Urgent electrical management when indicated; do not wait for routine tests.</p></div><div class="decision-branch stable"><span class="decision-answer">NO · DEFINE THE PROBLEM</span><strong>ECG + targeted tests</strong><p>Confirm rhythm, identify triggers, assess structure and plan safe prescribing.</p></div></div><div class="decision-foot">Tests are useful when their result can change the next decision.</div></div>`}
]);
const risk=afibSlide("AF risk factors: separate what cannot change from what you can treat");
if(risk)risk.body=`
<p class="lead">AF reflects a vulnerable atrial substrate plus triggers. One factor rarely explains the whole story.</p>
<div class="cols"><div class="panel"><span class="tag">Predisposition</span><h3>What we cannot readily change</h3><ul><li>Increasing age and family/genetic predisposition</li><li>Established atrial remodelling or structural disease</li><li>Some congenital disease or prior cardiac surgery</li></ul></div><div class="panel"><span class="tag">Treatment targets</span><h3>What we can address</h3><ul><li>Hypertension, diabetes, heart failure and vascular disease</li><li>Obesity, inactivity and excess alcohol</li><li>Sleep apnoea, thyroid disease, medicines and electrolyte disturbance</li></ul></div></div>
<div class="callout good"><b>For Mr M:</b> risk-factor care complements—not replaces—stroke prevention and an individualised rate/rhythm plan.</div>
<button class="navbtn" data-reveal="risk-factor-actions">Reveal a practical review</button>
<div class="reveal-panel" data-reveal-panel="risk-factor-actions" hidden><h3>Ask, measure, act, revisit</h3><div class="cols three"><div><b>Ask</b><p>Alcohol, sleep, activity, adherence and symptoms.</p></div><div><b>Measure</b><p>Blood pressure, weight, glucose, renal function and relevant labs.</p></div><div><b>Act</b><p>Agree achievable targets and follow-up; screen for sleep apnoea when indicated.</p></div></div><p>Risk-factor management does not automatically remove recurrence or embolic risk.</p></div>`;
afibAfter("AF risk factors: separate what cannot change from what you can treat",[
 {ch:"foundations",k:"02 · Causes and substrate",title:"The modifiable AF substrate",body:`
 <div class="cols three"><div class="panel"><span class="metric">01</span><h3>Cardiometabolic</h3><p>Optimise blood pressure, diabetes, weight and vascular risk.</p></div><div class="panel"><span class="metric">02</span><h3>Cardiorespiratory</h3><p>Manage heart failure; assess sleep-disordered breathing when indicated.</p></div><div class="panel"><span class="metric">03</span><h3>Behaviours & triggers</h3><p>Discuss activity, alcohol, medicines, acute illness and electrolyte disturbances.</p></div></div><div class="callout">These interventions complement indicated anticoagulation; they are not substitutes for it.</div>`}
]);
const renal=afibSlide("Choosing an anticoagulant with stage 4 CKD");
if(renal)renal.body=`
<p class="lead">Advanced CKD makes anticoagulation more nuanced—not less important.</p>
<div class="decision-map"><div class="decision-node"><span class="decision-step">STEP 1</span><strong>Confirm current renal function</strong><small>Use the renal metric required by the specific drug label; do not infer dose from eGFR alone.</small></div><div class="decision-stem"></div><div class="decision-split"><div class="decision-branch stable"><span class="decision-answer">CKD STAGE 4</span><strong>Individualise</strong><p>Warfarin or a labelled DOAC dose may be reasonable under current guidance.</p></div><div class="decision-branch danger"><span class="decision-answer">CrCl &lt;15 / DIALYSIS</span><strong>Specialist review</strong><p>Evidence is limited; selected options require guideline and product-label review.</p></div></div></div>
<p>Mr M’s baseline eGFR is around 25 mL/min/1.73 m²; safe selection still needs current renal data and the renal metric required by the product label. Also review age, body weight, serum creatinine, interacting drugs, bleeding hazards, access and patient preference.</p>
<button class="navbtn" data-reveal="renal-safety-check">Reveal the prescribing safety check</button>
<div class="reveal-panel" data-reveal-panel="renal-safety-check" hidden><h3>Before the first dose</h3><div class="cols three"><div><b>Eligibility</b><p>Check mechanical valve and moderate-to-severe mitral stenosis.</p></div><div><b>Dose</b><p>Verify creatinine clearance, age, weight and product-specific criteria.</p></div><div><b>Follow-up</b><p>Plan renal reassessment, interactions, adherence and bleeding review.</p></div></div><p class="small">For end-stage CKD or dialysis, US guidance says warfarin (INR 2.0–3.0) or an evidence-based apixaban dose might be reasonable in selected patients; this is not a universal default.</p></div>`;
afibAfter("Choosing an anticoagulant with stage 4 CKD",[
 {ch:"stroke",k:"05 · Anticoagulation caveats",title:"Eligibility before the dose",body:`
 <p class="lead">Choose the anticoagulant only after confirming the clinical setting.</p>
 <div class="cols"><div class="panel"><span class="tag">Choice-changing conditions</span><h3>Valve and kidney</h3><ul><li><b>Mechanical valve:</b> a vitamin K antagonist such as warfarin; DOACs are not a substitute.</li><li><b>Moderate-to-severe rheumatic mitral stenosis:</b> warfarin is generally preferred.</li><li><b>Stage 4 CKD:</b> apply current guideline, product label and renal data; evidence becomes less robust as renal function worsens.</li></ul></div><div class="panel"><span class="tag">Whole prescription</span><h3>Check the context</h3><ul><li>Age, weight, creatinine clearance and dose-reduction criteria</li><li>P-gp/CYP3A4 interactions and other medicines</li><li>Prior bleeding, anaemia, antiplatelets/NSAIDs and adherence</li><li>INR access and monitoring if warfarin is selected</li></ul></div></div>
 <button class="navbtn" data-reveal="doac-checklist">Reveal the final checkpoint</button>
 <div class="reveal-panel" data-reveal-panel="doac-checklist" hidden><h3>Can the plan be used safely in real life?</h3><p>Confirm the indication, exact product and dose, medicine access, monitoring plan, who will review renal results, and what the patient should do after a missed dose or bleeding symptom.</p><div class="callout warn">Aspirin or clopidogrel is not an equivalent replacement for oral anticoagulation when anticoagulation is indicated. Avoid unnecessary combined antiplatelet/anticoagulant exposure.</div></div>`}
]);
const cardio=afibSlide("Cardioversion: three different clocks, three different questions");
if(cardio)cardio.body=`
<p class="lead">Three separate questions determine the pathway: urgency, AF duration and thrombus protection.</p>
<div class="cols three"><div class="panel"><span class="metric">NOW</span><h3>Unstable because of AF</h3><p>Urgent synchronised electrical cardioversion when indicated. Do not delay lifesaving stabilisation to complete elective anticoagulation steps.</p></div><div class="panel"><span class="metric">≥3 weeks</span><h3>Before elective shock</h3><p>For AF ≥48 hours or duration unknown: typically uninterrupted therapeutic anticoagulation for at least 3 weeks, or imaging to exclude thrombus.</p></div><div class="panel"><span class="metric">≥4 weeks</span><h3>After cardioversion</h3><p>Continue anticoagulation for at least 4 weeks; long-term treatment depends on thromboembolic risk, not simply the rhythm seen after shock.</p></div></div>
<button class="navbtn" data-reveal="cardioversion-exceptions">Reveal the safety exceptions</button>
<div class="reveal-panel" data-reveal-panel="cardioversion-exceptions" hidden><div class="cols"><div><h3>If thrombus is found</h3><p>Defer cardioversion, provide therapeutic anticoagulation for about 3–6 weeks and repeat imaging before reconsidering.</p></div><div><h3>If AF is reported under 48 hours</h3><p>Do not assume zero risk. Consider confidence in onset, stroke risk and imaging; the benefit of imaging is uncertain in very short-duration AF with low risk.</p></div></div><p class="small">Anticoagulation principles apply to electrical and pharmacological cardioversion. Follow current local guidance and individualise the plan.</p></div>`;
afibAfter("Cardioversion: three different clocks, three different questions",[
 {ch:"rhythm",k:"06 · Cardioversion safety",title:"Cardioversion: a quick pathway",layout:"wide",body:`
 <div class="decision-map"><div class="decision-node"><span class="decision-step">FIRST</span><strong>Is AF causing haemodynamic instability?</strong></div><div class="decision-stem"></div><div class="decision-split"><div class="decision-branch danger"><span class="decision-answer">YES</span><strong>Synchronised cardioversion</strong><p>Immediate stabilisation pathway; anticoagulate as soon as clinically appropriate.</p></div><div class="decision-branch stable"><span class="decision-answer">NO · ELECTIVE</span><strong>Assess duration and thrombus risk</strong><p>≥48 h/unknown: 3 weeks anticoagulation or imaging; then plan post-cardioversion anticoagulation.</p></div></div><div class="decision-foot">A restored sinus rhythm does not by itself cancel long-term stroke prevention.</div></div>`}
]);
const anti=afibSlide("Antiarrhythmic drugs: match the drug to the heart");
if(anti)anti.body=`
<p class="lead">There is no universally safest rhythm drug. First define the heart, kidneys, QTc and monitoring capacity.</p>
<div class="cols"><div class="panel"><span class="tag">Selected patients</span><h3>Flecainide / propafenone</h3><p>Consider only without prior MI or significant structural disease/scar. Pair with an AV-nodal blocker to reduce 1:1 flutter conduction risk.</p></div><div class="panel"><span class="tag">Monitoring intensive</span><h3>Dofetilide / sotalol</h3><p>Require renal-aware dosing and QT/electrolyte monitoring; dofetilide initiation requires monitored inpatient care under protocol. Sotalol needs particular caution in HFrEF/CKD.</p></div><div class="panel"><span class="tag">Toxicity trade-off</span><h3>Amiodarone</h3><p>Can be used in HFrEF in selected cases, but carries important thyroid, liver, lung, eye, skin and interaction risks.</p></div><div class="panel"><span class="tag">Avoid in specific settings</span><h3>Dronedarone</h3><p>Do not use in NYHA III/IV or recently decompensated heart failure, or to maintain rhythm in permanent AF.</p></div></div>
<div class="callout warn">For Mr M, stage 4 CKD and possible LV dysfunction make drug selection a cardiology/electrophysiology decision. Verify current guidance, product labelling and local monitoring capacity.</div>
<button class="navbtn" data-reveal="antiarrhythmic-rule">Reveal the selection rule</button>
<div class="reveal-panel" data-reveal-panel="antiarrhythmic-rule" hidden><div class="decision-map"><div class="decision-node"><strong>Structural heart disease or HFrEF?</strong></div><div class="decision-stem"></div><div class="decision-split"><div class="decision-branch danger"><strong>Yes / possible</strong><p>Avoid class Ic drugs; specialist selection is needed. Dofetilide or amiodarone may be options in selected HFrEF patients, subject to local availability and monitoring.</p></div><div class="decision-branch stable"><strong>No significant structural disease</strong><p>Class Ic therapy may be considered after contraindications, interactions and the need for AV-nodal blockade are reviewed.</p></div></div></div><p class="small">This is a teaching framework, not a prescription. Individual contraindications and local protocols take precedence.</p></div>`;
afibAfter("Antiarrhythmic drugs: match the drug to the heart",[
 {ch:"rhythm",k:"06 · Rate or rhythm?",title:"The monitoring burden is part of the drug choice",body:`
 <div class="cols three"><div class="panel"><h3>Kidneys</h3><p>Renal function can change drug exposure and dose for several agents. Recheck after illness or clinical change.</p></div><div class="panel"><h3>Electrical safety</h3><p>Review QTc, heart rate, potassium and magnesium where relevant; understand proarrhythmia risk.</p></div><div class="panel"><h3>Organ toxicity</h3><p>Plan thyroid, liver, lung and other monitoring when required by the selected drug.</p></div></div><div class="callout">If the necessary monitoring cannot be delivered reliably, that limitation belongs in the shared decision—not in a footnote.</div>`}
]);
const trial=afibSlide("How to read an AF trial without overgeneralising");
if(trial)trial.body=`
<p class="lead">A trial answers one defined question in one defined population.</p>
<div class="cols"><div class="panel"><span class="tag">1 · Understand</span><h3>Who and what?</h3><ul><li>Who was enrolled, and how recently was AF diagnosed?</li><li>Drug, procedure or overall strategy?</li><li>Primary endpoint and follow-up duration?</li></ul></div><div class="panel"><span class="tag">2 · Interpret</span><h3>How much confidence?</h3><ul><li>Absolute event rates and relative effects</li><li>Confidence intervals and statistical compatibility with no difference</li><li>Crossover, comorbidities and relevance to this patient</li></ul></div></div>
<button class="navbtn" data-reveal="trial-reading">Reveal the evidence-reading checklist</button>
<div class="reveal-panel" data-reveal-panel="trial-reading" hidden><div class="cols three"><div><b>Primary first</b><p>A neutral primary endpoint is not proof that no patient benefits.</p></div><div><b>Secondary second</b><p>A favourable secondary endpoint does not prove universal benefit.</p></div><div><b>Patient always</b><p>Ask whether age, CKD, frailty and treatment access resemble the study population.</p></div></div><p class="callout">Separate statistical significance, clinical importance and applicability. They are related but not interchangeable.</p></div>`;
const substrate=afibSlide("Treat the substrate, not just the ECG");
if(substrate)substrate.body=`
<p class="lead">Long-term AF care combines risk-factor modification with medicines, procedures and follow-up.</p>
<div class="cols"><div class="panel"><span class="tag">Reduce the substrate</span><h3>Risk-factor care</h3><ul><li>Optimise blood pressure and diabetes</li><li>Manage heart failure and vascular risk</li><li>Address weight, activity and harmful alcohol use</li><li>Assess sleep apnoea when indicated</li></ul></div><div class="panel"><span class="tag">Make it sustainable</span><h3>Safety and continuity</h3><ul><li>Medication reconciliation and adherence</li><li>Renal function and dose review</li><li>Bleeding-risk mitigation</li><li>Clear follow-up and return precautions</li></ul></div></div>
<button class="navbtn" data-reveal="risk-targets">Reveal the practical targets</button>
<div class="reveal-panel" data-reveal-panel="risk-targets" hidden><h3>Examples from the 2023 US AF guideline</h3><div class="cols three"><div><span class="metric">≥10%</span><p>Weight reduction target for patients with overweight/obesity.</p></div><div><span class="metric">210 min/wk</span><p>Moderate-to-vigorous exercise may be beneficial.</p></div><div><span class="metric">Minimise</span><p>Alcohol to reduce AF recurrence/burden; individualise the conversation.</p></div></div><p class="small">These measures complement—not replace—indicated anticoagulation and rhythm/rate treatment.</p></div>`;

/* Second pacing pass: replace dense tables/lists with short cards and optional reveals. */
function afibSlide2(title){return slides.find(s=>s.title===title);}
function afibAfter2(title, additions){const i=slides.findIndex(s=>s.title===title);if(i>=0)slides.splice(i+1,0,...additions);}
const svt=afibSlide2("Regular SVT is a family of mechanisms, not one diagnosis");
if(svt)svt.body=`
<p class="lead">A regular narrow-complex tachycardia is a description. The mechanism determines what may terminate it.</p>
<div class="cols">
 <div class="panel"><span class="tag">AV-node re-entry</span><h3>AVNRT</h3><p>Often abrupt onset/offset. P waves may be hidden in the QRS or appear as pseudo-r′ in V1 / pseudo-S in inferior leads.</p></div>
 <div class="panel"><span class="tag">Accessory pathway</span><h3>AVRT</h3><p>Re-entry uses the AV node and an accessory pathway. Orthodromic AVRT is usually narrow; antidromic AVRT is broad. A concealed pathway may have no baseline delta wave.</p></div>
 <div class="panel"><span class="tag">Atrial origin</span><h3>Focal atrial tachycardia</h3><p>Consistent but non-sinus P-wave morphology. Adenosine may expose atrial activity without terminating the rhythm.</p></div>
 <div class="panel"><span class="tag">Macro-re-entry</span><h3>Typical flutter</h3><p>Often CTI-dependent. 2:1 conduction may produce about 150/min, but rate alone is not diagnostic.</p></div>
</div>
<button class="navbtn" data-reveal="svt-mechanism-short">Reveal what changes acute management</button>
<div class="reveal-panel" data-reveal-panel="svt-mechanism-short" hidden><div class="cols"><div><h3>May terminate</h3><p>Stable AVNRT and orthodromic AVRT may respond to vagal manoeuvres or adenosine.</p></div><div><h3>May only reveal</h3><p>Adenosine can transiently block the AV node and expose flutter/atrial tachycardia without terminating the atrial rhythm.</p></div></div><div class="callout warn">Avoid AV-nodal blockers—including adenosine—in suspected pre-excited AF. Treat uncertain broad-complex tachycardia as potentially ventricular until appropriately assessed.</div></div>`;
const cv=afibSlide2("Cardioversion: timing is a safety decision");
if(cv)cv.body=`
<p class="lead">Elective cardioversion is a thrombus-protection decision. Emergency cardioversion is a stabilisation decision.</p>
<div class="cols three"><div class="panel"><span class="metric">NOW</span><h3>AF causing instability</h3><p>Immediate synchronised electrical cardioversion when indicated. Do not delay lifesaving treatment to complete the elective pathway.</p></div><div class="panel"><span class="metric">3 weeks</span><h3>Before elective cardioversion</h3><p>For AF ≥48 h or unknown duration: uninterrupted therapeutic anticoagulation for at least 3 weeks, or appropriate imaging to exclude thrombus.</p></div><div class="panel"><span class="metric">4 weeks</span><h3>After cardioversion</h3><p>Continue therapeutic anticoagulation for at least 4 weeks. Long-term therapy follows thromboembolic risk, not apparent rhythm success alone.</p></div></div>
<button class="navbtn" data-reveal="cardioversion-detail">Reveal exceptions and case-specific implications</button>
<div class="reveal-panel" data-reveal-panel="cardioversion-detail" hidden><ul><li>If imaging finds left atrial/appendage thrombus, defer cardioversion, anticoagulate for 3–6 weeks and repeat imaging before reconsidering.</li><li>For reported AF under 48 hours, do not assume zero risk. Under the 2023 ACC/AHA/ACCP/HRS guideline, consider precardioversion imaging in patients not anticoagulated with elevated thromboembolic risk (CHA₂DS₂-VASc ≥2). For low-risk patients (score 0–1) with AF duration under 12 hours, the benefit of imaging or pericardioversion anticoagulation is uncertain.</li><li>Mr M’s supplied CHA₂DS₂-VASc score is 3 (age 65–74, hypertension, diabetes), supporting long-term oral anticoagulation unless contraindicated.</li></ul><p class="small">Apply current local guidance and individualise for bleeding risk, renal function, eligibility and adherence.</p></div>`;
const doac=afibSlide2("Before choosing a DOAC: check the valve, the kidney and the whole prescription");
if(doac)doac.body=`
<p class="lead">Three gates before the prescription: eligibility, renal dose, and real-world safety.</p>
<div class="decision-map"><div class="decision-split"><div class="decision-branch danger"><span class="decision-answer">GATE 1 · ELIGIBILITY</span><strong>Check the valve</strong><p>Mechanical valve or moderate-to-severe rheumatic mitral stenosis generally means warfarin rather than a DOAC.</p></div><div class="decision-branch stable"><span class="decision-answer">GATE 2 · DOSE</span><strong>Check the kidney</strong><p>Use current renal data and the metric required by the product label—often Cockcroft–Gault CrCl—not eGFR alone by habit.</p></div></div></div>
<div class="panel"><h3>Gate 3 · Check the whole prescription</h3><p>Age, weight, serum creatinine, dose-reduction criteria, P-gp/CYP3A4 interactions, bleeding history, anaemia, antiplatelets/NSAIDs, adherence, access and patient preference.</p></div>
<button class="navbtn" data-reveal="doac-safety">Reveal the CKD-specific caveat</button>
<div class="reveal-panel" data-reveal-panel="doac-safety" hidden><p>For stage 4 CKD, warfarin or a labelled DOAC dose may be reasonable under current guidance, but evidence becomes less robust as renal function worsens. For dialysis or CrCl below 15 mL/min, US guidance says warfarin or an evidence-based apixaban dose might be reasonable in selected patients—not as a universal default.</p><div class="callout warn">Aspirin or clopidogrel is not an equivalent replacement for oral anticoagulation when anticoagulation is indicated. If an antiplatelet is also needed, review indication and duration to reduce unnecessary combined bleeding risk.</div></div>`;
const ecg150=afibSlide2("A new ECG: regular at 150/min");
if(ecg150)ecg150.body=`
<p class="lead">A regular rate near 150/min is a clue to flutter with 2:1 conduction—not a diagnosis by itself.</p>
<div class="cols"><div class="panel"><h3>What the tracing shows</h3><p>Continuous saw-tooth atrial activity, negative in II, III and aVF and positive in V1, supports typical counterclockwise CTI-dependent flutter.</p></div><div class="panel"><h3>Why it is missed</h3><p>One flutter wave may be buried in the QRS or T wave, making the rhythm look like an ordinary regular narrow-complex tachycardia.</p></div></div>
<button class="navbtn" data-reveal="rate150-differential">Reveal the rhythm differential</button>
<div class="reveal-panel" data-reveal-panel="rate150-differential" hidden><h3>Do not anchor on the number</h3><ul><li>Consider flutter with 2:1 conduction, AVNRT, orthodromic AVRT, focal atrial tachycardia and sinus tachycardia.</li><li>Inspect inferior leads and V1, atrial activity between QRS complexes, RP/PR relationship and onset.</li><li>When appropriate, vagal manoeuvres or adenosine may transiently increase AV block and expose flutter waves; they may not terminate flutter.</li></ul></div>`;
const rvr=afibSlide2("Stable AF with a rapid ventricular response");
if(rvr)rvr.body=`
<p class="lead">Choose rate control around blood pressure, ventricular function, congestion, comorbidity and the likely trigger.</p>
<div class="cols"><div class="panel"><span class="tag">When appropriate</span><h3>Beta-blocker or diltiazem/verapamil</h3><p>Recommended options for stable AF with RVR when suitable. Diltiazem/verapamil are options when LVEF is &gt;40%.</p></div><div class="panel"><span class="tag">When options are limited</span><h3>Digoxin / IV magnesium / amiodarone</h3><p>Consider digoxin when first-line agents are ineffective or contraindicated; IV magnesium may be added. IV amiodarone may be considered in critical illness or decompensated HF when other agents are unsuitable.</p></div></div>
<div class="callout warn">Avoid diltiazem/verapamil in moderate or severe LV systolic dysfunction. Use digoxin cautiously in CKD; avoid AV-nodal blockers in pre-excited AF.</div>
<button class="navbtn" data-reveal="rvr-rate-target">Reveal the rate target and reassessment</button>
<div class="reveal-panel" data-reveal-panel="rvr-rate-target" hidden><div class="cols"><div><span class="metric">&lt;100–110/min</span><p>A reasonable initial resting target for many patients without heart failure, if symptoms permit.</p></div><div><h3>Do not treat the monitor alone</h3><p>Individualise for symptoms, LV function and haemodynamics. In this patient with possible HF, do not apply a lenient target mechanically. Treat precipitants and reassess perfusion, congestion and symptoms.</p></div></div><p class="small">Rate-control principles: 2023 ACC/AHA/ACCP/HRS AF guideline. Emergency escalation: 2025 AHA adult tachyarrhythmia algorithm.</p></div>`;
const strategies=afibSlide2("Rate control and rhythm control are not rivals");
if(strategies)strategies.body=`
<div class="strategy-visual" aria-label="Two complementary AF management strategies"><div class="strategy-lane rate-lane"><div class="strategy-icon">↘</div><div><span>PATH A</span><strong>Rate control</strong><small>Slow the ventricular response · improve symptoms and haemodynamics</small></div><div class="strategy-goal">AF may persist</div></div><div class="strategy-or">OR</div><div class="strategy-lane rhythm-lane"><div class="strategy-icon">↻</div><div><span>PATH B</span><strong>Rhythm control</strong><small>Restore or maintain sinus rhythm · cardioversion, drugs or ablation</small></div><div class="strategy-goal">Recurrence is possible</div></div><div class="strategy-join">Both paths: manage stroke risk · address substrate · shared decisions · follow-up</div></div>
<p class="lead">Neither path wins for every patient. Match the strategy to symptoms, AF duration, cardiac structure, comorbidity and goals.</p>
<button class="navbtn" data-reveal="strategy-choice">Reveal a bedside decision guide</button>
<div class="reveal-panel" data-reveal-panel="strategy-choice" hidden><div class="cols"><div class="panel"><h3>Rate control may fit when…</h3><p>Symptoms are acceptable after rate control, the patient prefers a simpler strategy, or rhythm-control benefit is uncertain or treatment burden is high.</p></div><div class="panel"><h3>Consider rhythm control when…</h3><p>Symptoms persist, AF may contribute to LV dysfunction, AF is recently diagnosed, or the patient values sinus rhythm after understanding risks and likelihood of recurrence.</p></div></div><div class="callout">Both strategies still require stroke-risk assessment. Sinus rhythm after cardioversion or ablation does not automatically remove the need for anticoagulation.</div></div>`;
const flutter=afibSlide2("Atrial flutter: acute and definitive management");
if(flutter)flutter.body=`
<div class="cols"><div class="panel"><span class="tag">Acute</span><h3>Stabilise and control</h3><p>If unstable because of flutter, urgent synchronised cardioversion. If stable, assess rate control and rhythm-conversion options; rate control can be difficult in flutter.</p></div><div class="panel"><span class="tag">Definitive</span><h3>Consider CTI ablation</h3><p>For recurrent symptomatic typical CTI-dependent flutter, ablation is an effective definitive option after discussion of benefits and procedural risks.</p></div></div>
<button class="navbtn" data-reveal="flutter-followup">Reveal the anticoagulation and follow-up rule</button>
<div class="reveal-panel" data-reveal-panel="flutter-followup" hidden><ul><li>Assess thromboembolic risk using the same risk profile used for AF.</li><li>After cardioversion or successful flutter ablation, continue therapeutic anticoagulation for at least 4 weeks; longer-term treatment depends on stroke risk, prior AF and clinical context.</li><li>AF can occur after CTI ablation. If AF has previously been documented, continue anticoagulation according to the AF risk-based indication.</li></ul><div class="callout warn">A successful flutter ablation is not, by itself, a reason to stop anticoagulation when the stroke-risk profile supports ongoing treatment.</div></div>`;
const adenosine=afibSlide2("Adenosine is useful—but only when the rhythm and setting fit");
if(adenosine)adenosine.body=`
<p class="lead">Adenosine is for selected regular tachycardias—not every fast heart rate.</p>
<div class="cols"><div class="panel"><h3>Before giving it</h3><ul><li>Confirm stability, regularity and QRS width; look for pre-excitation or an irregular/polymorphic pattern.</li><li>Continuous ECG, reliable IV line, rapid flush and resuscitation equipment.</li><li>Explain transient flushing, chest pressure, breathlessness or alarm; effects usually resolve rapidly.</li></ul></div><div class="panel"><h3>Important cautions</h3><ul><li>May reveal flutter/atrial tachycardia without terminating it; can occasionally provoke AF.</li><li>Severe asthma/active bronchospasm, dipyridamole and methylxanthines affect suitability or response.</li><li>Do not use the routine pathway for irregular broad-complex tachycardia or suspected pre-excited AF.</li></ul></div></div>
<button class="navbtn" data-reveal="adenosine-pathway">Reveal the monitored sequence</button>
<div class="reveal-panel" data-reveal-panel="adenosine-pathway" hidden><div class="decision-map"><div class="decision-node"><strong>Stable, regular narrow-complex SVT?</strong></div><div class="decision-stem"></div><div class="decision-split"><div class="decision-branch stable"><strong>First</strong><p>Appropriate vagal manoeuvre and reassessment.</p></div><div class="decision-branch stable"><strong>If needed and suitable</strong><p>Rapid IV adenosine with continuous ECG monitoring; common adult sequence 6 mg, then 12 mg if needed, following local protocol.</p></div></div></div><p>If it reveals ongoing atrial activity without termination, reconsider atrial tachycardia or flutter rather than repeating doses without reassessing the rhythm.</p></div>`;

const patientThreadByTitle={"Start with the rhythm — and the patient":"Mr M’s story begins before anyone names the rhythm: he is breathless, frightened by a racing heart, and wants to know whether he is in immediate danger. The first job is to assess the person, not just the monitor.","Three rhythms that are often conflated":"A colleague calls every fast rhythm “SVT.” Mr M’s irregular pulse is the clue that the mechanism matters: AF, flutter and AV-node-dependent SVT do not share one treatment pathway.","A practical ECG checklist":"You ask the junior doctor to describe the tracing before interpreting it. Regularity, QRS width, atrial activity and the AV relationship become a repeatable method—not a guess based on heart rate.","AF on ECG: what you are looking for":"Mr M’s tracing has no consistent P waves and an irregularly irregular ventricular response. The ECG now explains his pulse, but it does not yet explain why he is breathless.","Atrial flutter and regular SVT":"Keep this distinction in mind: later in the story, a rhythm close to 150/min will challenge the team to recognise flutter rather than assume recurrent AF.","The first presentation":"Mr M is 71, has hypertension, type 2 diabetes and stage 4 CKD (baseline eGFR about 25 mL/min/1.73 m²). After two days of palpitations and worsening orthopnoea, he worries he will not be able to manage his usual walk to the local shops. BP is 145/88, pulse 128 and irregular, oxygen saturation 94% on room air. He is alert and warm: urgent assessment is needed, but the observations do not by themselves prove instability.","Decision 1 · What comes first?":"The triage nurse asks whether stroke scoring should start immediately. You explain that it matters—but if AF is causing shock, ongoing ischaemia or acute pulmonary oedema, the time-critical decision comes first.","The ECG result":"The ECG confirms AF with a rapid ventricular response. Mr M is still speaking in full sentences, so the team can assess congestion and causes while monitoring him closely; any deterioration would change the pathway immediately.","AF is a syndrome with causes and consequences":"His family says he has been slowing down for weeks, not just since the palpitations began. The history may reveal a longer process, so the team checks for prior episodes, missed or changed medicines, infection, ischaemia, thyroid disease and symptoms of heart failure.","Investigations: answer a clinical question":"Creatinine is close to his known baseline; electrolytes, blood count, thyroid testing and troponin are interpreted alongside the clinical picture. Echocardiography is ordered because the team needs to know ventricular function, atrial size and valve disease before choosing longer-term treatment.","Why did AF occur?":"Age, hypertension, diabetes and CKD make an atrial substrate plausible, while acute illness or congestion could be a trigger. The team avoids the comforting but unsafe conclusion that finding one trigger means AF or stroke risk has disappeared.","If unstable: electricity before fine-tuning":"While he remains stable, the team prepares for deterioration rather than waiting to think about it after it happens. If the arrhythmia causes life-threatening instability, synchronised cardioversion takes priority over lengthy investigations.","Stable AF with a rapid ventricular response":"Because Mr M has CKD and possible ventricular dysfunction, the team does not reach automatically for a familiar rate-control drug. It chooses according to blood pressure, congestion, LV function and renal handling, then checks whether symptoms and perfusion improve.","Decision 2 · Which rate-control caveat matters most?":"A proposed digoxin prescription prompts a pause: his renal function changes the risk of accumulation. The team checks dosing and monitoring rather than treating the medication chart as routine.","Search for precipitants and complications":"Slowing the heart rate helps, but Mr M’s orthopnoea and congestion still need attention. The team treats what is present, looks for important precipitants, and documents what remains uncertain.","Stroke prevention is a separate decision":"When Mr M asks whether a normal pulse after treatment means the danger has passed, you explain that stroke prevention is a separate decision from symptom control and may remain necessary even when sinus rhythm returns.","Our patient’s stroke-risk profile":"At age 71, hypertension and diabetes give Mr M a conventional CHA₂DS₂-VASc score of 3. This supports an anticoagulation discussion; the team checks valve status, bleeding hazards, renal function and his preferences before choosing a plan.","Choosing an anticoagulant with stage 4 CKD":"His eGFR near 25 makes a standard-dose reflex unsafe. The team verifies creatinine clearance, product labelling, dose criteria and local guidance, and explains that evidence in advanced CKD is less secure than in the broader AF trial populations.","Decision 3 · What should guide stroke prevention?":"Mr M is concerned about bleeding and asks if aspirin would be gentler. The clinician discusses the difference between antiplatelet therapy and anticoagulation, correctable bleeding risks, monitoring and the consequences of leaving embolic risk untreated.","Rate control and rhythm control are not rivals":"Mr M wants to breathe normally and get back to daily activities. Rate control may relieve symptoms; rhythm control may offer additional benefit in selected patients. The choice is revisited as his ventricular function, symptom burden and preferences become clearer.","Cardioversion: timing is a safety decision":"The team discusses cardioversion only after considering AF duration, thromboembolic risk and the required anticoagulation or imaging pathway. A successful shock would not, by itself, settle the long-term anticoagulation question.","Antiarrhythmic drugs: match the drug to the heart":"His CKD, possible LV dysfunction and drug-interaction profile narrow the safe options. The team weighs proarrhythmia, organ toxicity and monitoring burden against the patient’s goal of fewer symptomatic episodes.","Early rhythm control and shared decisions":"Mr M has newly recognised AF and cardiovascular comorbidity, so the team explains the evidence for considering early rhythm control without promising that a procedure or medicine is right for everyone. He says avoiding another admission matters as much as the palpitations.","Two weeks later: the story evolves":"At follow-up, the rate is better but he still tires easily. Echo shows left atrial enlargement and mildly reduced LV systolic function, with no mechanical valve or moderate-to-severe mitral stenosis. The team confirms the renal-aware stroke-prevention plan and agrees on symptom and ECG review.","What does good follow-up include?":"Mr M brings his medication list and says he sometimes skips a dose when he feels well. This opens a practical conversation about adherence, bleeding symptoms, renal monitoring, ECG follow-up and when to seek urgent care.","Decision 4 · AF recurs with worsening heart failure":"Six months later he returns with recurrent AF, more orthopnoea and reduced exercise tolerance; repeat imaging now shows an LVEF around 35%. The team must consider whether AF is contributing to ventricular dysfunction and escalate beyond simply repeating the old plan.","Catheter ablation for AF":"After optimisation of heart-failure therapy, Mr M meets the electrophysiology team to discuss pulmonary-vein isolation. He asks whether ablation means he can stop anticoagulation; the team explains that stroke prevention still follows his thromboembolic risk.","A new ECG: regular at 150/min":"At a later visit, the monitor is strikingly regular at about 150/min. Mr M’s earlier AF has made the team alert to rhythm recurrence, but this tracing requires fresh analysis rather than anchoring on the previous diagnosis.","Atrial flutter: acute and definitive management":"The saw-tooth atrial activity supports typical flutter with possible 2:1 conduction. The team treats the current physiology, reassesses anticoagulation using AF-like thromboembolic principles, and discusses the high success rate of isthmus ablation when appropriate.","Regular narrow-complex SVT: a different pathway":"A later episode is abrupt-onset, regular and narrow-complex without the flutter pattern. The team considers AVNRT/AVRT, checks for instability and pre-excitation, and chooses the correct vagal-manoeuvre/adenosine pathway only when suitable.","Decision 5 · What is appropriate for stable regular SVT?":"Mr M is stable during the regular narrow-complex episode. The team first confirms the rhythm and checks for contraindications; it does not use adenosine indiscriminately for irregular AF or an irregular broad-complex rhythm.","When SVT keeps returning":"Episodes are beginning to interrupt Mr M’s daily life. Shared decision-making now includes documenting the mechanism, discussing electrophysiology referral and comparing a definitive procedure with repeated acute treatment.","Treat the substrate, not just the ECG":"Mr M’s story shows why durable care includes blood-pressure and diabetes control, CKD-aware prescribing, heart-failure optimisation, activity and alcohol discussions, and assessment for sleep apnoea when indicated.","Discharge checklist":"Before the next discharge, Mr M should be able to explain his rhythm diagnosis, medication purpose, anticoagulation plan, monitoring schedule and red flags. A named clinician and follow-up date matter as much as the prescription.","A unified decision pathway":"Across the timeline, the sequence stays consistent: assess stability, define the ECG, treat causes and complications, prevent stroke, choose a patient-matched rate/rhythm strategy, then review what changed.","Common errors to avoid":"The team avoids four tempting shortcuts: treating every tachycardia alike, equating rate control with cure, stopping anticoagulation because sinus rhythm returns, and applying trial results without checking whether the patient resembles the trial population.","Case summary: what changed over time?":"Mr M moves from first-detected AF with rapid ventricular response to a stroke-prevention decision, then recurrent AF with worsening LV function, and finally a distinct regular tachycardia. Each new event changes the question; it does not erase the earlier risks.","Recognise the rhythm. Protect the patient. Reassess over time.":"At the end of the case, Mr M’s care is not a single correct drug. It is a sequence of reassessments that align ECG mechanism, haemodynamic urgency, stroke risk, renal safety, heart-failure status and his own priorities."};

function drawEvidenceChart(box,modeKey){
 const set=evidenceData[box.dataset.evidence];if(!set)return;
 const mode=set.modes.find(m=>m.key===modeKey)||set.modes[0];
 const max=Math.max(mode.a.value,mode.b.value)||1;
 box.innerHTML='<div class="chart-heading">'+set.title+'</div><div class="chart-controls">'+set.modes.map(m=>'<button type="button" class="chart-mode '+(m.key===mode.key?'active':'')+'" data-chart-mode="'+m.key+'">'+m.label+'</button>').join('')+'</div><div class="chart-caption" style="margin-top:0;margin-bottom:12px">Measure: '+mode.unit+'</div>'+[mode.a,mode.b].map((v,i)=>'<div class="chart-row"><div class="chart-label">'+v.label+'</div><div class="chart-track" role="img" aria-label="'+v.label+': '+v.display+'"><div class="chart-bar '+(i===0?'a':'b')+'" style="width:'+(v.value/max*100)+'%"></div></div><div class="chart-value">'+v.display+'</div></div>').join('')+'<div class="chart-legend"><span>'+mode.a.label+'</span><span>'+mode.b.label+'</span></div><div class="chart-caption">'+mode.caption+'</div>';
 box.querySelectorAll('[data-chart-mode]').forEach(btn=>btn.addEventListener('click',()=>drawEvidenceChart(box,btn.dataset.chartMode)));
}

 const rhythmExplanations={
  af:{title:"Atrial fibrillation (AF)",text:"Electrical activation across the atria is disorganised, with multiple wandering wavefronts rather than one coordinated atrial contraction. The ventricular response is typically irregularly irregular, and there are no consistent discrete P waves."},
  atach:{title:"Atrial tachycardia (ATach)",text:"A rapidly firing focus in the atrium repeatedly sends activation across the atrial tissue. The atrial rhythm is usually organised and regular, often with discrete P waves of an abnormal shape; the ventricular response depends on AV-node conduction."},
  flutter:{title:"Atrial flutter",text:"A large organised re-entry circuit—classically around the right atrium and tricuspid annulus—activates the atria rapidly and regularly. Flutter waves may look saw-toothed; the ventricular rate depends on the ratio of AV conduction (often 2:1, near 150/min)."},
  avnrt:{title:"AV nodal re-entrant tachycardia (AVNRT)",text:"An electrical impulse circulates in a small re-entry circuit involving pathways in or near the AV node. Episodes often start and stop abruptly and produce a very regular narrow-complex tachycardia; P waves may be hidden or appear just after the QRS."},
  avrt:{title:"AV re-entrant tachycardia (AVRT)",text:"The re-entry loop uses the normal AV conduction system in one direction and an accessory pathway between atrium and ventricle in the other. Orthodromic AVRT is usually narrow-complex; antidromic AVRT can be broad-complex. Assess the ECG and clinical context before treatment."}
 };

 el.querySelectorAll("[data-calc-score]").forEach(btn=>btn.addEventListener("click",()=>{const checked=k=>!!el.querySelector('[data-risk="'+k+'"]').checked;let total=(checked("chf")?1:0)+(checked("htn")?1:0)+(checked("age75")?2:0)+(checked("diabetes")?1:0)+(checked("stroke")?2:0)+(checked("vascular")?1:0)+(checked("age65")?1:0)+(checked("female")?1:0);const out=el.querySelector("[data-score-result]");const male=!checked("female");let interp=male?(total>=2?"Anticoagulation is recommended under the 2023 US guideline threshold (estimated annual thromboembolic risk ≥2%; approximately CHA₂DS₂-VASc ≥2 in men).":total===1?"Anticoagulation is reasonable to consider (approximately 1–2% annual risk; score 1 in men), after shared decision-making.":"At this score, routine anticoagulation may not be indicated solely on the score; confirm risk factors and applicable local guidance."):(total>=3?"Anticoagulation is recommended under the 2023 US guideline threshold (estimated annual thromboembolic risk ≥2%; approximately CHA₂DS₂-VASc ≥3 in women).":total===2?"Anticoagulation is reasonable to consider (approximately 1–2% annual risk; score 2 in women), after shared decision-making.": "At this score, routine anticoagulation may not be indicated solely on the score; confirm risk factors and applicable local guidance.");if(checked("age75")&&checked("age65"))interp="Invalid age selection: choose either age 65–74 or age ≥75, not both. Correct the selection and recalculate.";out.innerHTML='<div class="score-number">'+total+'</div><b>CHA₂DS₂-VASc total</b><p>'+interp+'</p><p><b>Case comparison:</b> Mr M is 71, male, hypertensive and diabetic, with no additional stroke-risk features supplied in the case: score 3. If he were ≥75, age contributes 2 rather than 1 (score 4 with the same known features). If he had a prior stroke/TIA/systemic embolism, add 2 points (score 5 in the original case profile). A score never replaces assessment of bleeding hazards, valve disease, renal function, patient preferences or local guidance.</p>';out.hidden=false;}));
 el.querySelectorAll("[data-reset-score]").forEach(btn=>btn.addEventListener("click",()=>{el.querySelectorAll("[data-risk]").forEach(x=>x.checked=false);["htn","diabetes","age65"].forEach(k=>{const x=el.querySelector('[data-risk="'+k+'"]');if(x)x.checked=true;});const out=el.querySelector("[data-score-result]");out.hidden=true;out.innerHTML="";}));
 el.querySelectorAll("[data-answer]").forEach(btn=>btn.addEventListener("click",()=>{answers[index]=Number(btn.dataset.answer);render();}));

 slides.forEach((item,i)=>{const seg=document.createElement("button");seg.type="button";seg.className="seg"+(i<index?" done":"")+(i===index?" current":"")+(i>0&&item.ch!==slides[i-1].ch?" unit-start":"");seg.style.setProperty("--seg-color",item.ch==="acute"?"#a45d65":item.ch==="stroke"?"#547f92":item.ch==="rhythm"?"#87699a":item.ch==="flutter"?"#3e7954":"#4b4a78");seg.title="Slide "+(i+1)+": "+item.title;seg.setAttribute("aria-label","Go to slide "+(i+1)+": "+item.title);if(i===index)seg.setAttribute("aria-current","step");seg.addEventListener("click",()=>go(i));segments.appendChild(seg);});
 stage.scrollTop=0;
}
function go(n){index=Math.max(0,Math.min(slides.length-1,n));render();}
prev.addEventListener("click",()=>go(index-1));
document.getElementById("reset-case").addEventListener("click",()=>{index=0;answers={};render();});
next.addEventListener("click",()=>{if(index<slides.length-1)go(index+1);else go(0);});
const fullscreenButton=document.getElementById("fullscreen"), fullscreenRoot=document.documentElement, fullscreenContent=document.querySelector(".afib-main .app");
let immersiveFullscreen=false;
function setFullscreenState(on){immersiveFullscreen=on;document.body.classList.toggle("cirrhosis-fullscreen",on);fullscreenRoot.classList.toggle("cirrhosis-fullscreen",on);if(fullscreenButton){fullscreenButton.textContent=on?"Exit Fullscreen":"Fullscreen";fullscreenButton.setAttribute("aria-label",on?"Exit fullscreen":"Enter fullscreen");fullscreenButton.setAttribute("title",on?"Exit fullscreen":"Fullscreen");}}
async function enterFullscreen(){const target=fullscreenContent||fullscreenRoot;try{if(target.requestFullscreen){await target.requestFullscreen({navigationUI:"hide"});return true;}if(target.webkitRequestFullscreen){target.webkitRequestFullscreen();return true;}}catch(error){console.warn("Fullscreen request failed; using immersive page mode.",error);}setFullscreenState(true);return false;}
async function exitFullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen){await document.exitFullscreen();return true;}if(document.webkitFullscreenElement&&document.webkitExitFullscreen){document.webkitExitFullscreen();return true;}}catch(error){console.warn("Fullscreen exit failed; returning to page mode.",error);}setFullscreenState(false);return false;}
fullscreenButton.addEventListener("click",async()=>{if(document.fullscreenElement||document.webkitFullscreenElement||immersiveFullscreen)await exitFullscreen();else await enterFullscreen();});
document.addEventListener("fullscreenchange",()=>setFullscreenState(!!document.fullscreenElement));document.addEventListener("webkitfullscreenchange",()=>setFullscreenState(!!document.webkitFullscreenElement));
document.getElementById("escape-fullscreen").addEventListener("click",async()=>{if(immersiveFullscreen||document.fullscreenElement||document.webkitFullscreenElement)await exitFullscreen();});
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==="ArrowRight"&&index<slides.length-1)go(index+1);if(e.key==="ArrowLeft"&&index>0)go(index-1);});
render();
})();
