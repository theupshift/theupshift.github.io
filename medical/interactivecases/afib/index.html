ghs proarrhythmia, organ toxicity and monitoring burden against the patient’s goal of fewer symptomatic episodes.","Early rhythm control and shared decisions":"Mr M has newly recognised AF and cardiovascular comorbidity, so the team explains the evidence for considering early rhythm control without promising that a procedure or medicine is right for everyone. He says avoiding another admission matters as much as the palpitations.","Two weeks later: the story evolves":"At follow-up, the rate is better but he still tires easily. Echo shows left atrial enlargement and mildly reduced LV systolic function, with no mechanical valve or moderate-to-severe mitral stenosis. The team confirms the renal-aware stroke-prevention plan and agrees on symptom and ECG review.","What does good follow-up include?":"Mr M brings his medication list and says he sometimes skips a dose when he feels well. This opens a practical conversation about adherence, bleeding symptoms, renal monitoring, ECG follow-up and when to seek urgent care.","Decision 4 · AF recurs with worsening heart failure":"Six months later he returns with recurrent AF, more orthopnoea and reduced exercise tolerance; repeat imaging now shows an LVEF around 35%. The team must consider whether AF is contributing to ventricular dysfunction and escalate beyond simply repeating the old plan.","Catheter ablation for AF":"After optimisation of heart-failure therapy, Mr M meets the electrophysiology team to discuss pulmonary-vein isolation. He asks whether ablation means he can stop anticoagulation; the team explains that stroke prevention still follows his thromboembolic risk.","A new ECG: regular at 150/min":"At a later visit, the monitor is strikingly regular at about 150/min. Mr M’s earlier AF has made the team alert to rhythm recurrence, but this tracing requires fresh analysis rather than anchoring on the previous diagnosis.","Atrial flutter: acute and definitive management":"The saw-tooth atrial activity supports typical flutter with possible 2:1 conduction. The team treats the current physiology, reassesses anticoagulation using AF-like thromboembolic principles, and discusses the high success rate of isthmus ablation when appropriate.","Regular narrow-complex SVT: a different pathway":"A later episode is abrupt-onset, regular and narrow-complex without the flutter pattern. The team considers AVNRT/AVRT, checks for instability and pre-excitation, and chooses the correct vagal-manoeuvre/adenosine pathway only when suitable.","Decision 5 · What is appropriate for stable regular SVT?":"Mr M is stable during the regular narrow-complex episode. The team first confirms the rhythm and checks for contraindications; it does not use adenosine indiscriminately for irregular AF or an irregular broad-complex rhythm.","When SVT keeps returning":"Episodes are beginning to interrupt Mr M’s daily life. Shared decision-making now includes documenting the mechanism, discussing electrophysiology referral and comparing a definitive procedure with repeated acute treatment.","Treat the substrate, not just the ECG":"Mr M’s story shows why durable care includes blood-pressure and diabetes control, CKD-aware prescribing, heart-failure optimisation, activity and alcohol discussions, and assessment for sleep apnoea when indicated.","Discharge checklist":"Before the next discharge, Mr M should be able to explain his rhythm diagnosis, medication purpose, anticoagulation plan, monitoring schedule and red flags. A named clinician and follow-up date matter as much as the prescription.","A unified decision pathway":"Across the timeline, the sequence stays consistent: assess stability, define the ECG, treat causes and complications, prevent stroke, choose a patient-matched rate/rhythm strategy, then review what changed.","Common errors to avoid":"The team avoids four tempting shortcuts: treating every tachycardia alike, equating rate control with cure, stopping anticoagulation because sinus rhythm returns, and applying trial results without checking whether the patient resembles the trial population.","Case summary: what changed over time?":"Mr M moves from first-detected AF with rapid ventricular response to a stroke-prevention decision, then recurrent AF with worsening LV function, and finally a distinct regular tachycardia. Each new event changes the question; it does not erase the earlier risks.","Recognise the rhythm. Protect the patient. Reassess over time.":"At the end of the case, Mr M’s care is not a single correct drug. It is a sequence of reassessments that align ECG mechanism, haemodynamic urgency, stroke risk, renal safety, heart-failure status and his own priorities."};
const evidenceData={"east":{"title":"EAST-AFNET 4 · switch the outcome","modes":[{"key":"primary","label":"Primary outcome","unit":"events per 100 person-years","caption":"First-primary-outcome event rate: 3.9 vs 5.0 per 100 person-years; HR 0.79 (96% CI 0.66–0.94), P=0.005. This is a rate comparison, not a simple percentage of patients.","a":{"label":"Early rhythm control","value":3.9,"display":"3.9"},"b":{"label":"Usual care","value":5,"display":"5.0"}},{"key":"safety","label":"Serious treatment-related events","unit":"patients (%)","caption":"Serious adverse events related to rhythm-control therapy occurred in 4.9% vs 1.4%. Benefits need to be weighed against treatment-related harm and monitoring.","a":{"label":"Early rhythm control","value":4.9,"display":"4.9%"},"b":{"label":"Usual care","value":1.4,"display":"1.4%"}}]},"affirm":{"title":"AFFIRM · five-year mortality","modes":[{"key":"mortality","label":"5-year mortality","unit":"patients (%)","caption":"Mortality was 23.8% with rhythm control and 21.3% with rate control; P=0.08. The trial did not show a statistically significant survival advantage for rhythm control.","a":{"label":"Rhythm control","value":23.8,"display":"23.8%"},"b":{"label":"Rate control","value":21.3,"display":"21.3%"}}]},"aristotle":{"title":"ARISTOTLE · annual event rates","modes":[{"key":"stroke","label":"Stroke / systemic embolism","unit":"events per 100 patient-years","caption":"1.27% per year with apixaban vs 1.60% with warfarin; HR 0.79 (95% CI 0.66–0.95).","a":{"label":"Apixaban","value":1.27,"display":"1.27%/yr"},"b":{"label":"Warfarin","value":1.6,"display":"1.60%/yr"}},{"key":"bleeding","label":"Major bleeding","unit":"events per 100 patient-years","caption":"2.13% per year with apixaban vs 3.09% with warfarin; HR 0.69 (95% CI 0.60–0.80). The result is from the trial population, not proof of identical benefit in every degree of CKD.","a":{"label":"Apixaban","value":2.13,"display":"2.13%/yr"},"b":{"label":"Warfarin","value":3.09,"display":"3.09%/yr"}}]},"cabana":{"title":"CABANA · change the endpoint","modes":[{"key":"primary","label":"Primary endpoint","unit":"patients with primary endpoint (%)","caption":"The primary endpoint occurred in 8.0% assigned to ablation vs 9.2% assigned to drug therapy; HR 0.86 (95% CI 0.65–1.15), P=0.30. Not statistically significant.","a":{"label":"Ablation","value":8,"display":"8.0%"},"b":{"label":"Drug therapy","value":9.2,"display":"9.2%"}},{"key":"recurrence","label":"AF recurrence","unit":"patients (%)","caption":"AF recurrence occurred in 49.9% assigned to ablation vs 69.5% assigned to drug therapy (HR 0.52, 95% CI 0.45–0.60). Ablation reduced recurrence, but did not significantly reduce the primary composite endpoint.","a":{"label":"Ablation","value":49.9,"display":"49.9%"},"b":{"label":"Drug therapy","value":69.5,"display":"69.5%"}},{"key":"hospital","label":"Death or CV hospitalisation","unit":"patients (%)","caption":"Death or cardiovascular hospitalisation occurred in 51.7% assigned to ablation vs 58.1% assigned to drug therapy; a secondary outcome. Interpret within the trial's crossover and endpoint context.","a":{"label":"Ablation","value":51.7,"display":"51.7%"},"b":{"label":"Drug therapy","value":58.1,"display":"58.1%"}}]}};
function drawEvidenceChart(box,modeKey){
 const set=evidenceData[box.dataset.evidence];if(!set)return;
 const mode=set.modes.find(m=>m.key===modeKey)||set.modes[0];
 const max=Math.max(mode.a.value,mode.b.value)||1;
 box.innerHTML='<div class="chart-heading">'+set.title+'</div><div class="chart-controls">'+set.modes.map(m=>'<button type="button" class="chart-mode '+(m.key===mode.key?'active':'')+'" data-chart-mode="'+m.key+'">'+m.label+'</button>').join('')+'</div><div class="chart-caption" style="margin-top:0;margin-bottom:12px">Measure: '+mode.unit+'</div>'+[mode.a,mode.b].map((v,i)=>'<div class="chart-row"><div class="chart-label">'+v.label+'</div><div class="chart-track" role="img" aria-label="'+v.label+': '+v.display+'"><div class="chart-bar '+(i===0?'a':'b')+'" style="width:'+(v.value/max*100)+'%"></div></div><div class="chart-value">'+v.display+'</div></div>').join('')+'<div class="chart-legend"><span>'+mode.a.label+'</span><span>'+mode.b.label+'</span></div><div class="chart-caption">'+mode.caption+'</div>';
 box.querySelectorAll('[data-chart-mode]').forEach(btn=>btn.addEventListener('click',()=>drawEvidenceChart(box,btn.dataset.chartMode)));
}
function setupEvidenceCharts(root){root.querySelectorAll('.evidence-chart').forEach(box=>drawEvidenceChart(box));}

let index=0,answers={};
const stage=document.getElementById("stage"),prev=document.getElementById("prevBtn"),next=document.getElementById("nextBtn");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(){
 const s=slides[index];stage.innerHTML="";
 const el=document.createElement("section");el.className="slide visible";
 const stack=document.createElement("div");stack.className="stack"+(s.layout==="wide"?" wide":"");
 let html="";
 if(s.ch==="start"){html='<div class="kicker">'+s.k+'</div><h1>'+s.title+'</h1><p class="lead">'+s.sub+'</p>'+s.body;}
 else {html='<div class="kicker">'+s.k+'</div><h2>'+s.title+'</h2>'+(patientThreadByTitle[s.title]?'<div class="story-thread"><div class="story-label">Mr M · the story so far</div><p>'+patientThreadByTitle[s.title]+'</p></div>':(s.ch==="evidence"?'<div class="story-thread"><div class="story-label">Back to Mr M</div><p>'+ (s.title.includes("EAST-AFNET")?"His AF is newly recognised, so the team asks whether acting early can change outcomes.":s.title.includes("AFFIRM")?"Mr M wants a rhythm strategy, but the team must separate symptom relief from proven survival benefit.":s.title.includes("ARISTOTLE")?"His stroke risk makes anticoagulation a priority; advanced CKD makes applicability of trial data the next question.":"His recurrent AF and worsening LV function make ablation worth discussing, while evidence and patient goals still matter.")+'</p></div>':''))+(s.body||"");}
 if(s.q){
  html+='<div class="question"><p class="qtitle"><b>Pause and decide</b><br>'+s.q+'</p><div class="answers">';
  s.opts.forEach((o,i)=>{const chosen=answers[index];let cls="answer";if(chosen!==undefined&&i===s.correct)cls+=" correct";if(chosen===i&&i!==s.correct)cls+=" wrong";html+='<button class="'+cls+'" data-answer="'+i+'" '+(chosen!==undefined?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';});
  html+='</div><div class="feedback" '+(answers[index]===undefined?'hidden':'')+'><strong>'+(answers[index]===s.correct?'Correct — review the reasoning':'Review the key point')+'</strong>'+s.why+'</div></div>';
 }
 stack.innerHTML=html;el.appendChild(stack);stage.appendChild(el);setupEvidenceCharts(el);
 if(s.ch==="results"){const out=el.querySelector("#quizResults");const qs=slides.map((x,i)=>({x,i})).filter(v=>v.x.q);const done=qs.filter(v=>answers[v.i]!==undefined);const score=done.filter(v=>answers[v.i]===v.x.correct).length;out.innerHTML='<div class="results-score"><div><div class="score-number">'+score+'/'+qs.length+'</div><b>Decision questions correct</b><p class="small">'+done.length+' of '+qs.length+' answered</p></div><div><b>'+(done.length<qs.length?'Finish any unanswered questions to complete your score.':score===qs.length?'Excellent — all decision points correct.':score>=Math.ceil(qs.length*.6)?'Good foundation — review the missed decisions.':'Use the explanations below to consolidate the safety-critical steps.')+'</b><p>Each rationale is tied to the question you saw in the case. A wrong answer is a prompt to revisit the reasoning, not a clinical grade.</p></div></div>'+qs.map((v,n)=>{const chosen=answers[v.i];const ok=chosen===v.x.correct;return '<div class="result-row"><strong>'+(n+1)+'. '+v.x.title+' — '+(chosen===undefined?'<span class="miss">Not answered</span>':ok?'<span class="right">Correct</span>':'<span class="miss">Review</span>')+'</strong><p><b>Question:</b> '+v.x.q+'</p><p><b>Best answer:</b> '+v.x.opts[v.x.correct]+'</p><p><b>Reasoning:</b> '+v.x.why+'</p></div>';}).join('');}
 el.querySelectorAll("[data-reveal]").forEach(btn=>btn.addEventListener("click",()=>{const panel=el.querySelector('[data-reveal-panel="'+btn.dataset.reveal+'"]');if(!panel)return;panel.hidden=!panel.hidden;btn.textContent=panel.hidden?"Reveal the key teaching point":"Hide teaching point";}));
 el.querySelectorAll("[data-risk]").forEach(input=>input.addEventListener("change",()=>{if(input.dataset.risk==="age75"&&input.checked){const x=el.querySelector('[data-risk="age65"]');if(x)x.checked=false;}if(input.dataset.risk==="age65"&&input.checked){const x=el.querySelector('[data-risk="age75"]');if(x)x.checked=false;}}));
 el.querySelectorAll("[data-calc-score]").forEach(btn=>btn.addEventListener("click",()=>{const checked=k=>!!el.querySelector('[data-risk="'+k+'"]').checked;let total=(checked("chf")?1:0)+(checked("htn")?1:0)+(checked("age75")?2:0)+(checked("diabetes")?1:0)+(checked("stroke")?2:0)+(checked("vascular")?1:0)+(checked("age65")?1:0)+(checked("female")?1:0);const out=el.querySelector("[data-score-result]");const male=!checked("female");let interp=male?(total>=2?"Anticoagulation is recommended under the 2023 US guideline threshold (estimated annual thromboembolic risk ≥2%; approximately CHA₂DS₂-VASc ≥2 in men).":total===1?"Anticoagulation is reasonable to consider (approximately 1–2% annual risk; score 1 in men), after shared decision-making.":"At this score, routine anticoagulation may not be indicated solely on the score; confirm risk factors and applicable local guidance."):(total>=3?"Anticoagulation is recommended under the 2023 US guideline threshold (estimated annual thromboembolic risk ≥2%; approximately CHA₂DS₂-VASc ≥3 in women).":total===2?"Anticoagulation is reasonable to consider (approximately 1–2% annual risk; score 2 in women), after shared decision-making.": "At this score, routine anticoagulation may not be indicated solely on the score; confirm risk factors and applicable local guidance.");if(checked("age75")&&checked("age65"))interp="Invalid age selection: choose either age 65–74 or age ≥75, not both. Correct the selection and recalculate.";out.innerHTML='<div class="score-number">'+total+'</div><b>CHA₂DS₂-VASc total</b><p>'+interp+'</p><p><b>Case comparison:</b> Mr M is 71, male, hypertensive and diabetic, with no additional stroke-risk features supplied in the case: score 3. If he were ≥75, age contributes 2 rather than 1 (score 4 with the same known features). If he had a prior stroke/TIA/systemic embolism, add 2 points (score 5 in the original case profile). A score never replaces assessment of bleeding hazards, valve disease, renal function, patient preferences or local guidance.</p>';out.hidden=false;}));
 el.querySelectorAll("[data-reset-score]").forEach(btn=>btn.addEventListener("click",()=>{el.querySelectorAll("[data-risk]").forEach(x=>x.checked=false);["htn","diabetes","age65"].forEach(k=>{const x=el.querySelector('[data-risk="'+k+'"]');if(x)x.checked=true;});const out=el.querySelector("[data-score-result]");out.hidden=true;out.innerHTML="";}));
 el.querySelectorAll("[data-answer]").forEach(btn=>btn.addEventListener("click",()=>{answers[index]=Number(btn.dataset.answer);render();}));
 prev.disabled=index===0;next.textContent=index===slides.length-1?"Finish":"Next →";
 document.getElementById("counter").textContent=(index+1)+" / "+slides.length;
 document.getElementById("navchapter").textContent=s.k||s.ch;
 document.getElementById("navtitle").textContent=s.title;
 document.getElementById("progressfill").style.width=((index+1)/slides.length*100)+"%";
 stage.scrollTop=0;
}
function go(n){index=Math.max(0,Math.min(slides.length-1,n));render();}
prev.addEventListener("click",()=>go(index-1));
next.addEventListener("click",()=>{if(index<slides.length-1)go(index+1);else go(0);});
document.getElementById("resetBtn").addEventListener("click",()=>{index=0;answers={};render();});
document.getElementById("contentsBtn").addEventListener("click",()=>{
 const unique=slides.map((s,i)=>({key:s.k||s.ch,title:s.title,index:i}));
 const existing=document.getElementById("contentsOverlay");if(existing){existing.remove();return;}
 const overlay=document.createElement("div");overlay.id="contentsOverlay";overlay.style.cssText="position:absolute;inset:0;z-index:10;background:#f9f7f1f5;overflow:auto;padding:24px clamp(18px,6vw,70px)";
 overlay.innerHTML='<div style="max-width:800px;margin:auto"><button class="topbtn" id="closeContents">Close ×</button><h2 style="font-weight:500;font-size:34px">Case contents</h2><p class="muted">Jump to a teaching section.</p><div id="contentsList"></div></div>';
 stage.appendChild(overlay);const list=overlay.querySelector("#contentsList");
 let activeChapter="";unique.forEach(item=>{if(item.key!==activeChapter){activeChapter=item.key;const h=document.createElement("h3");h.className="contents-section";h.textContent=activeChapter;list.appendChild(h);}const b=document.createElement("button");b.className="answer contents-item";b.style.width="100%";b.style.margin="5px 0";b.innerHTML='<span class="contents-number">'+String(item.index+1).padStart(2,"0")+'</span><span class="contents-copy"><b>'+esc(item.title)+'</b><small>Slide '+(item.index+1)+' of '+slides.length+'</small></span>';b.setAttribute("aria-label","Go to slide "+(item.index+1)+": "+item.title);b.addEventListener("click",()=>{overlay.remove();go(item.index);});list.appendChild(b);});
 overlay.querySelector("#closeContents").addEventListener("click",()=>overlay.remove());
});
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==="ArrowRight"&&index<slides.length-1)go(index+1);if(e.key==="ArrowLeft"&&index>0)go(index-1);});
render();
})();
</script>
