const SLIDES=[
{ch:"title",type:"title",layout:"title-slide",kicker:"Clinical Reasoning",title:"Cirrhosis",sub:"An interactive case of progressive liver disease",presenter:"Clinical Rhythm",socialLabel:"",socialUrl:"",artCredit:"Background artwork created with Google Gemini. Clinical Rhythm"},
{ch:"found",type:"text",layout:"left",section:"Two Ways Cirrhosis Causes Harm",wide:true,body:`<p class="lead">Cirrhosis is diffuse hepatic fibrosis with regenerative nodules. Its complications arise from <span class="hl">two related processes</span>.</p><h3>Loss of hepatic function</h3><p>The liver becomes less effective at bilirubin handling, albumin synthesis, clotting-factor synthesis, ammonia clearance, drug metabolism, and immune surveillance.</p><h3>Portal hypertension</h3><p>Fibrosis and sinusoidal resistance impede portal flow. The resulting pressure produces ascites, varices, splenomegaly, thrombocytopenia, and collateral vessels.</p>`},
{ch:"found",type:"question-open",layout:"left",section:"The Portal Vein",revealImage:"portal-system-capillary-beds.jpg",revealImagePos:"center center",revealImageSize:"contain",revealImageFade:"sides",revealBg:"#f7f3eb",stem:`The portal vein carries blood from the intestines to the liver. <b>Why is it called a portal vein, and can you name another portal system in the body?</b>`,reveal:`<span class="tag">Concept</span><p>A portal vessel connects two capillary beds in series. The gut capillaries drain into the portal vein, then into the hepatic sinusoids before blood returns to the heart.</p><p>The other classic portal system is the <b>hypophyseal portal system</b>, connecting hypothalamus to anterior pituitary.</p><p><b>Portosystemic shunts</b> are collateral channels that let portal blood bypass the liver when resistance rises. This is the anatomy behind varices, caput medusae, splenorenal shunts, and hepatic encephalopathy.</p>`},
{ch:"found",type:"text",layout:"right",section:"Early Clues to Cirrhosis",wide:true,body:`<p class="lead">The history, examination, and routine laboratory results may raise concern before imaging or biopsy.</p><ul><li><b>Splenomegaly</b></li><li><b>Thrombocytopenia</b></li><li><b>AST &gt; ALT</b></li><li><b>Scores</b>: FIB-4, ELF, FibroScan, and other noninvasive fibrosis tools help decide who needs the next test.</li><li><b>Examination findings</b>: spiders, palmar erythema, sarcopenia, jaundice, ascites, venous collaterals.</li></ul>`},
{ch:"found",type:"text",layout:"left",section:"Etiologic Evaluation",wide:true,body:`<p class="lead">Organize the evaluation by major etiologic categories.</p><div class="grid2"><div><h3>Hepatotoxic</h3><ul><li>Alcohol</li><li>Medications and toxins</li></ul></div><div><h3>Inflammatory</h3><ul><li>Hepatitis B and C</li><li>Autoimmune hepatitis</li><li>PBC and PSC</li></ul></div><div><h3>Metabolic</h3><ul><li>MASLD or MASH</li><li>Hemochromatosis</li><li>Wilson disease</li><li>A1AT deficiency</li></ul></div><div><h3>Vascular or cardiac</h3><ul><li>Budd–Chiari</li><li>Congestive hepatopathy</li><li>Cryptogenic after the workup</li></ul></div></div>`},
{ch:"tap",type:"text",layout:"left",section:"Meet Adam",kicker:"Case Presentation",wide:true,body:`<p class="lead">Adam R. is a 54-year-old man at a routine primary-care visit. He has no specific complaint and says he feels well.</p><p>He drinks “a few” most nights and a six-pack on many weekends. He is irritated by the question: <span class="em">“All my friends drink. So what?”</span> His father “had a bad liver” and died in his 60s.</p><p>Medical history: type 2 diabetes and hypertension. Medications: metformin and lisinopril. No prior surgeries.</p>`},
{ch:"tap",type:"text",layout:"right",section:"Physical Examination",wide:true,body:`<div class="vitals"><div class="vital"><div class="k">Temp</div><div class="v">36.8 °C</div></div><div class="vital"><div class="k">HR</div><div class="v">74</div></div><div class="vital"><div class="k">BP</div><div class="v">128/78</div></div><div class="vital"><div class="k">SpO₂</div><div class="v">98%</div></div></div><ul><li>Well appearing, BMI 31.</li><li>Sclerae anicteric.</li><li>Abdomen soft, non-tender, no fluid wave.</li><li>No spider angiomata, no palmar erythema, no jaundice.</li><li>Alert, oriented, no asterixis.</li></ul><h3>Labs</h3><div class="vitals"><div class="vital flag"><div class="k">PLT</div><div class="v">145</div></div><div class="vital"><div class="k">BMP</div><div class="v">Normal</div></div><div class="vital flag"><div class="k">AST</div><div class="v">86</div></div><div class="vital"><div class="k">ALT</div><div class="v">54</div></div><div class="vital"><div class="k">INR</div><div class="v">1.1</div></div></div>`},
{ch:"tap",type:"text",layout:"left",section:"Two Years Later",body:`<p class="lead">Adam returns to the emergency department. His abdomen has swollen for six weeks. He cannot button his pants, has early satiety, and his ankles are puffy at night.</p><p>He is still drinking. Exam now shows a distended abdomen with fluid wave and shifting dullness, mild scleral icterus, and spider angiomata.</p>`},
{ch:"tap",type:"question-open",layout:"left",section:"Abdominal Distension",stem:`<b>What are the next best steps?</b>`,reveal:`<span class="tag">Recommended action</span><p>You may start with an ultrasound to confirm (but remember, ascites can be diagnosed via physical exam).</p><p class="big">Diagnostic paracentesis.</p><p>New-onset ascites should be tapped. In a hospitalized patient with cirrhosis and ascites, do not delay the diagnostic tap just because the abdomen is not tender.</p><div class="callout"><span class="lab">Bedside rule</span><p>Perform diagnostic paracentesis for new ascites and for hospitalized patients with cirrhosis and ascites.</p></div>`},
{ch:"tap",type:"question-open",layout:"left",section:"Initial Ascitic Fluid Studies",stem:`During diagnostic paracentesis, <b>Which ascitic fluid tests do you send first?</b>`,reveal:`<span class="tag">Tubes</span><ul><li><b>Cell count with differential</b>: the most important test because PMN count drives the SBP decision.</li><li><b>Ascitic albumin</b> plus same-day serum albumin: calculates SAAG.</li><li><b>Total protein</b>: helps with etiology and SBP risk.</li></ul><p>Extra tests such as cytology, amylase, triglycerides, AFB, glucose, and LDH depend on the story.</p>`},
{ch:"tap",type:"question-open",layout:"right",section:"Ascitic Fluid Results",wide:true,stem:`<p class="lead">Five liters of straw-colored fluid are removed.</p><div class="vitals"><div class="vital"><div class="k">Ascitic PMN</div><div class="v">120/mm³</div></div><div class="vital"><div class="k">Ascitic albumin</div><div class="v">0.6</div></div><div class="vital"><div class="k">Serum albumin</div><div class="v">2.9</div></div><div class="vital"><div class="k">SAAG</div><div class="v">2.3</div></div><div class="vital"><div class="k">Protein</div><div class="v">1.0</div></div></div><b>1. After removing 5 liters, what medication should be given?</b><br><b>2. How do you interpret these results?</b>`,reveal:`<span class="tag">Answer</span><p><b>Albumin</b> after large-volume paracentesis: give about <b>6 to 8 g per liter removed</b> when 5 liters or more are removed.</p><p>PMN count is below 250, so this is not SBP today. SAAG ≥1.1 points to portal hypertension. Total protein is low, which will matter later.</p>`},
{ch:"tap",type:"table",layout:"left",section:"Where Does Adam’s Ascites Fit?",focusTable:true,target:[0,0],values:[{k:"SAAG",v:"2.3",s:"Portal hypertension"},{k:"Total protein",v:"1.0",s:"Low-opsonin fluid"},{k:"PMN",v:"120",s:"Not SBP today"}],intro:`Given Adam’s SAAG and total protein, <b>which quadrant explains his ascites?</b> Click each quadrant to reveal the differential.`,cols:["SAAG ≥ 1.1","SAAG < 1.1"],rowLabels:["Protein < 2.5","Protein ≥ 2.5"],cells:[[{name:"Cirrhosis",sub:"Portal HTN and low opsonins"},{name:"Nephrotic syndrome",sub:"Protein lost in urine"}],[{name:"Cardiac ascites",sub:"Protein-rich portal HTN"},{name:"Malignancy / TB / pancreatic",sub:"Exudative or peritoneal"}]],note:`Adam lands in the high-SAAG, low-protein quadrant: cirrhotic ascites from portal hypertension. The low protein also flags higher SBP risk.`},
{ch:"tap",type:"question-open",layout:"left",section:"The Culture Turns Positive",stem:`Two days later the microbiology lab calls. The culture from the original tap is positive for gram-negative rods, later speciated as <b>Klebsiella pneumoniae</b>.<br><br>The ascitic PMN count was 120/mm³. He has no fever, no pain, and no worsening kidney function.<br><br><b>What is the next step?</b>`,reveal:`<span class="tag">Next step</span><p>Repeat the diagnostic paracentesis and reassess symptoms. A positive culture with PMN below 250 is bacterascites; management depends on symptoms and whether the repeat tap evolves toward SBP.</p>`},
{ch:"tap",type:"table",layout:"left",section:"What Kind of Infection Is This?",syndromeTable:true,wide:true,intro:`Adam’s PMN count is 120/mm³ and the culture is positive. <b>What do you call this?</b>`,cols:["PMN < 250","PMN ≥ 250"],rowLabels:["Culture negative","Culture positive"],cells:[[{name:"Sterile ascites",sub:"No SBP",treat:false},{name:"CNNA",sub:"Culture-negative neutrocytic ascites",treat:true}],[{name:"Bacterascites",sub:"Non-neutrocytic bacterascites",treat:null,target:true},{name:"SBP",sub:"Spontaneous bacterial peritonitis",treat:true}]],txLabels:{true:"Treat",false:"No antibiotics",null:"Treat if symptomatic"},note:`Adam has bacterascites. If asymptomatic, repeat the tap and reassess rather than automatically starting full SBP therapy.`},
{ch:"sbp",type:"question-open",layout:"right",section:"Primary Prophylaxis",stem:`A colleague says, <span class="em">“His ascitic protein is low. Start prophylaxis now so he never gets SBP.”</span><br><br><b>Why would your colleague suggest this?</b>`,reveal:`<span class="tag">Mechanism</span><p>Low-protein cirrhotic ascites has impaired opsonic activity. Bacteria that translocate from the gut enter fluid that cannot clear them well. Protein-rich cardiac ascites is much less prone to spontaneous infection.</p><p>Primary prophylaxis may be considered in select high-risk patients with very low ascitic protein plus advanced liver or renal dysfunction. Low protein alone is a risk flag, not the same as prior SBP.</p>`},
{ch:"sbp",type:"text",layout:"left",section:"Decision on Primary Prophylaxis",body:`<p class="lead">You do not start primary SBP prophylaxis after the first tap.</p><p>He does not clearly meet high-risk criteria. Low ascitic protein alone does not establish an indication for primary prophylaxis.</p><p>He goes home with sodium restriction, spironolactone and furosemide, counseling on alcohol cessation, and hepatology follow-up.</p>`},
{ch:"sbp",type:"text",layout:"right",section:"Three Weeks Later",wide:true,kicker:"Emergency Department",body:`<p class="lead">Three weeks later Adam returns with fever, diffuse abdominal pain, and worsening confusion.</p><div class="vitals"><div class="vital flag"><div class="k">Temp</div><div class="v">38.9 °C</div></div><div class="vital flag"><div class="k">HR</div><div class="v">108</div></div><div class="vital flag"><div class="k">BP</div><div class="v">98/60</div></div><div class="vital flag"><div class="k">PMN</div><div class="v">960/mm³</div></div></div><p>You tap immediately. PMN ≥250/mm³ means <span class="hl">spontaneous bacterial peritonitis</span>, even before cultures return.</p>`},
{ch:"sbp",type:"question-mc",layout:"left",section:"Protecting the Kidneys",stem:`You start empiric IV ceftriaxone. <b>Which addition has the clearest renal and survival benefit in SBP?</b>`,options:[{t:"FFP"},{t:"Albumin",correct:true},{t:"Prednisone"},{t:"Carvedilol"},{t:"Lactated ringers"}],rationale:`<p><b>Albumin</b> is the answer. The classic regimen is 1.5 g/kg on day 1 and 1 g/kg on day 3. In the landmark trial, albumin plus antibiotics reduced renal impairment and mortality in SBP.</p><p>Prednisone has no role. Carvedilol can be dangerous in hypotensive infection. Crystalloid may be needed for shock, but it does not reproduce the trial-proven albumin benefit.</p>`},
{ch:"sbp",type:"question-open",layout:"left",section:"Before He Leaves",stem:`He improves. You are writing discharge orders. <b>What must you not forget now that he has survived SBP?</b>`,reveal:`<span class="tag">Checklist</span><ul><li><b>Secondary SBP prophylaxis</b>: after true SBP, daily prophylaxis is the key discharge medication.</li><li><b>Diuretics</b>: commonly spironolactone and furosemide in a 100:40 mg starting ratio, titrated carefully.</li><li><b>Close hepatology follow-up</b>: SBP is decompensation and a transplant-referral trigger.</li><li><b>Alcohol treatment plan</b>: not “counseling done.” He needs structured relapse-prevention support.</li></ul>`},
{ch:"var",type:"text",layout:"left",section:"Adam Returns With Hematemesis",wide:true,kicker:"Emergency Department",body:`<p class="lead">Months later Adam arrives by ambulance vomiting bright red blood. He is pale and clammy, with melena on the stretcher.</p><div class="vitals"><div class="vital flag"><div class="k">HR</div><div class="v">122</div></div><div class="vital flag"><div class="k">BP</div><div class="v">88/54</div></div><div class="vital flag"><div class="k">Hgb</div><div class="v">6.8</div></div><div class="vital"><div class="k">Lactate</div><div class="v">3.4</div></div></div><p class="qstem emphasis-q"><b>What is the next step in action or management?</b></p>`},
{ch:"var",type:"question-mc",layout:"right",section:"GI Bleeding in Cirrhosis",hideTitle:true,softThird:true,compactAnswer:true,answerTag:"Answer",stem:`<b>Which intervention has the clearest mortality benefit in acute variceal bleeding?</b>`,options:[{t:"High dose PPI"},{t:"Octreotide"},{t:"Ceftriaxone",correct:true},{t:"FFP to correct INR"},{t:"Platelets to correct thrombocytopenia"},{t:"Endoscopy within 6 hours of bleed"},{t:"Emergent TIPS referral"},{t:"Blakemore"},{t:"Esophageal stenting"}],rationale:`<p><b>Ceftriaxone</b> reduces infection, rebleeding, and mortality; start it at presentation. Octreotide and urgent endoscopy are also standard. Balloon tamponade or stenting are rescue measures; use TIPS early in selected high-risk patients or as rescue for uncontrolled bleeding.</p>`},
{ch:"var",type:"question-open",layout:"left",section:"How Does Octreotide Help?",stem:`<b>Why does octreotide help in suspected variceal bleeding?</b>`,reveal:`<span class="tag">Mechanism</span><p>Portal hypertension is driven by high intrahepatic resistance plus high splanchnic inflow.</p><p>Octreotide reduces splanchnic blood flow. Less gut inflow means less portal inflow, lower variceal pressure, and less bleeding.</p><div class="callout"><span class="lab">Physiologic sequence</span><p>Less splanchnic inflow → less portal pressure → less variceal wall tension.</p></div>`},
{ch:"var",type:"question-open",layout:"right",section:"Endoscopy Findings",boost:true,blur:true,stem:`<span class="bigline">Urgent endoscopy</span>Large esophageal varices with red wale signs and active oozing are controlled with band ligation. His CTP is class C, score 11.<br><br><b>What should you consider before he rebleeds?</b>`,reveal:`<span class="tag">Consider early TIPS</span><p class="big">Pre-emptive TIPS within 24 to 72 hours.</p><p>High-risk patients, especially Child–Pugh C below 14 or Child–Pugh B with active bleeding at endoscopy, may benefit from early TIPS. The landmark trial showed reduced failure to control bleeding, reduced rebleeding, and improved survival.</p><div class="callout"><span class="lab">After placement</span><p>Get a baseline Doppler ultrasound so later velocities can be compared against a known functioning shunt.</p></div>`},
{ch:"enc",type:"question-open",layout:"left",section:"Adam Is Not Himself",stem:`<p class="lead">One week after TIPS, his wife brings him back. He is drowsy, disoriented to date, and has asterixis.</p><b>What role should an ammonia level play in his evaluation?</b>`,reveal:`<div class="he-answer"><span class="tag">Bottom line</span><p class="big">Do not use an elevated ammonia level to diagnose or grade HE.</p><div class="he-interpret"><p><b>Elevated</b><span>Does not confirm HE.</span></p><p class="he-normal"><b>Normal</b><span>Reconsider HE and search for another cause.</span></p><p><b>Serial</b><span>Do not trend ammonia to judge treatment response.</span></p></div><div class="he-action"><span class="he-label">Act in parallel</span><p>Check for infection or SBP, GI bleeding, constipation, volume depletion, electrolyte or glucose abnormalities, AKI, and sedating medications.</p><p class="he-tips"><b>Recent TIPS is a strong clue—but still look for reversible triggers.</b></p></div></div>`},
{ch:"enc",type:"question-open",layout:"right",section:"How Do You Treat This?",stem:`Adam has overt hepatic encephalopathy after TIPS.<br><br><b>What is the next step in management?</b>`,reveal:`<span class="tag">Treatment sequence</span><p><b>Start lactulose</b> and titrate to 2 to 3 soft stools daily.</p><p>If he remains encephalopathic or has recurrence, <b>add rifaximin</b>.</p><p>At the same time, identify and treat the precipitating cause: infection, GI bleeding, constipation, dehydration, electrolyte abnormalities, sedatives, renal failure, or the new TIPS.</p>`},
{ch:"enc",type:"question-open",layout:"right",section:"Hepatic Encephalopathy",stem:`He remains confused despite lactulose, rifaximin, infection workup, electrolyte correction, and medication review.<br><br><b>What do you do now?</b>`,reveal:`<span class="tag">Call IR</span><p class="big">Discuss TIPS reduction.</p><p>A TIPS is a deliberate portosystemic shunt. It sends portal blood around the liver, which helps portal hypertension but can worsen encephalopathy. Refractory post-TIPS HE may require shunt reduction or, rarely, occlusion.</p>`},
{ch:"hrs",type:"text",layout:"left",section:"TIPS Reduction",wide:true,body:`<p class="lead">Adam undergoes TIPS reduction because his encephalopathy remains refractory despite lactulose, rifaximin, infection workup, electrolyte correction, and medication review.</p><div class="scorebox"><div class="tile"><div class="n">3</div><div class="l">PSG before</div></div><div class="tile"><div class="n">9</div><div class="l">PSG after</div></div><div class="tile"><div class="n">Less</div><div class="l">Shunt flow</div></div></div><p>The intervention deliberately raises the portosystemic gradient. Less portal blood bypasses the liver, so encephalopathy can improve, but portal-hypertension complications can return.</p>`},
{ch:"hrs",type:"question-open",layout:"right",section:"What Does 3 → 9 Mean?",stem:`Adam's portosystemic gradient changes from <b>3 to 9 mm Hg</b> after TIPS reduction.<br><br><b>How should this change be interpreted?</b>`,reveal:`<span class="tag">Meaning</span><p>A PSG of 3 is very low: the shunt is decompressing the portal system aggressively, which can worsen encephalopathy by bypassing hepatic detoxification.</p><p>Raising the PSG to 9 means the shunt is smaller or more resistant. That can reduce encephalopathy, but it also allows portal pressure to climb again, so ascites and variceal risk can re-emerge.</p>`},
{ch:"hrs",type:"text",layout:"left",section:"Portal Pressure Measurements",wide:true,body:`<p class="lead">Each measurement describes a different component of portal pressure physiology.</p><table class="scoretable"><tr><th>Term</th><th>How it is measured</th><th>What it means</th></tr><tr><td>FHVP</td><td>Free hepatic venous pressure</td><td>Downstream hepatic vein/IVC pressure.</td></tr><tr><td>WHVP</td><td>Wedged hepatic venous pressure</td><td>Estimates sinusoidal portal pressure in cirrhosis.</td></tr><tr><td>HVPG</td><td>WHVP - FHVP</td><td>Portal pressure gradient without a TIPS. Clinically significant portal HTN starts around 10; bleeding risk rises above 12.</td></tr><tr><td>PSG</td><td>Portal pressure - right atrial/IVC pressure</td><td>The gradient across a TIPS. It tells you how much decompression the shunt is providing.</td></tr></table>`},
{ch:"hrs",type:"text",layout:"right",section:"The Tradeoff",body:`<p class="lead">His encephalopathy improves.</p><p>Over the next weeks, however, his abdomen expands again. He notices that his umbilical hernia, previously flat, now pops out when he stands or coughs.</p><p class="em">The TIPS reduction solved one pressure problem by recreating another.</p>`},
{ch:"hrs",type:"text",layout:"right",section:"Back With Tense Ascites",wide:true,body:`<p class="lead">He presents to the hospital with tense ascites and a reducible umbilical hernia.</p><div class="vitals"><div class="vital"><div class="k">WBC</div><div class="v">8.6</div></div><div class="vital flag"><div class="k">Hgb</div><div class="v">9.7</div></div><div class="vital flag"><div class="k">PLT</div><div class="v">64</div></div><div class="vital flag"><div class="k">AST</div><div class="v">82</div></div><div class="vital"><div class="k">ALT</div><div class="v">38</div></div><div class="vital"><div class="k">ALP</div><div class="v">156</div></div><div class="vital flag"><div class="k">T bili</div><div class="v">4.8</div></div><div class="vital flag"><div class="k">INR</div><div class="v">2.1</div></div><div class="vital flag"><div class="k">Albumin</div><div class="v">2.3</div></div><div class="vital flag"><div class="k">Na</div><div class="v">126</div></div><div class="vital"><div class="k">Cr</div><div class="v">0.8</div></div></div><div class="scorebox"><div class="tile"><div class="n">27</div><div class="l">MELD 3.0</div></div></div>`},
{ch:"hrs",type:"text",layout:"right",section:"Large-Volume Paracentesis",body:`<p class="lead">He undergoes large-volume paracentesis.</p><div class="scorebox"><div class="tile"><div class="n">10 L</div><div class="l">Removed</div></div><div class="tile"><div class="n">Clear</div><div class="l">Ascites</div></div><div class="tile"><div class="n">Relief</div><div class="l">At first</div></div></div><p>He breathes easier. The hernia is softer. Then, minutes later, the nurse calls you back into the room.</p>`},
{ch:"hrs",type:"question-open",layout:"left",section:"He Becomes Hypotensive",stem:`Right after paracentesis, Adam becomes lightheaded and diaphoretic.<br><br><div class="vitals"><div class="vital flag"><div class="k">BP</div><div class="v">78/44</div></div><div class="vital flag"><div class="k">MAP</div><div class="v">55</div></div><div class="vital flag"><div class="k">HR</div><div class="v">118</div></div></div><b>What do you think is happening?</b>`,reveal:`<span class="tag">Syndrome</span><p class="big">Post-paracentesis circulatory dysfunction.</p><p>The term used most often in the literature is paracentesis-induced circulatory dysfunction, or PICD. Removing a large volume can drop effective arterial blood volume, trigger neurohormonal vasoconstriction, and set up hyponatremia, renal injury, and rapid ascites recurrence.</p>`},
{ch:"hrs",type:"question-open",layout:"right",section:"Could This Have Been Prevented?",nudgeLeft:true,stem:`He just had <b>10 L</b> removed.<br><br><b>What may have prevented this episode?</b>`,reveal:`<span class="tag">Prevention</span><p><b>Albumin with large-volume paracentesis.</b> When 5 L or more are removed, give roughly 6 to 8 g of albumin per liter removed.</p><div class="scorebox"><div class="tile"><div class="n">10 L</div><div class="l">Removed</div></div><div class="tile"><div class="n">60-80 g</div><div class="l">Albumin range</div></div></div><p>A flat 25 g dose after a 10 L tap is not the same intervention.</p>`},
{ch:"hrs",type:"text",layout:"left",section:"Blood Pressure Recovers",body:`<p class="lead">He receives about <b>80 g</b> of albumin.</p><p>His blood pressure improves, mentation returns to baseline, and the team holds diuretics and other nephrotoxic or blood-pressure-lowering medications.</p><div class="callout"><span class="lab">But watch the kidneys</span><p>Hemodynamics may look better before renal perfusion has fully recovered.</p></div>`},
{ch:"hrs",type:"text",layout:"left",section:"The Next Morning",wide:true,body:`<p class="lead">The next morning, the creatinine is no longer reassuring.</p><div class="vitals"><div class="vital"><div class="k">Cr before tap</div><div class="v">0.8</div></div><div class="vital flag"><div class="k">Cr now</div><div class="v">2.2</div></div><div class="vital flag"><div class="k">Na</div><div class="v">124</div></div><div class="vital flag"><div class="k">BUN</div><div class="v">49</div></div><div class="vital"><div class="k">Repeat PMN</div><div class="v">84</div></div><div class="vital"><div class="k">UA</div><div class="v">Bland</div></div></div><p>He is not bleeding, has no SBP on repeat tap, and his blood pressure has stabilized after albumin.</p>`},
{ch:"hrs",type:"question-open",layout:"right",section:"What Is Happening to His Kidneys?",stem:`His creatinine rises from <b>0.8 to 2.2</b> after the paracentesis episode.<br><br><b>What do you think is happening?</b>`,reveal:`<span class="tag">Working diagnosis</span><p class="big">HRS-AKI.</p><p>More precisely: suspected HRS-AKI after a circulatory hit, once shock, infection, nephrotoxins, obstruction, and structural kidney disease are being excluded.</p>`},
{ch:"hrs",type:"text",layout:"left",section:"HRS-AKI Checklist",wide:true,boost:true,body:`<p class="lead">HRS-AKI is a diagnosis of physiology plus exclusion. Click each Adam's result cell to reveal the finding and its status.</p><div class="checklist-blur"><table class="scoretable checklist-table"><tr><th>Box to check</th><th>Adam's result</th><th>Status</th></tr><tr><td>Cirrhosis with ascites</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="0" aria-label="Reveal Adam's result for cirrhosis with ascites"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>Known decompensated cirrhosis, tense ascites</span></button></td><td class="points"><span class="checklist-status" data-checklist-status="0" hidden>&#10003;</span></td></tr><tr><td>AKI by creatinine change</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="1" aria-label="Reveal Adam's result for AKI by creatinine change"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>0.8 to 2.2 mg/dL</span></button></td><td class="points"><span class="checklist-status" data-checklist-status="1" hidden>&#10003;</span></td></tr><tr><td>No ongoing shock</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="2" aria-label="Reveal Adam's result for ongoing shock"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>MAP stabilized after albumin, no pressors at this moment</span></button></td><td class="points"><span class="checklist-status" data-checklist-status="2" hidden>&#10003;</span></td></tr><tr><td>No nephrotoxin driver</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="3" aria-label="Reveal Adam's result for nephrotoxin exposure"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>Diuretics and lisinopril held; no NSAIDs or contrast</span></button></td><td class="points"><span class="checklist-status" data-checklist-status="3" hidden>&#10003;</span></td></tr><tr><td>No infection explaining AKI</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="4" aria-label="Reveal Adam's result for infection"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>Repeat PMN 84; blood and urine cultures negative to date</span></button></td><td class="points"><span class="checklist-status" data-checklist-status="4" hidden>&#10003;</span></td></tr><tr><td>No structural kidney injury</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="5" aria-label="Reveal Adam's result for structural kidney injury"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>Bland UA, minimal protein, renal ultrasound without obstruction</span></button></td><td class="points"><span class="checklist-status" data-checklist-status="5" hidden>&#10003;</span></td></tr><tr><td>No response to volume expansion</td><td class="checklist-result"><button class="checklist-result-btn" data-checklist-result="6" aria-label="Reveal Adam's result for volume expansion"><span class="checklist-prompt">Click to reveal</span><span class="checklist-answer" hidden>Albumin challenge is the next test</span></button></td><td class="points"><span class="checklist-status pending" data-checklist-status="6" hidden>Pending</span></td></tr></table></div>`},
{ch:"hrs",type:"text",layout:"right",section:"Albumin Challenge",body:`<p class="lead">He receives <b>1 g/kg/day</b> of albumin for 2 days while diuretics remain held.</p><div class="scorebox"><div class="tile"><div class="n">2.2</div><div class="l">Cr before</div></div><div class="tile"><div class="n">2.7</div><div class="l">Cr after</div></div><div class="tile"><div class="n">No</div><div class="l">Renal response</div></div></div><p>At this point, the findings now support HRS-AKI. Renal dysfunction is progressing despite volume expansion.</p>`},
{ch:"hrs",type:"question-open",layout:"left",section:"The Albumin Challenge Fails",stem:`After 2 days of albumin, his creatinine is now <b>2.7</b>.<br><br><b>What is the next step in management?</b>`,reveal:`<span class="tag">Vasoconstrictor</span><p class="big"><span class="drug-emphasis">Terlipressin</span> plus albumin.</p><p>The goal is to reverse pathologic splanchnic vasodilation, restore effective arterial blood volume, and improve kidney perfusion. The drug decision depends heavily on oxygenation, ischemia risk, ACLF grade, and creatinine level.</p>`},
{ch:"hrs",type:"text",layout:"right",section:"The Pathophysiology of HRS-AKI",wide:true,titleOnly:true,cakeTitle:true,body:`<p class="lead">Advanced cirrhosis produces marked splanchnic vasodilation.</p><p>The dilated splanchnic vascular bed sequesters blood and reduces effective arterial blood volume.</p><p>In advanced cirrhosis, that is happening persistently. Splanchnic vasodilation steals effective arterial blood volume from the kidney, brain, and systemic circulation. The kidney clamps down, sodium and water retention accelerate, and creatinine rises even though the kidney tissue may look bland.</p><div class="callout"><span class="lab">Why terlipressin</span><p>It squeezes the splanchnic bed, trying to return effective perfusion pressure to the kidney.</p></div>`},
{ch:"hrs",type:"text",layout:"left",section:"Is Terlipressin Safe for Everyone?",wide:true,body:`<p class="lead">Terlipressin requires careful patient selection.</p><div class="grid2"><div><h3>Avoid or stop</h3><ul><li>ACLF grade 3</li><li>Hypoxia or worsening respiratory symptoms</li><li>Active or high risk cardiac, mesenteric, peripheral, or coronary ischemia</li><li>Creatinine above 5 mg/dL: benefit is unlikely</li></ul></div><div><h3>Before each dose</h3><ul><li>Check oxygen saturation</li><li>Assess volume overload</li><li>Recheck ischemic symptoms and ECG concern</li><li>Stop if respiratory failure or ischemia develops</li></ul></div></div>`},
{ch:"hrs",type:"text",layout:"right",section:"What Did CONFIRM Show?",wide:true,boost:true,body:`<div class="trialmeta">CONFIRM trial <span class="sep">&middot;</span> N Engl J Med 2021 <span class="sep">&middot;</span> adults with HRS type 1 / HRS-AKI <span class="pmid">PMID 33657294</span></div><p>Terlipressin plus albumin improved verified HRS reversal compared with albumin alone, but the safety signal is real: respiratory failure was more frequent, especially in very sick or volume-overloaded patients.</p><div class="scorebox"><div class="tile"><div class="n">32%</div><div class="l">Verified reversal</div></div><div class="tile"><div class="n">17%</div><div class="l">Placebo arm</div></div><div class="tile"><div class="n">Black box</div><div class="l">Respiratory failure</div></div></div><div class="callout"><span class="lab">Label logic</span><p>Do not start in hypoxia. Do not use with ongoing ischemia. Be very cautious in ACLF grade 3 and advanced renal failure, where risk rises and benefit falls.</p></div>`},
{ch:"hrs",type:"text",layout:"left",section:"How Sick Is Adam Now?",wide:true,body:`<p class="lead">Adam becomes newly encephalopathic with a rising bilirubin while the creatinine continues to climb.</p><table class="scoretable"><tr><th>CLIF organ system</th><th>Adam now</th><th>Counts?</th></tr><tr><td>Kidney</td><td>Creatinine 2.7 mg/dL</td><td class="points">Failure</td></tr><tr><td>Liver</td><td>Total bilirubin 13.1 mg/dL</td><td class="points">Failure</td></tr><tr><td>Brain</td><td>West Haven grade III encephalopathy</td><td class="points">Failure</td></tr></table><div class="scorebox"><div class="tile"><div class="n">3</div><div class="l">Organ failures</div></div><div class="tile"><div class="n">ACLF-3</div><div class="l">Grade</div></div></div><p class="em">The new encephalopathy is the third organ failure that changes the terlipressin decision.</p>`},
{ch:"icu",type:"question-open",layout:"right",section:"When Terlipressin Is Unsafe",stem:`Adam is now ACLF grade 3.<br><br><b>What would you do next?</b>`,reveal:`<span class="tag">ICU path</span><p class="big">Norepinephrine, with or without vasopressin.</p><p>If terlipressin is unsafe, use ICU vasopressor support plus albumin and close monitoring. The aim is to restore organ perfusion, not simply normalize the blood pressure.</p>`},
{ch:"icu",type:"text",layout:"left",section:"What MAP Should You Target?",body:`<p class="lead">His MAP is <b>70</b>.</p><div class="scorebox"><div class="tile"><div class="n">70</div><div class="l">Current MAP</div></div><div class="tile"><div class="n">+10</div><div class="l">Target rise</div></div><div class="tile"><div class="n">80</div><div class="l">Working goal</div></div></div><p>Try to raise the MAP by about 10 mm Hg and watch the creatinine and urine output. Creatinine and urine output provide practical measures of the perfusion response.</p>`},
{ch:"icu",type:"text",layout:"right",section:"Prognosis",wide:true,body:`<p class="lead">HRS-AKI indicates advanced circulatory dysfunction and carries a poor prognosis.</p><ul><li>Older natural-history cohorts of type 1 HRS showed very short survival without reversal or transplant.</li><li>Modern vasoconstrictors can reverse creatinine in a subset, but transplant-free survival remains poor when ACLF, infection, respiratory failure, or multiorgan failure dominate.</li><li>Dialysis changes potassium, acid, volume, and uremia. It does not fix portal hypertension or liver failure.</li></ul>`},
{ch:"txp",type:"question-open",layout:"left",section:"A Critical Decision Point",stem:`Adam has HRS-AKI and ACLF grade 3.<br><br><b>So what do you want to do next?</b>`,reveal:`<span class="tag">Priority</span><p class="big">Check transplant candidacy urgently.</p><p>Clarify sobriety and treatment engagement, infection control, cardiopulmonary risk, malignancy screening, social support, frailty, goals of care, and whether the transplant center would consider him a candidate if his kidneys worsen.</p>`},
{ch:"txp",type:"question-open",layout:"right",section:"When Dialysis Is Appropriate",stem:`His creatinine keeps rising and he becomes oliguric.<br><br><b>Would you start dialysis?</b>`,reveal:`<span class="tag">Role of dialysis</span><p class="big">When it provides a bridge to transplant or recovery from a reversible insult.</p><p>Dialysis can buy time for transplant evaluation, organ offer, or recovery from a reversible insult. If he is not a candidate and liver failure is the driver, dialysis often adds burden without changing the outcome. That should trigger a direct goals-of-care conversation.</p>`},
{ch:"post",type:"text",layout:"left",spiral:true,preserveImage:true,mobileFullBleedImage:"cirrhosis-complications-algorithm.png",kicker:"Spiral",section:"The Cirrhosis Spiral",image:"cirrhosis-spiral.png",imagePos:"center center",imageSize:"contain",imageFade:"sides",imageBg:"#f7f3eb",body:`<p class="spiral-final-line">Treat the cause. Prevent the next decompensation. Think transplant early.</p>`},
{ch:"post",type:"text",layout:"left",eastVibes:true,section:"EAST-VIBES",image:"east-vibes-cirrhosis-assessment.jpg",imagePos:"center center",imageSize:"cover",imageFade:"sides",imageBg:"#f7f3eb",body:`<ol class="east-vibes-list"><li><span class="east-vibes-initial">E</span><span class="east-vibes-term">Etiology</span><span class="east-vibes-description">Cause + completed workup</span></li><li><span class="east-vibes-initial">A</span><span class="east-vibes-term">Activity</span><span class="east-vibes-description">Ongoing injury + disease control</span></li><li><span class="east-vibes-initial">S</span><span class="east-vibes-term">Severity</span><span class="east-vibes-description">MELD 3.0 + decompensations</span></li><li><span class="east-vibes-initial">T</span><span class="east-vibes-term">Transplant</span><span class="east-vibes-description">Indication + candidacy</span></li><li class="east-vibes-break"><span class="east-vibes-initial">V</span><span class="east-vibes-term">Volume</span><span class="east-vibes-description">Ascites, edema, HRS</span></li><li><span class="east-vibes-initial">I</span><span class="east-vibes-term">Infection</span><span class="east-vibes-description">Active infection, SBP/SBE</span></li><li><span class="east-vibes-initial">B</span><span class="east-vibes-term">Bleeding</span><span class="east-vibes-description">Source + prophylaxis</span></li><li><span class="east-vibes-initial">E</span><span class="east-vibes-term">Encephalopathy</span><span class="east-vibes-description">Grade, triggers, treatment</span></li><li><span class="east-vibes-initial">S</span><span class="east-vibes-term">Screening</span><span class="east-vibes-description">Imaging + AFP every 6 months</span></li></ol>`},

const CASE_INSERTS=[
  {after:'The Portal Vein', slide:{ch:"found",type:"text",layout:"left",clinicalFramework:true,section:"Clinical Consequences of Cirrhosis",image:"cirrhosis-two-processes-clinical-manifestations.jpg",imagePos:"center center",imageSize:"contain",imageFade:"sides",imageBg:"#f7f3eb",body:`<p class="lead">Reduced hepatic function and increased portal pressure develop in parallel.</p><p>Their effects account for the major manifestations of decompensated cirrhosis.</p><p class="framework-link"><em>Illustration adapted from Netter&rsquo;s Atlas of Gastroenterology.</em></p>`}},
  {after:'Physical Examination', slide:{ch:'tap',type:"question-open",layout:'left',clinicalAssessmentLabs:true,section:'Clinical Assessment',stem:`<div class="vitals"><div class="vital flag"><div class="k">PLT</div><div class="v">145</div></div><div class="vital"><div class="k">BMP</div><div class="v">Normal</div></div><div class="vital flag"><div class="k">AST</div><div class="v">86</div></div><div class="vital"><div class="k">ALT</div><div class="v">54</div></div><div class="vital"><div class="k">INR</div><div class="v">1.1</div></div></div><b>Which findings raise concern for advanced liver disease?</b><br><br><b>What would be the next step in management?</b>`,reveal:`<span class="tag">Discussion</span><p>The platelet count, AST &gt; ALT pattern, alcohol history, metabolic risk, and family history should trigger concern for compensated advanced liver disease.</p><p>Next steps: calculate a fibrosis score, obtain noninvasive fibrosis assessment such as elastography, evaluate common causes, counsel alcohol cessation, and make sure follow-up actually happens.</p>`}},
  {after:'Clinical Assessment', slide:{ch:'tap',type:"text",layout:'left',returnGap:true,hideTitle:true,section:'He Does Not Return',body:`<p class="return-gap-line">He does not return after this initial visit with you.</p>`}},
  {after:'Initial Ascitic Fluid Studies', slide:{ch:'tap',type:"question-open",layout:'right',section:'Ascitic Fluid Cultures',stem:`<b>Do you send ascitic fluid cultures?</b>`,reveal:`<span class="tag">Answer</span><p class="big">Yes, but you need to know what to do with them and how to interpret them.</p><p>A positive culture with PMN below 250 is not the same as SBP. Management then depends on symptoms, repeat tap, and whether the patient is evolving toward neutrocytic infection.</p>`}},
  {after:'Protecting the Kidneys', slide:{ch:'sbp',type:"question-open",layout:'left',section:'Is the SBP Responding?',stem:`Adam has received ceftriaxone and albumin for <b>48 hours</b>. His fever and abdominal pain are improving.<br><br>His initial ascitic PMN count was <b>960/mm&sup3;</b>.<br><br><b>What should you do now?</b>`,reveal:`<span class="tag">Re-tap and reassess</span><p>Repeat diagnostic paracentesis and recalculate the ascitic PMN count. A decrease of <b>at least 25%</b> from baseline supports an appropriate antibiotic response.</p><div class="scorebox"><div class="tile"><div class="n">960</div><div class="l">Initial PMN</div></div><div class="tile"><div class="n">&ge;25%</div><div class="l">Expected fall</div></div><div class="tile"><div class="n">&le;720</div><div class="l">Adequate response</div></div></div><p>If the PMN falls by less than 25%, remains unchanged, or rises, reassess cultures and susceptibilities, broaden antibiotics when appropriate, and investigate resistant infection or secondary peritonitis.</p><div class="callout"><span class="lab">Clinical nuance</span><p>The 48-hour re-tap is most valuable when improvement is uncertain, resistance is plausible, or secondary peritonitis is a concern. With clear clinical improvement and an identified susceptible organism, some experts consider it optional.</p></div>`}}
];
CASE_INSERTS.forEach(ins=>{
  const at=SLIDES.findIndex(s=>s.section===ins.after);

});

  {after:'Protecting the Kidneys', slide:{ch:'sbp',type:"text",wide:true,boost:true,chartLarge:true,layout:'left',kicker:'Landmark Trial',section:'Why Albumin Matters',body:`<div class="trialmeta">Sort et&nbsp;al. <span class="sep">&middot;</span> N&nbsp;Engl&nbsp;J&nbsp;Med 1999 <span class="sep">&middot;</span> 126 patients, 7 centers <span class="pmid">PMID 10432325</span></div><p>This trial established the evidence for albumin in SBP. Patients with SBP were randomized to cefotaxime alone or cefotaxime plus <span class="hl">albumin 1.5&nbsp;g/kg on day&nbsp;1 and 1&nbsp;g/kg on day&nbsp;3</span>. Infection cleared in both arms alike &mdash; the benefit was hemodynamic, not antibacterial.</p><div class="chartwrap"><div class="ctitle">Outcomes by treatment arm</div><div class="legend"><span class="key"><span class="sw" style="background:#a45d65"></span>Cefotaxime alone</span><span class="key"><span class="sw" style="background:#3e7954"></span>Cefotaxime&nbsp;+&nbsp;albumin</span></div><svg viewBox="0 0 700 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Outcomes in the SBP albumin trial"><defs><radialGradient id="glowSort" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#faf8f2" stop-opacity="0.52"/><stop offset="40%" stop-color="#faf8f2" stop-opacity="0.38"/><stop offset="72%" stop-color="#faf8f2" stop-opacity="0.11"/><stop offset="100%" stop-color="#faf8f2" stop-opacity="0"/></radialGradient></defs><ellipse cx="377" cy="182" rx="332" ry="176" fill="url(#glowSort)"/><line x1="78" y1="316.0" x2="676" y2="316.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="68" y="320.0" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">0%</text><line x1="78" y1="261.6" x2="676" y2="261.6" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="68" y="265.6" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">10%</text><line x1="78" y1="207.2" x2="676" y2="207.2" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="68" y="211.2" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">20%</text><line x1="78" y1="152.8" x2="676" y2="152.8" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="68" y="156.8" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">30%</text><line x1="78" y1="98.4" x2="676" y2="98.4" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="68" y="102.4" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">40%</text><line x1="78" y1="44.0" x2="676" y2="44.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="68" y="48.0" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">50%</text><line x1="78" y1="316" x2="676" y2="316" stroke="#8a8478" stroke-width="1.5"/><rect class="barGrow" x="136.0" y="136.5" width="48" height="179.5" rx="2" fill="#a45d65"/><text x="160.0" y="127.5" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#1d1b19" class="fadeIn">33%</text><rect class="barGrow" x="196.0" y="261.6" width="48" height="54.4" rx="2" fill="#3e7954"/><text x="220.0" y="252.6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#1d1b19" class="fadeIn">10%</text><text x="190" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#4f4a42">Renal impairment</text><text x="190" y="359" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#7e786e">P = 0.002</text><rect class="barGrow" x="328.0" y="158.2" width="48" height="157.8" rx="2" fill="#a45d65"/><text x="352.0" y="149.2" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#1d1b19" class="fadeIn">29%</text><rect class="barGrow" x="388.0" y="261.6" width="48" height="54.4" rx="2" fill="#3e7954"/><text x="412.0" y="252.6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#1d1b19" class="fadeIn">10%</text><text x="382" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#4f4a42">In-hospital death</text><text x="382" y="359" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#7e786e">P = 0.01</text><rect class="barGrow" x="520.0" y="93.0" width="48" height="223.0" rx="2" fill="#a45d65"/><text x="544.0" y="84.0" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#1d1b19" class="fadeIn">41%</text><rect class="barGrow" x="580.0" y="196.3" width="48" height="119.7" rx="2" fill="#3e7954"/><text x="604.0" y="187.3" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#1d1b19" class="fadeIn">22%</text><text x="574" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#4f4a42">Death at 3 months</text><text x="574" y="359" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#7e786e">P = 0.03</text></svg><div class="chartcap">Renal impairment fell by roughly two thirds, and in-hospital mortality dropped from 29% to 10%.</div></div><div class="callout"><span class="lab">Why it works</span><p>SBP collapses effective arterial blood volume, firing the renin&ndash;angiotensin system and starving the kidney. Albumin defends oncotic pressure and circulating volume &mdash; renin ran higher in the antibiotic-only arm, and those patients had the worst kidneys. That is why the dose is weight-based, not a flat 25&nbsp;g.</p></div>`}},
  {after:'GI Bleeding in Cirrhosis', slide:{ch:'var',type:"text",wide:true,boost:true,layout:'right',kicker:'The Evidence',softThird:true,section:'Why Antibiotics Matter',body:`<div class="trialmeta">Ch&aacute;vez-Tapia et&nbsp;al. <span class="sep">&middot;</span> Cochrane review 2011 <span class="sep">&middot;</span> 12 RCTs, 1,241 patients <span class="pmid">PMID 21707680</span></div><p>Prophylactic antibiotics given <span class="hl">at presentation</span> &mdash; before any infection is documented &mdash; reduce mortality. Pooled across a dozen trials, every outcome favors treatment.</p><div class="chartwrap"><div class="ctitle">Relative risk with antibiotic prophylaxis (95% CI)</div><svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relative risks with antibiotic prophylaxis"><defs><radialGradient id="glowForest" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#faf8f2" stop-opacity="0.52"/><stop offset="40%" stop-color="#faf8f2" stop-opacity="0.38"/><stop offset="72%" stop-color="#faf8f2" stop-opacity="0.11"/><stop offset="100%" stop-color="#faf8f2" stop-opacity="0"/></radialGradient></defs><ellipse cx="432" cy="132" rx="342" ry="132" fill="url(#glowForest)"/><line x1="196.0" y1="30" x2="196.0" y2="232.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="196.0" y="250.0" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#7e786e">0.1</text><line x1="337.9" y1="30" x2="337.9" y2="232.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="337.9" y="250.0" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#7e786e">0.25</text><line x1="445.3" y1="30" x2="445.3" y2="232.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="445.3" y="250.0" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#7e786e">0.5</text><line x1="552.6" y1="30" x2="552.6" y2="232.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="552.6" y="250.0" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#7e786e">1.0</text><line x1="660.0" y1="30" x2="660.0" y2="232.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="660.0" y="250.0" text-anchor="middle" font-family="Georgia,serif" font-size="12.5" fill="#7e786e">2</text><line x1="552.6" y1="30" x2="552.6" y2="232.0" stroke="#8a8478" stroke-width="1.5" stroke-dasharray="4 4"/><text x="196" y="26" text-anchor="start" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#3e7954">← favors antibiotics</text><text x="660" y="26" text-anchor="end" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#a45d65">favors control →</text><text x="24" y="59.0" font-family="Georgia,serif" font-size="15.5" fill="#1d1b19">All-cause mortality</text><line class="fadeIn" x1="481.1" y1="54.0" x2="549.5" y2="54.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="481.1" y1="48.0" x2="481.1" y2="60.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="549.5" y1="48.0" x2="549.5" y2="60.0" stroke="#ae8845" stroke-width="2.4"/><rect class="fadeIn" x="508.1" y="46.0" width="16" height="16" rx="2.5" fill="#ae8845" stroke="#fff" stroke-width="1.5"/><text x="660.0" y="43.0" text-anchor="end" font-family="Georgia,serif" font-size="13.5" font-weight="bold" fill="#1d1b19">RR 0.79</text><text x="24" y="111.0" font-family="Georgia,serif" font-size="15.5" fill="#1d1b19">Bacterial infection</text><line class="fadeIn" x1="349.8" y1="106.0" x2="442.2" y2="106.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="349.8" y1="100.0" x2="349.8" y2="112.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="442.2" y1="100.0" x2="442.2" y2="112.0" stroke="#ae8845" stroke-width="2.4"/><rect class="fadeIn" x="386.4" y="98.0" width="16" height="16" rx="2.5" fill="#ae8845" stroke="#fff" stroke-width="1.5"/><text x="660.0" y="95.0" text-anchor="end" font-family="Georgia,serif" font-size="13.5" font-weight="bold" fill="#1d1b19">RR 0.36</text><text x="24" y="163.0" font-family="Georgia,serif" font-size="15.5" fill="#1d1b19">Rebleeding</text><line class="fadeIn" x1="402.8" y1="158.0" x2="506.0" y2="158.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="402.8" y1="152.0" x2="402.8" y2="164.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="506.0" y1="152.0" x2="506.0" y2="164.0" stroke="#ae8845" stroke-width="2.4"/><rect class="fadeIn" x="446.3" y="150.0" width="16" height="16" rx="2.5" fill="#ae8845" stroke="#fff" stroke-width="1.5"/><text x="660.0" y="147.0" text-anchor="end" font-family="Georgia,serif" font-size="13.5" font-weight="bold" fill="#1d1b19">RR 0.53</text><text x="24" y="215.0" font-family="Georgia,serif" font-size="15.5" fill="#1d1b19">SBP</text><line class="fadeIn" x1="258.8" y1="210.0" x2="465.6" y2="210.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="258.8" y1="204.0" x2="258.8" y2="216.0" stroke="#ae8845" stroke-width="2.4"/><line class="fadeIn" x1="465.6" y1="204.0" x2="465.6" y2="216.0" stroke="#ae8845" stroke-width="2.4"/><rect class="fadeIn" x="352.9" y="202.0" width="16" height="16" rx="2.5" fill="#ae8845" stroke="#fff" stroke-width="1.5"/><text x="660.0" y="199.0" text-anchor="end" font-family="Georgia,serif" font-size="13.5" font-weight="bold" fill="#1d1b19">RR 0.29</text></svg><div class="chartcap">All-cause mortality RR&nbsp;0.79; the entire forest sits left of the no-effect line.</div></div><div class="callout"><span class="lab">At the bedside</span><p>Give it up front, not after cultures return. IV ceftriaxone is preferred in advanced cirrhosis and where fluoroquinolone resistance is common; a quinolone is an option in lower-risk patients. Continue up to 7&nbsp;days.</p></div>`}},
  {after:'Endoscopy Findings', slide:{ch:'var',type:"text",wide:true,boost:true,layout:'right',kicker:'Landmark Trial',section:'The Evidence for Early TIPS',body:`<div class="trialmeta">Garc&iacute;a-Pag&aacute;n et&nbsp;al. <span class="sep">&middot;</span> N&nbsp;Engl&nbsp;J&nbsp;Med 2010 <span class="sep">&middot;</span> 63 patients <span class="pmid">PMID 20573925</span></div><p>Not every bleeder &mdash; the trial enrolled only <span class="hl">high-risk</span> patients: Child&ndash;Pugh C below 14, or Child&ndash;Pugh B still bleeding at endoscopy. They received a PTFE-covered TIPS within 72&nbsp;hours instead of waiting to see whether drugs and banding would hold.</p><div class="chartwrap"><div class="ctitle">One-year survival</div><div class="legend"><span class="key"><span class="sw" style="background:#3e7954"></span>Early TIPS</span><span class="key"><span class="sw" style="background:#a45d65"></span>Drugs&nbsp;+&nbsp;band ligation</span></div><svg viewBox="0 0 700 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One-year survival, early TIPS vs standard care"><defs><radialGradient id="glowKm" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#faf8f2" stop-opacity="0.52"/><stop offset="40%" stop-color="#faf8f2" stop-opacity="0.38"/><stop offset="72%" stop-color="#faf8f2" stop-opacity="0.11"/><stop offset="100%" stop-color="#faf8f2" stop-opacity="0"/></radialGradient></defs><ellipse cx="333" cy="178" rx="300" ry="166" fill="url(#glowKm)"/><line x1="70" y1="312.0" x2="596" y2="312.0" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="60" y="316.0" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">0</text><line x1="70" y1="257.6" x2="596" y2="257.6" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="60" y="261.6" text-anchor="end" font-family="Georgia,serif" font-size="13" fill="#7e786e">20</text><line x1="70" y1="203.2" x2="596" y2="203.2" stroke="rgba(93,83,68,.18)" stroke-width="1"/><text x="60" y="207.2 .7 40.0 L 113.8 40.0 L 113.8 48.2 L 166.4 48.2 L 166.4 53.6 L 201.5 53.6 L 201.5 59.0 L 289.2 59.0 L 289.2 64.5 L 376.8 64.5 L 376.8 69.9 L 464.5 69.9 L 464.5 72.6 L 552.2 72.6 L 552.2 76.7 L 596.0 76.7 L 596.0 78.1" fill="none" stroke="#3e7954" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path class="kmline" style="--len:1200" d="M 70.0 40.0 L 96.3 40.0 L 96.3 50.9 L 122.6 50.9 L 122.6 67.2 L 157.7 67.2 L 157.7 83.5 L 201.5 83.5 L 201.5 97.1 L 267.2 97.1 L 267.2 110.7 L 333.0 110.7 L 333.0 121.6 L 420.7 121.6 L 420.7 132.5 L 508.3 132.5 L 508.3 140.6 L 596.0 140.6 L 596.0 146.1" fill="none" stroke="#a45d65" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="596.0" cy="78.1" r="4" fill="#3e7954"/><text class="fadeIn" x="606.0" y="79.1" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#3e7954">86%</text><text class="fadeIn" x="606.0" y="96.1" font-family="Georgia,serif" font-size="12" fill="#4f4a42">early TIPS</text><circle cx="596.0" cy="146.1" r="4" fill="#a45d65"/><text class="fadeIn" x="606.0" y="147.1" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#a45d65">61%</text><text class="fadeIn" x="606.0" y="164.1" font-family="Georgia,serif" font-size="12" fill="#4f4a42">drugs + EBL</text><text class="fadeIn" x="333.0" y="230.4" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#1d1b19">P &lt; 0.001</text></svg><div class="chartcap">Curves reconstructed from the reported 1-year actuarial survival (86% vs 61%); the step shape is illustrative, not patient-level data.</div></div><div class="callout"><span class="lab">Key secondary outcome</span><p>Freedom from failure-to-control bleeding or rebleeding was 97% vs 50% at one year &mdash; with no excess encephalopathy. &ldquo;Early&rdquo; means pre-emptive: placed in the right patient before the next bleed, not as rescue after it.</p></div>`}}

function preloadBackgroundImages(){
  [...new Set(SLIDES.flatMap(s=>[s.image,s.revealImage]).filter(Boolean))].forEach(src=>{
    if(loadedBackgrounds.has(src)) return;
    const img=new Image();
    const record={img,loaded:false,promise:null};
    record.promise=new Promise(resolve=>{
      img.onload=()=>{record.loaded=true;resolve(true)};
      img.onerror=()=>{record.loaded=true;resolve(false)};
    });
    img.decoding='async';

    img.src=src;
    if(img.complete){record.loaded=true;record.promise=Promise.resolve(true)}

  });

function waitForBackground(src){
  if(!src) return Promise.resolve(true);
  const record=loadedBackgrounds.get(src);
  if(!record) return Promise.resolve(true);
  if(record.loaded) return Promise.resolve(true);
  return Promise.race([
    record.promise,
    new Promise(resolve=>setTimeout(()=>resolve(false),1200))
  ]);
}
function clearLayerImageEdgeFade(layer){
  layer.classList.remove('fade-sides');
  layer.style.removeProperty('-webkit-mask-image');
  layer.style.removeProperty('mask-image');
  layer.style.removeProperty('--image-left-edge');
  layer.style.removeProperty('--image-right-edge');
  layer.style.removeProperty('--image-edge-fade');
}
function updateLayerImageEdgeFade(layer){
  clearLayerImageEdgeFade(layer);
  const image=layer.dataset.visualImage||'';
  const size=layer.dataset.visualSize||'cover';
  const fade=layer.dataset.visualFade||'';
  if(!image||!['left','right','sides'].includes(fade)) return;
  if(fade==='left'){
    const mask='linear-gradient(90deg,transparent 0,transparent 12%,#000 52%,#000 100%)';
    layer.style.setProperty('-webkit-mask-image',mask);
    layer.style.setProperty('mask-image',mask);
    layer.classList.add('fade-sides');
    return;
  }
  if(fade==='right'){
    const mask='linear-gradient(90deg,#000 0,#000 48%,transparent 88%,transparent 100%)';
    layer.style.setProperty('-webkit-mask-image',mask);
    layer.style.setProperty('mask-image',mask);
    layer.classList.add('fade-sides');
    return;
  }
  if(size!=='contain') return;
  const record=loadedBackgrounds.get(image);
  const imageWidth=record&&record.img.naturalWidth;
  const imageHeight=record&&record.img.naturalHeight;
  const stageWidth=stage.clientWidth;
  const stageHeight=stage.clientHeight;
  if(!imageWidth||!imageHeight||!stageWidth||!stageHeight) return;
  const scale=Math.min(stageWidth/imageWidth,stageHeight/imageHeight);
  const renderedWidth=imageWidth*scale;
  const remaining=Math.max(0,stageWidth-renderedWidth);
  if(remaining<=4) return;
  const position=(layer.dataset.visualPos||'center').toLowerCase();
  const imageLeft=position.includes('left')?0:position.includes('right')?remaining:remaining/2;
  const imageRight=imageLeft+renderedWidth;
  const rightGap=stageWidth-imageRight;
  const edgeFade=Math.min(96,Math.max(38,renderedWidth*.055),renderedWidth*.16);
  const stops=[];
  if(imageLeft>4) stops.push('transparent 0',`transparent ${imageLeft}px`,`#000 ${imageLeft+edgeFade}px`);
  else stops.push('#000 0');
  if(rightGap>4) stops.push(`#000 ${imageRight-edgeFade}px`,`transparent ${imageRight}px`,'transparent 100%');
  else stops.push('#000 100%');
  const mask=`linear-gradient(90deg,${stops.join(',')})`;
  layer.style.setProperty('--image-left-edge',`${imageLeft}px`);
  layer.style.setProperty('--image-right-edge',`${imageRight}px`);
  layer.style.setProperty('--image-edge-fade',`${edgeFade}px`);
  layer.style.setProperty('-webkit-mask-image',mask);
  layer.style.setProperty('mask-image',mask);
  layer.classList.add('fade-sides');
}
function setLayerBackground(layer,image,pos,size,fade){
  layer.style.backgroundImage=image ? `url("${image}")` : 'linear-gradient(120deg,#e8e1d3,#d5d1c8)';
  layer.style.backgroundPosition=pos||'center';
  layer.style.backgroundSize=size||'cover';
  const visualKey=`${image}|${pos}|${size}|${fade}`;
  layer.dataset.visualKey=visualKey;
  layer.dataset.visualImage=image||'';
  layer.dataset.visualPos=pos||'center';
  layer.dataset.visualSize=size||'cover';
  layer.dataset.visualFade=fade||'';
  updateLayerImageEdgeFade(layer);
  const record=image&&loadedBackgrounds.get(image);
  if(record&&!record.loaded){
    record.promise.then(()=>{if(layer.dataset.visualKey===visualKey) updateLayerImageEdgeFade(layer)});
  }
}
function applyStageBackground(s,c,{instant=false}={}){
  const {image,pos,size,fade,bg}=visualStateFor(s);
  const stageBg=bg||c.bg;
  if(currentBackground.bg!==stageBg){
    stage.style.setProperty('--bg',stageBg);
    currentBackground.bg=stageBg;
  }
  if(hasAppliedInitialBackground&&currentBackground.image===image&&currentBackground.pos===pos&&currentBackground.size===size&&currentBackground.fade===fade) return;
  const token=++bgSwapToken;
  if(instant||prefersReducedMotion||!hasAppliedInitialBackground){
    setLayerBackground(activeBgLayer,image,pos,size,fade);
    activeBgLayer.classList.add('is-active');
    inactiveBgLayer.classList.remove('is-active');
    currentBackground.image=image;
    currentBackground.pos=pos;
    currentBackground.size=size;
    currentBackground.fade=fade;
    hasAppliedInitialBackground=true;
    return;
  }
  waitForBackground(image).then(()=>{
    if(token!==bgSwapToken) return;
    setLayerBackground(inactiveBgLayer,image,pos,size,fade);
    inactiveBgLayer.classList.remove('is-active');
    inactiveBgLayer.offsetHeight;
    requestAnimationFrame(()=>{
      if(token!==bgSwapToken) return;
      inactiveBgLayer.classList.add('is-active');
      activeBgLayer.classList.remove('is-active');
      const oldActive=activeBgLayer;
      activeBgLayer=inactiveBgLayer;
      inactiveBgLayer=oldActive;
      currentBackground.image=image;
      currentBackground.pos=pos;
      currentBackground.size=size;
      currentBackground.fade=fade;
    });
  });
}
