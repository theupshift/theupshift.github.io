function caseQrSVG(matrix){
  if(!Array.isArray(matrix)||!matrix.length) return '';
  const size=matrix.length, shapes=[];
  matrix.forEach((row,y)=>{
    [...row].forEach((module,x)=>{
      if(module!=='1') return;
      const finder=(y<=7&&x<=7)||(y<=7&&x>=size-8)||(y>=size-8&&x<=7);
      shapes.push(finder?`<rect x="${x}" y="${y}" width="1" height="1"/>`:`<rect x="${x+.04}" y="${y+.04}" width=".92" height=".92" rx=".22"/>`);
    });
  });
  return `<svg class="case-qr-svg" viewBox="-3 -3 ${size+6} ${size+6}" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><rect x="-3" y="-3" width="${size+6}" height="${size+6}" rx="1" fill="#f7f3eb"/><g fill="currentColor">${shapes.join('')}</g></svg>`;
}
function caseQrCard(s){
  if(!s.qrUrl||!s.qrMatrix) return '';
  const label=s.qrUrl.replace(/^https?:\/\//,'');
  return `<aside class="case-qr-card"><a class="case-qr-link" href="${s.qrUrl}" target="_blank" rel="noopener noreferrer" aria-label="Open the Cirrhosis interactive clinical case">${caseQrSVG(s.qrMatrix)}<span class="case-qr-label">Scan to open this case</span><span class="case-qr-url">${label}</span></a></aside>`;
}
function htmlFor(s){
  if(s.type==='background-only') return `<img class="background-only-image" src="${s.image}" alt="${s.section||'Clinical case diagram'}" draggable="false">`;
  if(s.type==='title') return titleHTML(s);
  if(s.type==='closing') return `<div class="closing-content"><h1>${s.title}</h1><p class="closing-sub">${s.sub}</p><div class="closing-actions">${s.actions.map(a=>`<span>${a}</span>`).join('')}</div></div>`;
  if(s.titleOnly) return shell(s,'');
  if(s.eastVibes) return shell(s,`<div class="panel">${s.body}</div>`);
  if(s.type==='text'||s.type==='recap') return `${s.mobileFullBleedImage?`<img class="mobile-full-bleed-image" src="${s.mobileFullBleedImage}" alt="Cirrhosis complications and treatment pathway" draggable="false">`:''}${shell(s,`<div class="panel">${s.finalRecap&&s.qrUrl?`<div class="final-recap-grid"><div>${s.body}</div>${caseQrCard(s)}</div>`:s.body}</div>`)}`;
  if(s.type==='question-open') return shell(s,`<div class="panel"><div class="qstem">${s.stem}</div>${s.openQuestionOnly?'':`<button class="reveal-btn" data-act="reveal">Reveal answer</button><div class="answer" data-answer hidden>${s.reveal}</div>`}</div>`);
  if(s.type==='question-mc') return shell(s,`<div class="panel"><div class="qstem">${s.stem}</div><div class="options">${s.options.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="mark">${String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`).join('')}</div><div class="answer" data-answer hidden><span class="tag">${s.answerTag||'Why'}</span>${s.rationale}</div></div>`);
  if(s.type==='table') return shell(s,tableHTML(s));
  return '';
}
function tableHTML(s){
  if(s.focusTable) return ascitesMatrixHTML(s);
  if(s.syndromeTable) return syndromeMatrixHTML(s);
  const values=s.values?`<div class="case-strip">${s.values.map(v=>`<div class="case-chip"><span class="k">${v.k}</span><span class="v">${v.v}</span><span class="s">${v.s}</span></div>`).join('')}</div>`:'';
  const table=`<table class="gtable"><tr><td></td>${s.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${s.rowLabels.map((rl,r)=>`<tr><th class="rowh">${rl}</th>${s.cols.map((_,cc)=>`<td><div class="cell" data-r="${r}" data-c="${cc}"><span class="q">?</span></div></td>`).join('')}</tr>`).join('')}</table>`;
  return `<div class="panel${s.focusTable?' table-focus':''}"><p class="qstem">${s.intro}</p>${values}<div class="table-stage">${table}</div><div class="table-tools"><button class="reveal-btn" data-act="revealTable">Reveal all</button>${s.txLabels?`<button class="reveal-btn" data-act="showTx" hidden>Show treatment</button>`:''}</div><div class="answer" data-answer hidden>${s.note}</div></div>`
}
function ascitesMatrixHTML(s){
  const values=s.values?`<div class="case-strip matrix-strip">${s.values.map(v=>`<div class="case-chip"><span class="k">${v.k}</span><span class="v">${v.v}</span><span class="s">${v.s}</span></div>`).join('')}</div>`:'';
  const q='<span class="am-question">?</span>';
  return `<div class="panel table-focus ascites-panel"><p class="qstem">${s.intro}</p>${values}<div class="matrix-scroll"><div class="ascites-matrix" aria-label="Ascites classification by SAAG and total protein"><div class="am-cell am-ascites">Ascites</div><div class="am-cell am-saag">SAAG</div><div class="am-cell am-side"><span class="am-rot">Total Protein</span></div><div class="am-cell am-protein am-protein-high"><b>&ge; 2.5</b><span>(Post-hepatic)</span></div><div class="am-cell am-protein am-protein-low"><b>&lt; 2.5</b><span>(Pre- &amp; intrahepatic)</span></div><div class="am-cell am-head am-blue"><b>&ge; 1.1</b><span>(Portal hypertension)</span></div><div class="am-cell am-head am-green"><b>&lt; 1.1</b><span>(Non-portal hypertension)</span></div><button class="am-cell am-body am-blue" data-matrix-cell="1-0">${q}<span class="am-content"><ul><li>CHF</li><li>Constrictive pericarditis / tamponade</li><li>IVC obstruction</li><li>Early Budd-Chiari</li></ul></span></button><button class="am-cell am-body am-green" data-matrix-cell="1-1">${q}<span class="am-content"><ul><li>Malignancy</li><li>Peritoneal carcinomatosis</li><li>TB</li><li>Serositis</li><li>Pancreatic ascites</li></ul></span></button><button class="am-cell am-body am-blue am-target" data-matrix-cell="0-0" data-matrix-target>${q}<span class="am-content"><ul><li><b>Cirrhosis</b></li><li>Portal vein thrombosis</li><li>Late Budd-Chiari</li></ul></span></button><button class="am-cell am-body am-green" data-matrix-cell="0-1">${q}<span class="am-content"><ul><li>Nephrotic syndrome</li></ul></span></button><div class="am-cell am-note" data-matrix-note hidden>Urinary and Chylous ascites</div></div></div><div class="answer" data-answer hidden>${s.note}</div></div>`
}
function syndromeMatrixHTML(s){
  const cell=(r,c)=>{
    const item=s.cells[r][c], key=`${r}-${c}`;
    const tx=item.treat===true?'Treat':item.treat===false?'No antibiotics':'Treat if symptomatic';
    const txClass=item.treat===true?'sm-treat':item.treat===false?'sm-no':'sm-if';
    return `<button class="sm-cell sm-body ${txClass}${item.target?' sm-target':''}" data-syndrome-cell="${key}"><span class="sm-q">?</span><span class="sm-content"><span class="sm-name">${item.name}</span><span class="sm-sub">${item.sub}</span><span class="sm-tx">${tx}</span></span></button>`;
  };
  return `<div class="panel syndrome-panel"><p class="qstem">${s.intro}</p><div class="matrix-scroll"><div class="syndrome-matrix"><div class="sm-cell sm-corner"></div><div class="sm-cell sm-head">${s.cols[0]}</div><div class="sm-cell sm-head">${s.cols[1]}</div><div class="sm-cell sm-rowh">${s.rowLabels[0]}</div>${cell(0,0)}${cell(0,1)}<div class="sm-cell sm-rowh">${s.rowLabels[1]}</div>${cell(1,0)}${cell(1,1)}</div></div><div class="syndrome-tools"><span class="tx-prompt" data-tx-prompt hidden>Which syndromes need antibiotic treatment?</span><button class="reveal-btn" data-act="showSyndromeTx" hidden>Reveal treatment answer</button></div><div class="answer" data-answer hidden>${s.note}</div></div>`
}
function fillCell(el,cell,labels,tx,isTarget=false){
  el.classList.add('revealed');
  if(isTarget) el.classList.add('target');
  let txText='';
  if(tx&&labels){
    if(cell.treat===true) el.classList.add('treat');
    if(cell.treat===false||cell.treat===null) el.classList.add('notreat');
    txText=`<span class="tx">${labels[String(cell.treat)]||''}</span>`;
  }
  el.innerHTML=`<div><span class="name">${cell.name}</span>${cell.sub?`<span class="sub">${cell.sub}</span>`:''}${txText}</div>`;
}
function applyMcClasses(s){
  slideEl.querySelectorAll('.opt').forEach((o,j)=>{
    o.classList.add('locked');
    if(s.options[j].correct) o.classList.add('correct');
    else if(j===s._chosen) o.classList.add('wrong');
    else o.classList.add('dim');
  });
}
function wire(s){
  const rb=slideEl.querySelector('[data-act="reveal"]');
  if(rb) rb.addEventListener('click',()=>{
    slideEl.querySelector('[data-answer]').hidden=false;
    rb.style.display='none';
    s._done=true;
    slideEl.classList.add('answer-revealed');
    if(s.revealImage){
      const visual=visualStateFor(s);
      applyStageBackground(s,meta(s));
      slideEl.style.setProperty('--content-bg-image',`url("${visual.image}")`);
      slideEl.style.setProperty('--content-bg-position',visual.pos);
    }
    updateChrome();
  });
  slideEl.querySelectorAll('[data-opt]').forEach(btn=>btn.addEventListener('click',()=>{
    if(s._answered) return; s._answered=true; s._chosen=+btn.dataset.opt;
    applyMcClasses(s);
    slideEl.querySelector('[data-answer]').hidden=false; s._done=true; updateChrome();
  }));
  const checklistResults=slideEl.querySelectorAll('[data-checklist-result]');
  if(checklistResults.length){
    const revealChecklistResult=btn=>{
      if(btn.classList.contains('is-revealed')) return;
      btn.classList.add('is-revealed');
      btn.disabled=true;
      btn.setAttribute('aria-expanded','true');
      const prompt=btn.querySelector('.checklist-prompt');
      const answer=btn.querySelector('.checklist-answer');
      const status=slideEl.querySelector(`[data-checklist-status="${btn.dataset.checklistResult}"]`);
      if(prompt) prompt.hidden=true;
      if(answer) answer.hidden=false;
      if(status) status.hidden=false;
      const revealed=s._checklistRevealed||(s._checklistRevealed=[]);
      if(!revealed.includes(btn.dataset.checklistResult)) revealed.push(btn.dataset.checklistResult);
      if(revealed.length>=checklistResults.length){s._done=true;updateChrome()}
    };
    checklistResults.forEach(btn=>btn.addEventListener('click',()=>revealChecklistResult(btn)));
    if(s._checklistRevealed&&s._checklistRevealed.length){
      s._checklistRevealed.forEach(key=>{
        const btn=slideEl.querySelector(`[data-checklist-result="${key}"]`);
        if(btn) revealChecklistResult(btn);
      });
    }
  }
  if(s.type==='table'){
    const matrixCells=slideEl.querySelectorAll('[data-matrix-cell]');
    if(matrixCells.length){
      const revealMatrixCell=el=>{
        if(el.classList.contains('is-revealed')) return;
        el.classList.add('is-revealed');
        const revealed=s._matrixRevealed||(s._matrixRevealed=[]);
        if(!revealed.includes(el.dataset.matrixCell)) revealed.push(el.dataset.matrixCell);
        if(revealed.length>=matrixCells.length){
          const matrix=slideEl.querySelector('.ascites-matrix');
          if(matrix) matrix.classList.add('is-complete');
          const note=slideEl.querySelector('[data-matrix-note]');
          if(note) note.hidden=false;
        }
        if(el.hasAttribute('data-matrix-target')){
          el.classList.add('is-highlighted');
          const ans=slideEl.querySelector('[data-answer]'); if(ans) ans.hidden=false;
          s._done=true; updateChrome();
        }
      };
      matrixCells.forEach(el=>el.addEventListener('click',()=>revealMatrixCell(el)));
      if(s._matrixRevealed&&s._matrixRevealed.length){
        s._matrixRevealed.forEach(key=>{
          const el=slideEl.querySelector(`[data-matrix-cell="${key}"]`);
          if(el&&!el.classList.contains('is-revealed')) revealMatrixCell(el);
        });
      }
      return;
    }
    const syndromeCells=slideEl.querySelectorAll('[data-syndrome-cell]');
    if(syndromeCells.length){
      const updateSyndromeTreatmentPrompt=()=>{
        const allRevealed=[...syndromeCells].every(el=>el.classList.contains('is-revealed'));
        if(txBtn) txBtn.hidden=!allRevealed;
        if(txPrompt) txPrompt.hidden=!allRevealed;
      };
      const revealSyndromeCell=el=>{
        if(el.classList.contains('is-revealed')) return;
        el.classList.add('is-revealed');
        const revealed=s._syndromeRevealed||(s._syndromeRevealed=[]);
        if(!revealed.includes(el.dataset.syndromeCell)) revealed.push(el.dataset.syndromeCell);
        updateSyndromeTreatmentPrompt();
      };
      syndromeCells.forEach(el=>el.addEventListener('click',()=>revealSyndromeCell(el)));
      const txBtn=slideEl.querySelector('[data-act="showSyndromeTx"]');
      const txPrompt=slideEl.querySelector('[data-tx-prompt]');
      if(txBtn) txBtn.addEventListener('click',()=>{
        const matrix=slideEl.querySelector('.syndrome-matrix');
        if(matrix) matrix.classList.add('show-treatment');
        const ans=slideEl.querySelector('[data-answer]'); if(ans) ans.hidden=false;
        txBtn.disabled=true; txBtn.textContent='Treatment shown';
        s._syndromeTx=true; s._done=true; updateChrome();
      });
      if(s._syndromeRevealed&&s._syndromeRevealed.length){
        s._syndromeRevealed.forEach(key=>{
          const el=slideEl.querySelector(`[data-syndrome-cell="${key}"]`);
          if(el&&!el.classList.contains('is-revealed')) revealSyndromeCell(el);
        });
      }
      updateSyndromeTreatmentPrompt();
      if(s._syndromeTx){
        const matrix=slideEl.querySelector('.syndrome-matrix');
        if(matrix) matrix.classList.add('show-treatment');
        const ans=slideEl.querySelector('[data-answer]'); if(ans) ans.hidden=false;
        if(txBtn){txBtn.hidden=false;txBtn.disabled=true;txBtn.textContent='Treatment shown'}
      }
      return;
    }
    const state={tx:!!s._txShown}; const cells=slideEl.querySelectorAll('.cell');
    const applyCell=(el,tx)=>fillCell(el,s.cells[+el.dataset.r][+el.dataset.c],s.txLabels,tx,Array.isArray(s.target)&&s.target[0]===+el.dataset.r&&s.target[1]===+el.dataset.c);
    const reveal=()=>{
      cells.forEach(el=>applyCell(el,state.tx));
      const ans=slideEl.querySelector('[data-answer]'); if(ans) ans.hidden=false;
      const st=slideEl.querySelector('[data-act="showTx"]');
      if(st){ st.hidden=false; if(state.tx){ st.disabled=true; st.textContent='Treatment shown'; } }
      s._revealed=true; s._done=true; updateChrome();
    };
    cells.forEach(el=>el.addEventListener('click',()=>{
      if(el.classList.contains('revealed')) return;
      applyCell(el,state.tx);
      (s._revealedCells||(s._revealedCells=[])).push(el.dataset.r+'-'+el.dataset.c);
    }));
    const rt=slideEl.querySelector('[data-act="revealTable"]'); if(rt) rt.addEventListener('click',reveal);
    const st=slideEl.querySelector('[data-act="showTx"]'); if(st) st.addEventListener('click',()=>{state.tx=true; s._txShown=true; st.disabled=true; st.textContent='Treatment shown'; cells.forEach(el=>applyCell(el,true))});
    if(s._revealed) reveal();
    else if(s._revealedCells&&s._revealedCells.length) s._revealedCells.forEach(key=>{
      const [r,c]=key.split('-'); const el=slideEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if(el&&!el.classList.contains('revealed')) applyCell(el,state.tx);
    });
  }
  if(s._done&&s.type!=='table'){
    const ans=slideEl.querySelector('[data-answer]'); if(ans) ans.hidden=false;
    if(rb) rb.style.display='none';
    if(s.type==='question-mc'&&s._chosen!==undefined) applyMcClasses(s);
  }
}
function updateChrome(){
  const s=SLIDES[idx], c=meta(s), atEnd=idx===SLIDES.length-1;
  const navGroup=navGroupFor(idx);
  progressChapter.textContent=navGroup.label;
  progressTitle.textContent=s.section||s.title||'Case slide';
  actTag.textContent=navGroup.label;
  counter.textContent=`${idx+1} / ${SLIDES.length}`;
  document.getElementById('prev').disabled=idx===0||isTransitioning;
  const next=document.getElementById('next');
  next.disabled=isTransitioning||atEnd;
  next.classList.toggle('is-complete',atEnd);
  nextLabel.textContent=atEnd?'Done':'Next';
  nextIcon.textContent=atEnd?'✓':'›';
  next.setAttribute('aria-label',atEnd?'Case complete':'Next slide');
  progress.innerHTML='';
  SLIDES.forEach((slide,i)=>{
    const seg=document.createElement('button');
    seg.type='button';
    const group=navGroupFor(i);
    const startsChapter=i===group.start-1;
    seg.className='seg'+(startsChapter?' unit-start':'')+(i<idx?' done':'')+(i===idx?' current':'');
    seg.style.setProperty('--seg-color',group.color);
    seg.title=`${i+1}. ${slide.section||slide.title}`;
    seg.setAttribute('aria-label',`Go to slide ${i+1}: ${slide.section||slide.title}`);
    if(i===idx) seg.setAttribute('aria-current','step');
    seg.addEventListener('click',()=>transitionTo(i,i-idx));
    progress.appendChild(seg);
  });
}
function transitionTo(target,direction=0){
  if(isTransitioning||target===idx||target<0||target>=SLIDES.length)return;
  const leavingClass=direction>0?'leaving-next':direction<0?'leaving-prev':'leaving-fade';
  const backgroundWillChange=backgroundKeyFor(target)!==backgroundKeyFor(idx);
  if(prefersReducedMotion){idx=target;render(direction);return;}
  isTransitioning=true;
  updateChrome();
  if(backgroundWillChange) stage.classList.add('is-transitioning');
  slideEl.classList.remove('is-visible','enter-next','enter-prev','enter-fade');
  slideEl.classList.add(leavingClass);
  clearTimeout(transitionTimer);
  transitionTimer=setTimeout(()=>{
    idx=target;
    render(direction);
    if(backgroundWillChange) setTimeout(()=>stage.classList.remove('is-transitioning'),740);
    isTransitioning=false;
    updateChrome();
  },210);
}
function go(d){transitionTo(idx+d,d)}
document.getElementById('next').addEventListener('click',()=>go(1));
document.getElementById('prev').addEventListener('click',()=>go(-1));
const fullscreenButton=document.getElementById('fullscreen');
const fullscreenRoot=document.documentElement;
const fullscreenContent=document.querySelector('.cirrhosis-main .app');
let immersiveFullscreen=false;

function fullscreenSupported(){
  return !!(fullscreenContent && (
    fullscreenContent.requestFullscreen ||
    fullscreenContent.webkitRequestFullscreen ||
    fullscreenRoot.requestFullscreen ||
    fullscreenRoot.webkitRequestFullscreen
  ));
}

function setFullscreenState(on){
  immersiveFullscreen=on;
  document.body.classList.toggle('cirrhosis-fullscreen',on);
  fullscreenRoot.classList.toggle('cirrhosis-fullscreen',on);
  if(fullscreenButton){
    fullscreenButton.textContent=on?'Exit Fullscreen':'Fullscreen';
    fullscreenButton.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');
    fullscreenButton.setAttribute('title',on?'Exit fullscreen':'Fullscreen');
  }
}

async function enterFullscreen(){
  const target=fullscreenContent||fullscreenRoot;
  try{
    if(target.requestFullscreen){
      await target.requestFullscreen({navigationUI:'hide'});
      return true;
    }
    if(target.webkitRequestFullscreen){
      target.webkitRequestFullscreen();
      return true;
    }
  }catch(error){
    console.warn('Fullscreen API request failed; using immersive page mode.',error);
  }
  setFullscreenState(true);
  return false;
}

async function exitFullscreen(){
  try{
    if(document.fullscreenElement&&document.exitFullscreen){
      await document.exitFullscreen();
      return true;
    }
    if(document.webkitFullscreenElement&&document.webkitExitFullscreen){
      document.webkitExitFullscreen();
      return true;
    }
  }catch(error){
    console.warn('Fullscreen API exit failed; returning to normal page mode.',error);
  }
  setFullscreenState(false);
  return false;
}

if(fullscreenButton){
  fullscreenButton.addEventListener('click',async()=>{
    const nativeFullscreen=!!(document.fullscreenElement||document.webkitFullscreenElement);
    if(nativeFullscreen||immersiveFullscreen) await exitFullscreen();
    else await enterFullscreen();
  });
}

document.addEventListener('fullscreenchange',()=>{
  setFullscreenState(!!document.fullscreenElement);
});
document.addEventListener('webkitfullscreenchange',()=>{
  setFullscreenState(!!document.webkitFullscreenElement);
});

const siteNav=document.querySelector('.site-nav');
function updateNavState(){
  const scrolled=slideEl?slideEl.scrollTop>8:false;
  if(siteNav) siteNav.classList.toggle('is-scrolled',scrolled);
}
if(slideEl) slideEl.addEventListener('scroll',updateNavState,{passive:true});
updateNavState();

function resetAll(){
  SLIDES.forEach(s=>{delete s._done;delete s._answered;delete s._revealed;delete s._chosen;delete s._txShown;delete s._revealedCells;delete s._matrixHighlighted;delete s._matrixRevealed;delete s._syndromeRevealed;delete s._syndromeTx;delete s._checklistRevealed});
  isTransitioning=false;
  clearTimeout(transitionTimer);
  stage.classList.remove('is-transitioning');
  idx=0;
  render(0);
}
document.getElementById('reset').addEventListener('click',resetAll);
const resetCaseButton=document.getElementById('reset-case');
if(resetCaseButton) resetCaseButton.addEventListener('click',resetAll);
const escapeFullscreenButton=document.getElementById('escape-fullscreen');
if(escapeFullscreenButton) escapeFullscreenButton.addEventListener('click',async()=>{
  if(immersiveFullscreen||document.fullscreenElement||document.webkitFullscreenElement) await exitFullscreen();
});
document.addEventListener('keydown',e=>{
  const interactiveTarget=e.target instanceof Element&&e.target.closest('button,a,input,select,textarea,[contenteditable="true"]');
  if((e.code==='Space'||e.key===' ')&&!e.repeat&&!interactiveTarget){
    const revealButton=slideEl.querySelector('[data-act="reveal"]');
    if(revealButton&&!revealButton.disabled&&revealButton.offsetParent!==null){
      revealButton.click();
      e.preventDefault();
      return;
    }
  }
  if(e.key==='Escape'&&(immersiveFullscreen||document.fullscreenElement||document.webkitFullscreenElement)){exitFullscreen();e.preventDefault();return}
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(1);e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);e.preventDefault()}
});
window.addEventListener('hashchange',()=>{
  const target=slideIndexFromHash();
  if(target===null||target===idx) return;
  transitionTo(target,target-idx);
});
let gestureStart=null;
stage.addEventListener('touchstart',e=>{
  if(e.touches.length!==1||e.target.closest('button,a,input,select,textarea,.background-only-image,.table-stage,.matrix-scroll,.scoretable,.checklist-blur,.chartwrap')){gestureStart=null;return}
  gestureStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
stage.addEventListener('touchend',e=>{
  if(!gestureStart||e.changedTouches.length!==1)return;
  const dx=e.changedTouches[0].clientX-gestureStart.x;
  const dy=e.changedTouches[0].clientY-gestureStart.y;
  gestureStart=null;
  if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.25)go(dx<0?1:-1);
},{passive:true});
window.addEventListener('resize',()=>{
  syncChecklistBackdrop(SLIDES[idx]);
  syncTerlipressinSafetyBackdrop(SLIDES[idx]);
  updateLayerImageEdgeFade(activeBgLayer);
  updateLayerImageEdgeFade(inactiveBgLayer);
});
slideEl.addEventListener('scroll',()=>{
  syncChecklistBackdrop(SLIDES[idx]);
  syncTerlipressinSafetyBackdrop(SLIDES[idx]);
});
preloadBackgroundImages();
idx=slideIndexFromHash()??0;
render(0);
</script>
