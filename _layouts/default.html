<!doctype html>
<html>
<head>
	<script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
<script async src="//static.getclicky.com/js"></script>

	<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'UA-158309270-1');
</script>

	<meta charset="utf-8">
	<title>
		{% if page.url != '/' %}
			{% if page.title != '' %}
				{{ page.title }} · 
			{% else %}
				{{ page.date | date_to_string }} ·
			{% endif %}
		{% endif %}
		{{ site.title }}
	</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="{{ site.description }}">
	<meta name="author" content="">
	{% feed_meta %}
	<link href="https://micro.blog/8thmagic" rel="me">
	<link rel="stylesheet" href="/assets/css/fonts.css">
	<link rel="stylesheet" href="/assets/css/styles.css">
	<link rel="shortcut icon" type="image/png" href="favicon.png">
	{% seo %}
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>

<nav class="constrained site-nav" aria-label="Primary navigation">
    <div class="site-identity">
        <a class="site-name" href="/">The Upshift</a>
    </div>

    <div class="profile-nav" aria-label="Sections">
        <a href="/" class="{% if page.url == '/' %}current{% endif %}">Posts</a>
        <a href="/about/" class="{% if page.url == '/about/' %}current{% endif %}">About</a>
        <button type="button" class="search-toggle" aria-expanded="false" aria-controls="site-search" aria-label="Search"><i class="fas fa-search"></i></button>
    </div>
    <div id="site-search" class="site-search" hidden>
    <input id="site-search-input" type="search" placeholder="Search posts…" autocomplete="off" aria-label="Search posts">
    <div id="site-search-results" aria-live="polite"></div>
</div>

</nav>

<main class="constrained">
	{{ content }}
</main>

<footer class="constrained" style="
  text-align: center;
  font-size: 0.8em;
  padding: 1em 0 2em;
  white-space: nowrap;
  position: relative;
">
  <a href="#top" style="color: #b35352; text-decoration: none; margin: 0 0.8em;">Top ↑</a> · 
  <span style="margin: 0 0.8em;">© Gamba 2026</span> · 
  <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" target="_blank" aria-label="Share on Twitter" style="margin: 0 0.4em; display: inline-block;">
    <img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" alt="Share on Twitter" width="18" height="18" style="vertical-align: middle;">
  </a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" aria-label="Share on LinkedIn" style="margin: 0 0.4em; display: inline-block;">
    <img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" alt="Share on LinkedIn" width="18" height="18" style="vertical-align: middle;">
  </a>
</footer>

<script>
(function () {
  const toggle = document.querySelector(".search-toggle");
  const search = document.getElementById("site-search");
  const input = document.getElementById("site-search-input");
  const results = document.getElementById("site-search-results");
  if (!toggle || !search || !input || !results) return;

  let posts = [];

  function render(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      results.innerHTML = "";
      return;
    }

    const matches = posts.filter(function (post) {
      return (post.title + " " + post.content).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 10);

    results.innerHTML = matches.length
      ? matches.map(function (post) {
          return '<a class="search-result" href="' + post.url + '"><span class="search-result-title">' +
            post.title + '</span><time>' + post.date + '</time></a>';
        }).join("")
      : '<p class="search-empty">No posts found.</p>';
  }

  toggle.addEventListener("click", function () {
    const opening = search.hidden;
    search.hidden = !opening;
    toggle.setAttribute("aria-expanded", String(opening));

    if (opening) {
      input.focus();

      if (!posts.length) {
        fetch("/search.json")
          .then(function (response) {
            if (!response.ok) throw new Error("Search index unavailable");
            return response.json();
          })
          .then(function (data) {
            posts = data;
            render(input.value);
          })
          .catch(function () {
            results.innerHTML = '<p class="search-empty">Search is temporarily unavailable.</p>';
          });
      }
    } else {
      input.value = "";
      results.innerHTML = "";
    }
  });

  input.addEventListener("input", function () {
    render(input.value);
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !search.hidden) {
      search.hidden = true;
      input.value = "";
      results.innerHTML = "";
      toggle.setAttribute("aria-expanded", "false");
      toggle.focus();
    }
  });
}());
</script>

</body>
</html>
