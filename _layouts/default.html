<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="author" content="Silas Gamba">
  <title>{% if page.url != '/' %}{% if page.title != '' %}{{ page.title }} · {% else %}{{ page.date | date_to_string }} · {% endif %}{% endif %}{{ site.title }}</title>

  <!-- Existing site analytics retained. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-158309270-1');
  </script>
  <script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
  <script async src="https://static.getclicky.com/js"></script>

  {% feed_meta %}
  {% seo %}
  <link rel="me" href="https://micro.blog/8thmagic">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% else %} id="top"{% endif %}>
  <nav class="constrained" aria-label="Main navigation">
    <div class="nav-left">
      <a href="/search" aria-label="Search the site">Search</a>
    </div>
    <div class="nav-center" aria-label="Site identity">
      <a href="/words/index.html">The Upshift</a>
      <em aria-hidden="true">/</em>
      <a href="/">Blog</a>
    </div>
    <div class="nav-right">
      <a class="subscribe-btn" href="https://selcompay.me/61208375?description=Coffee%20for%20Silas" target="_blank" rel="noopener noreferrer">Buy me a coffee <span aria-hidden="true">&nbsp;☕</span></a>
    </div>
  </nav>

  <main class="constrained">
    {{ content }}
  </main>

  <footer class="constrained">
    <a href="#top">Back to top ↑</a>
    <span aria-hidden="true">·</span>
    <span>© Gamba 2026</span>
    <span aria-hidden="true">·</span>
    <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer">Share on X</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer">Share on LinkedIn</a>
  </footer>
</body>
</html>
