<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="Silas Gamba">
  <title>{% if page.url != '/' %}{% if page.title != '' %}{{ page.title }} · {% else %}{{ page.date | date_to_string }} · {% endif %}{% endif %}{{ site.title }}</title>
  {% feed_meta %}
  <link href="https://micro.blog/8thmagic" rel="me">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  {% seo %}
  <!-- Keep the site's existing analytics integrations. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-158309270-1');
  </script>
  <script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
  <script async src="https://static.getclicky.com/js"></script>
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav id="top" class="constrained site-nav" aria-label="Main navigation">
    <div class="nav-left">
      <a href="/search/" aria-label="Search the site" title="Search">⌕</a>
    </div>
    <div class="nav-center">
      <a href="/" aria-label="The Upshift home">The Upshift</a>
    </div>
    <div class="nav-right">
      <a class="nav-text-link" href="/readings.html">Readings</a>
      <a class="subscribe-btn" href="https://selcompay.me/61208375?description=Coffee%20for%20Silas" target="_blank" rel="noopener noreferrer">Buy me ☕</a>
    </div>
  </nav>

  <main class="constrained" id="main-content">
    {{ content }}
  </main>

  <footer class="constrained site-footer">
    <a href="#top">Back to top ↑</a>
    <span aria-hidden="true"> · </span>
    <span>© Gamba 2026</span>
    <span class="footer-share">
      <span aria-hidden="true"> · </span>
      <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer">Share on X</a>
      <span aria-hidden="true"> · </span>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </span>
  </footer>
</body>
</html>
