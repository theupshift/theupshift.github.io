<!doctype html>
<html>
<head>

<script async src="//static.getclicky.com/js"></script>

	<!-- Global site tag (gtag.js) - Google Analytics -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'UA-158309270-1');
</script>

	<meta charset="utf-8">
	<title>
		{% if page.url != '/' %}
			{% if page.title != '' %}
				{{ page.title }} · 
			{% else %}
				{{ page.date | date_to_string }} ·
			{% endif %}
		{% endif %}
		{{ site.title }}
	</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="{{ site.description }}">
	<meta name="author" content="">
	{% feed_meta %}
	<link href="https://micro.blog/8thmagic" rel="me">
	<link rel="stylesheet" href="/assets/css/fonts.css">
	<link rel="stylesheet" href="/assets/css/styles.css">
	<link rel="shortcut icon" type="image/png" href="favicon.png">
	{% seo %}
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>

<nav class="constrained site-nav" aria-label="Primary navigation">
    <div class="site-identity">
        <a class="site-name" href="/">The Upshift</a>
    </div>

    <div class="profile-nav" aria-label="Sections">
        <a href="/" class="{% if page.url == '/' %}current{% endif %}">Posts</a>
        <a href="/about/" class="{% if page.url == '/about/' %}current{% endif %}">About</a>
        <button type="button" class="search-toggle" aria-expanded="false" aria-controls="site-search" aria-label="Search"><i class="fas fa-search"></i></button>
    </div>
</nav>

<div id="site-search" class="site-search" hidden>\n\t<input id="site-search-input" type="search" placeholder="Search posts…" autocomplete="off" aria-label="Search posts">\n\t<div id="site-search-results" aria-live="polite"></div>\n</div>\n\n<main class="constrained">
	{{ content }}
</main>

<footer class="constrained" style="
  text-align: center;
  font-size: 0.8em;
  padding: 1em 0 2em;
  white-space: nowrap;
  position: relative;
">
  <a href="#top" style="color: #b35352; text-decoration: none; margin: 0 0.8em;">Top ↑</a> · 
  <span style="margin: 0 0.8em;">© Gamba 2026</span> · 
  <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" target="_blank" aria-label="Share on Twitter" style="margin: 0 0.4em; display: inline-block;">
    <img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" alt="Share on Twitter" width="18" height="18" style="vertical-align: middle;">
  </a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" aria-label="Share on LinkedIn" style="margin: 0 0.4em; display: inline-block;">
    <img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" alt="Share on LinkedIn" width="18" height="18" style="vertical-align: middle;">
  </a>
</footer>

<script>\n(function () {\n  const toggle = document.querySelector(".search-toggle");\n  const search = document.getElementById("site-search");\n  const input = document.getElementById("site-search-input");\n  const results = document.getElementById("site-search-results");\n  if (!toggle || !search || !input || !results) return;\n\n  let posts = [];\n  let loaded = false;\n\n  function render(query) {\n    const q = query.trim().toLowerCase();\n    if (!q) { results.innerHTML = ""; return; }\n    const matches = posts.filter(function (post) {\n      return (post.title + " " + post.content).toLowerCase().indexOf(q) !== -1;\n    }).slice(0, 10);\n    results.innerHTML = matches.length\n      ? matches.map(function (post) { return '<a class="search-result" href="' + post.url + '"><span class="search-result-title">' + post.title + '</span><time>' + post.date + '</time></a>'; }).join("")\n      : '<p class="search-empty">No posts found.</p>';\n  }\n\n  toggle.addEventListener("click", function () {\n    const open = !search.hidden;\n    search.hidden = open;\n    toggle.setAttribute("aria-expanded", String(!open));\n    if (!open) {\n      input.focus();\n      if (!loaded) {\n        fetch("/search.json").then(function (r) { return r.json(); }).then(function (data) { posts = data; loaded = true; render(input.value); });\n      }\n    } else {\n      input.value = ""; results.innerHTML = "";\n    }\n  });\n\n  input.addEventListener("input", function () { render(input.value); });\n  document.addEventListener("keydown", function (event) {\n    if (event.key === "Escape" && !search.hidden) {\n      search.hidden = true; toggle.setAttribute("aria-expanded", "false"); toggle.focus();\n    }\n  });\n}());\n</script>\n\n</body>
</html>
