<!DOCTYPE html>
<html>
<head>
	<script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
	<script async src="//static.getclicky.com/js"></script>

	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());
	  gtag('config', 'UA-158309270-1');
	</script>

	<meta charset="utf-8">
	<title>
		{% if page.url != '/' %}
			{% if page.title != '' %}
				{{ page.title }} ·
			{% else %}
				{{ page.date | date_to_string }} ·
			{% endif %}
		{% endif %}
		{{ site.title }}
	</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="{{ site.description }}">
	<meta name="author" content="">

	{% feed_meta %}
	<link href="https://micro.blog/8thmagic" rel="me">
	<link rel="stylesheet" href="/assets/css/fonts.css">
	<link rel="stylesheet" href="/assets/css/styles.css">
	<link rel="shortcut icon" type="image/png" href="/favicon.png">
	{% seo %}
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

	<style>
		.nav-left a {
			font-size: 12px;
			color: #fff;
			background-color: #b35352;
			border-radius: 50%;
			padding: 4px;
			display: inline-block;
			text-align: center;
			line-height: 16px;
			width: 20px;
			height: 20px;
		}
		.nav-left a i { font-size: 12px; }
		.subscribe-btn {
			background-color: #b35352;
			color: white;
			padding: 4px 8px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 12px;
			height: 20px;
			line-height: 20px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-family: inherit;
		}
		.subscribe-btn:hover { background-color: #9e3f3f; }
	</style>
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>
	<nav class="constrained" aria-label="Main navigation">
		<div class="nav-left">
			<a href="/search" aria-label="Search"><i class="fas fa-search" aria-hidden="true"></i></a>
		</div>
		<div class="nav-center">
			The <a href="/words/index.html">Upshift</a><em> &nbsp; : &nbsp; </em><a href="/">Blog</a>
		</div>
		<div class="nav-right">
			<a class="subscribe-btn" href="https://selcompay.me/61208375?description=Coffee%20for%20Silas" target="_blank" rel="noopener noreferrer">Buy Me ☕</a>
		</div>
	</nav>

	<main class="constrained">
		{{ content }}
	</main>

	<footer class="constrained">
		<a href="#top" style="color: #b35352; text-decoration: none; margin: 0 0.8em;">Top ↑</a> ·
		<span style="margin: 0 0.8em;">© Gamba 2026</span> ·
		<a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Twitter" style="margin: 0 0.4em; display: inline-block;">
			<img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" alt="Share on Twitter" width="18" height="18" style="vertical-align: middle;">
		</a>
		<a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn" style="margin: 0 0.4em; display: inline-block;">
			<img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" alt="Share on LinkedIn" width="18" height="18" style="vertical-align: middle;">
		</a>
	</footer>
</body>
</html>
