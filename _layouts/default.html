<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="Silas Gamba">
  <title>{% if page.url != '/' %}{% if page.title != '' %}{{ page.title }} · {% else %}{{ page.date | date_to_string }} · {% endif %}{% endif %}{{ site.title }}</title>
  {% feed_meta %}
  <link href="https://micro.blog/8thmagic" rel="me">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('upshift-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
          return;
        }
      } catch (error) {}
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var hour = new Date().getHours();
      var timeDark = hour < 6 || hour >= 18;
      document.documentElement.setAttribute('data-theme', (systemDark || timeDark) ? 'dark' : 'light');
    }());
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css?v=20261004-compact-nav">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  {% seo %}
  <!-- Keep the site's existing analytics integrations. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-158309270-1');
  </script>
  <script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
  <script async src="https://static.getclicky.com/js"></script>
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav id="top" class="constrained site-nav" aria-label="Main navigation">
    <div class="nav-left">
      <a href="/search/" aria-label="Search the site" title="Search">⌕</a>
    </div>
    <div class="nav-center">
      <a href="/" aria-label="The Upshift home">The Upshift</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme">◐</button>
      <div class="site-menu" id="site-menu">
        <button class="site-menu-toggle" id="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu-panel">Menu</button>
        <div class="site-menu-panel" id="site-menu-panel">
          <a href="/words/">About</a>
          <span class="site-menu-separator" aria-hidden="true">·</span>
          <a href="/">Writings</a>
          <span class="site-menu-separator" aria-hidden="true">·</span>
          <a href="/work/">Index</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="constrained" id="main-content">
    {{ content }}
  </main>

  <footer class="constrained site-footer">
    <a href="#top">Back to top ↑</a>
    <span aria-hidden="true"> · </span>
    <span>© Gamba 2026</span>
    <span class="footer-share">
      <span aria-hidden="true"> · </span>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn" title="Share on LinkedIn">
        <svg class="linkedin-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.95v5.66H9.34V8.99h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.62 0 4.29 2.38 4.29 5.48v6.27ZM5.32 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM3.54 20.45H7.1V8.99H3.54v11.46Z"/>
        </svg>
      </a>
      <span aria-hidden="true"> · </span>
      <a href="/archive.html">Archives</a>
    </span>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById('theme-toggle');
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      function currentTheme() {
        var explicit = root.getAttribute('data-theme');
        if (explicit) return explicit;
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var hour = new Date().getHours();
        return (systemDark || hour < 6 || hour >= 18) ? 'dark' : 'light';
      }
      function updateButton() {
        var dark = currentTheme() === 'dark';
        button.setAttribute('aria-pressed', dark ? 'true' : 'false');
        button.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        button.setAttribute('title', dark ? 'Switch to light theme' : 'Switch to dark theme');
        button.textContent = dark ? '☼' : '◐';
        if (metaTheme) metaTheme.setAttribute('content', dark ? '#191213' : '#ffffff');
      }
      var menu = document.getElementById('site-menu');
      var menuToggle = document.getElementById('site-menu-toggle');
      var lastScrollY = window.scrollY;
      var siteNav = document.querySelector('.site-nav');

      function updateNavState() {
        if (siteNav) siteNav.classList.toggle('is-scrolled', window.scrollY > 8);
      }

      function closeMenu() {
        if (!menu.classList.contains('is-open')) return;
        menu.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }

      menuToggle.addEventListener('click', function () {
        var open = menu.classList.toggle('is-open');
        menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      document.addEventListener('click', function (event) {
        if (!menu.contains(event.target)) closeMenu();
      });

      window.addEventListener('scroll', function () {
        var currentY = window.scrollY;
        if (currentY > lastScrollY + 4) closeMenu();
        lastScrollY = currentY;
        updateNavState();
      }, { passive: true });

      button.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('upshift-theme', next); } catch (error) {}
        updateButton();
      });
      updateButton();
      updateNavState();
    }());
  </script>
</body>
</html>
