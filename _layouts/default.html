<!doctype html>
<html>
<head>
	
	
	<script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
<script async src="//static.getclicky.com/js"></script>

	<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-158309270-1');
</script>

	<meta charset="utf-8">
	
	<title>
		{% if page.url != '/' %}
			{% if page.title != '' %}
				{{ page.title }} · 
			{% else %}
				{{ page.date | date_to_string }} ·
			{% endif %}
		{% endif %}
		{{ site.title }}
	</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="{{ site.description }}">
	<meta name="author" content="">
	
	{% feed_meta %}
	<link href="https://micro.blog/8thmagic" rel="me">
	<link rel="stylesheet" href="/assets/css/fonts.css">
	<link rel="stylesheet" href="/assets/css/styles.css">
	<link rel="shortcut icon" type="image/png" href="favicon.png">
	{% seo %}

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
  nav.constrained {
    display: block;
    padding: 64px 0 0;
    width: 100%;
    text-align: center;
  }

  .site-identity {
    text-align: center;
  }

  .site-name {
    font-family: var(--font-small-caps);
    font-size: 1.35em;
    background-image: none;
  }

  .profile-nav {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 28px;
    white-space: nowrap;
  }

  .profile-nav a {
    padding-bottom: 12px;
    font-family: var(--font-small-caps);
    font-size: 13px;
    background-image: none;
    color: rgba(var(--color-text), .55);
  }

  .profile-nav a:hover,
  .profile-nav a.current {
    color: rgb(var(--color-text));
  }

  .profile-nav a.current {
    position: relative;
    font-weight: bold;
  }

  .profile-nav a.current:after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgb(var(--color-accent));
  }

  @media (max-width: 600px) {
    nav.constrained {
      padding-top: 40px;
    }

    .profile-nav {
      gap: 22px;
    }
  }
</style>


	
</head>
<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>



  <nav class="constrained site-nav" aria-label="Primary navigation">
    <div class="site-identity">
      <a class="site-name" href="/">The Upshift</a>
    </div>

    <div class="profile-nav" aria-label="Sections">
      <a href="/" class="{% if page.url == '/' or paginator %}current{% endif %}">Posts</a>
      <a href="/words/index.html" class="{% if page.url == '/words/index.html' %}current{% endif %}">About</a>
      <a href="/search/" class="{% if page.url == '/search/' %}current{% endif %}" aria-label="Search"><i class="fas fa-search"></i></a>
    </div>
  </nav>



	
	<main class="constrained">	
		{{ content }}
	</main>
	
<footer class="constrained" style="
  text-align: center;
  font-size: 0.8em;
  padding: 1em 0 2em;
  white-space: nowrap;
  position: relative;
">

  <a href="#top" style="color: #b35352; text-decoration: none; margin: 0 0.8em;">Top ↑</a> · 
  <span style="margin: 0 0.8em;">© Gamba 2026</span> · 

  <!-- Share to Twitter -->
  <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" 
     target="_blank" aria-label="Share on Twitter" style="margin: 0 0.4em; display: inline-block;">
    <img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" alt="Share on Twitter" width="18" height="18" style="vertical-align: middle;">
  </a>

  <!-- Share to LinkedIn -->
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" 
     target="_blank" aria-label="Share on LinkedIn" style="margin: 0 0.4em; display: inline-block;">
    <img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" alt="Share on LinkedIn" width="18" height="18" style="vertical-align: middle;">
  </a>

</footer>





	
</body>
</html>
