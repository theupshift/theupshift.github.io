<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.url != '/' %}
      {% if page.title != '' %}
        {{ page.title }} ·
      {% else %}
        {{ page.date | date_to_string }} ·
      {% endif %}
    {% endif %}
    {{ site.title }}
  </title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="">

  <script>var clicky_site_ids = clicky_site_ids || []; clicky_site_ids.push(101245280);</script>
  <script async src="//static.getclicky.com/js"></script>

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-158309270-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'UA-158309270-1');
  </script>

  {% feed_meta %}
  <link href="https://micro.blog/8thmagic" rel="me">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  {% seo %}
</head>

<body{% if page.id_attribute %} id="{{ page.id_attribute }}"{% endif %}>

<header class="site-header constrained">
  <nav class="site-nav" aria-label="Primary navigation">
    <div class="site-nav__brand">
      <a href="/">The Upshift</a>
    </div>

    <div class="site-nav__links">
      <a href="/words/index.html"{% if page.id_attribute == 'words' %} class="current"{% endif %}>Words</a>
      <a href="/work.html">Work</a>
      <a href="/colophon.html">About</a>
    </div>

    <div class="site-nav__actions">
      <a href="/search">Search</a>
      <a href="https://selcompay.me/61208375?description=Coffee%20for%20Silas" target="_blank" rel="noopener">Buy me coffee</a>
    </div>
  </nav>
</header>

<main>
  {{ content }}
</main>

<footer class="site-footer">
  <div class="site-footer__links">
    <a href="#top">Top ↑</a>
    <span>·</span>
    <span>© Gamba 2026</span>
    <span>·</span>
    <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}&url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener">Share on X</a>
    <span>·</span>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</footer>

</body>
</html>
