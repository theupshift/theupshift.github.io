---
layout: default
title: Search
---
<style>
#results-container { list-style:none; padding:0; max-width:600px; margin:20px auto; }
.search-result { border:1px solid #ccc; padding:12px; margin-bottom:10px; border-radius:5px; background:#f9f9f9; transition:background-color .2s ease; }
.search-result:hover { background:#e2e8f0; }
.search-result a { color:inherit; text-decoration:none; display:block; }
.search-result h3 { margin:0 0 6px; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:clip; }
.search-result p { margin:0; font-size:14px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:clip; }
#search-input { width:600px; max-width:90%; margin:20px auto; display:block; font-size:16px; padding:10px 14px; border:1px solid #ccc; border-radius:5px; }
</style>
<header class="page-intro"><h1>Search</h1></header>
<input type="text" id="search-input" placeholder="Type to search..." />
<ul id="results-container"></ul>
<script src="https://unpkg.com/simple-jekyll-search/dest/simple-jekyll-search.min.js"></script>
<script>
SimpleJekyllSearch({
  searchInput: document.getElementById('search-input'),
  resultsContainer: document.getElementById('results-container'),
  json: '/search.json',
  searchResultTemplate: '<li class="search-result"><a href="{url}"><h3>{title}</h3><p>{content}</p></a></li>',
  noResultsText: 'No results found',
  limit: 7,
  fuzzy: false
});
</script>
